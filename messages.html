<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PClinic — Messages</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="pclinic-ui.css?v=20260804_CHUK_3ROW">
<link rel="preload" as="style" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css"></noscript>
<script>(function(){try{document.documentElement.setAttribute('data-theme',localStorage.getItem('pclinic-theme')||'light');}catch(e){}})();</script>
<style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--f);background:var(--bg);color:var(--tp);font-size:13px;min-height:100vh;-webkit-font-smoothing:antialiased}
    body::before{content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
        background:radial-gradient(circle at 20% 30%,rgba(0,113,227,.05) 0,transparent 50%),
                   radial-gradient(circle at 80% 70%,rgba(52,199,89,.05) 0,transparent 50%)}
    .wrap{max-width:1240px;margin:0 auto;padding:0 18px 26px}
    .grid{display:grid;grid-template-columns:380px 1fr;gap:14px;align-items:start}
    .panel{background:var(--glass-bg);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
        border:.5px solid var(--glass-brd);border-radius:var(--r2);box-shadow:var(--sh-2),var(--glass-spec);padding:16px}
    .panel h2{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
    .panel h2 i{color:var(--ac)}
    label{display:block;font-size:11px;font-weight:600;color:var(--tm);margin:11px 0 6px;text-transform:uppercase;letter-spacing:.02em}
    textarea,select,input{width:100%;padding:9px 11px;border-radius:9px;border:.5px solid var(--bd);
        background:var(--s1);color:var(--tp);font-family:var(--f);font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s}
    textarea{min-height:92px;resize:vertical}
    select,input{height:34px;padding:0 11px}
    textarea:focus,select:focus,input:focus{border-color:var(--ac);box-shadow:0 0 0 4px var(--acl)}

    /* Recipient tick boxes */
    .recips{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:7px}
    .rc{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;
        border:.5px solid var(--bd);background:var(--s1);cursor:pointer;font-size:12px;font-weight:500;
        transition:all .22s var(--spring);-webkit-tap-highlight-color:transparent}
    .rc:hover{transform:translateY(-1px);box-shadow:var(--sh-1)}
    .rc input{width:16px;height:16px;margin:0;accent-color:var(--ac);cursor:pointer;flex-shrink:0}
    .rc.on{background:var(--acb);border-color:var(--ac);color:var(--ac);font-weight:600}
    .rc i{font-size:14px;opacity:.75}

    .quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
    .quick button{padding:5px 11px;border-radius:30px;border:.5px solid var(--bd);background:var(--s1);
        font-family:var(--f);font-size:11px;font-weight:600;color:var(--ts);cursor:pointer;transition:all .22s var(--spring)}
    .quick button:hover{transform:translateY(-1px);background:var(--acb);color:var(--ac)}

    /* Inbox */
    .tabs{display:inline-flex;padding:3px;gap:2px;border-radius:11px;background:rgba(120,120,128,.14);margin-bottom:12px}
    .tabs button{border:0;background:transparent;font-family:var(--f);font-size:12.5px;font-weight:600;
        color:var(--ts);padding:6px 15px;border-radius:8px;cursor:pointer;transition:all .28s var(--ease)}
    .tabs button.on{background:var(--s1);box-shadow:var(--sh-1)}
    .msg{display:flex;gap:11px;padding:12px 13px;border-radius:11px;border:.5px solid var(--bd);
        background:var(--s1);margin-bottom:8px;transition:all .26s var(--spring)}
    .msg:hover{transform:translateX(3px);box-shadow:var(--sh-1)}
    .msg.unread{border-left:3px solid var(--ac);background:var(--acb)}
    .msg.urgent{border-left:3px solid var(--red)}
    .av{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
        font-size:11px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--ac),var(--purple))}
    .msg .body{flex:1;min-width:0}
    .msg .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:3px}
    .msg .from{font-weight:700;font-size:12.5px}
    .msg .role{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:30px;background:var(--s3);color:var(--tm);text-transform:uppercase}
    .msg .when{font-size:10.5px;color:var(--tm);margin-left:auto}
    .msg .text{font-size:13px;line-height:1.55;word-break:break-word}
    .msg .to{font-size:10.5px;color:var(--tm);margin-top:5px}
    .empty{text-align:center;color:var(--tm);padding:36px 14px;font-size:12.5px}
    .empty i{font-size:34px;opacity:.35;display:block;margin-bottom:9px}
    @media(max-width:900px){.grid{grid-template-columns:1fr}}
</style>
    <script src="pclinic-file.js?v=20260827_FILES" defer></script>
</head>
<body>

<div class="pc-topbar" style="display: none !important;">
    <div class="pc-brand">
        <img class="pc-logo" src="logo-wide.png" alt="PClinic" width="118" height="30">
        <span class="pc-appsub">Messages</span>
    </div>
    <div class="pc-tr">
        <button class="pc-iconbtn" onclick="pcToggleTheme()" title="Dark mode"><i class="ti ti-moon" id="themeIcon"></i></button>
        <div class="pc-chip"><span class="pc-avatar" id="userAvatar">··</span><span id="userName">…</span></div>
        <button class="pc-iconbtn" onclick="pclinicLogout()" title="Sign out"><i class="ti ti-logout"></i></button>
    </div>
</div>

<div class="pc-headerbar">
    <nav class="pc-crumb"><a href="hub.html">🏥 Hub</a><span class="sep">›</span><span>Messages</span></nav>
    <span class="pc-divider"></span>
    <span class="pc-greet">Team messages</span>
    <span class="pc-spacer"></span>
    <span class="pc-quickstat"><i class="ti ti-mail"></i> <span id="unreadN">0</span> unread</span>
    <button class="pc-btn" onclick="markAll()"><i class="ti ti-checks"></i> Mark all read</button>
</div>

<div class="wrap">
<div class="grid">

    <!-- COMPOSE -->
    <div class="panel">
        <h2><i class="ti ti-send"></i> New Message</h2>

        <label>Quick messages</label>
        <div class="quick">
            <button onclick="quick('Please prioritise this patient — thank you.')">Prioritise</button>
            <button onclick="quick('Results are ready for review.')">Results ready</button>
            <button onclick="quick('Patient is waiting, please advise.')">Patient waiting</button>
            <button onclick="quick('Sample collected and sent.')">Sample sent</button>
            <button onclick="quick('Stock running low — please restock.')">Low stock</button>
        </div>

        <label for="msgText">Message</label>
        <textarea id="msgText" data-pc-remember="msgDraft" placeholder="Type your message…"></textarea>

        <label>Send to <span style="text-transform:none;font-weight:400;color:var(--tm)">(tick all that apply)</span></label>
        <div class="recips" id="recips"></div>

        <div style="display:flex;gap:9px;margin-top:12px">
            <div style="flex:1">
                <label for="msgPriority" style="margin-top:0">Priority</label>
                <select id="msgPriority">
                    <option value="normal">Normal</option>
                    <option value="urgent">Urgent</option>
                </select>
            </div>
            <div style="flex:1.4">
                <label for="msgPatient" style="margin-top:0">About a patient <span style="text-transform:none;font-weight:400">(optional)</span></label>
                <select id="msgPatient"><option value="">— none —</option></select>
            </div>
        </div>

        <button class="pc-btn pc-btn-primary" style="width:100%;margin-top:14px" onclick="sendIt()">
            <i class="ti ti-send"></i> Send Message
        </button>
    </div>

    <!-- INBOX -->
    <div class="panel">
        <h2><i class="ti ti-inbox"></i> Inbox</h2>
        <div class="tabs">
            <button class="on" data-f="all" onclick="setFilter('all',this)">All</button>
            <button data-f="unread" onclick="setFilter('unread',this)">Unread</button>
            <button data-f="urgent" onclick="setFilter('urgent',this)">Urgent</button>
            <button data-f="sent" onclick="setFilter('sent',this)">Sent</button>
        </div>
        <div id="inbox"></div>
    </div>

</div>
</div>

<div class="pc-toasts"></div>

<script type="module" src="firebase-config.js"></script>
<script src="auth-guard.js"></script>
<script src="pclinic-state.js"></script>
<script src="patient-data.js"></script>
<script src="pclinic-orders.js"></script>

<script>
(function(){
'use strict';
var filter='all';

var DEPTS=[
    {r:'doctor',    n:'Doctors',    i:'ti-stethoscope'},
    {r:'nurse',     n:'Nurses',     i:'ti-heart-rate-monitor'},
    {r:'lab',       n:'Laboratory', i:'ti-test-pipe'},
    {r:'radio',     n:'Radiology',  i:'ti-radioactive'},
    {r:'pharmacy',  n:'Pharmacy',   i:'ti-pill'},
    {r:'reception', n:'Reception',  i:'ti-user-circle'},
    {r:'cashier',   n:'Cashier',    i:'ti-cash'},
    {r:'finance',   n:'Finance',    i:'ti-credit-card'},
    {r:'theater',   n:'Theatre',    i:'ti-scissors'},
    {r:'physio',    n:'Physio',     i:'ti-accessible'},
    {r:'inventory', n:'Inventory',  i:'ti-package'},
    {r:'hr',        n:'HR',         i:'ti-users'},
    {r:'admin',     n:'Admin',      i:'ti-shield-lock'}
];

function buildRecipients(){
    var box=document.getElementById('recips'); box.innerHTML='';
    DEPTS.forEach(function(d){
        var l=document.createElement('label'); l.className='rc';
        var c=document.createElement('input'); c.type='checkbox'; c.value=d.r;
        var i=document.createElement('i'); i.className='ti '+d.i;
        var s=document.createElement('span'); s.textContent=d.n;
        c.onchange=function(){ l.classList.toggle('on',c.checked); };
        l.append(c,i,s); box.appendChild(l);
    });
}

function loadPatients(){
    var sel=document.getElementById('msgPatient');
    var list=[];
    try{ if(typeof getPatients==='function') list=getPatients()||[]; }catch(e){}
    list.forEach(function(p){
        var o=document.createElement('option'); o.value=p.id;
        o.textContent=(p.name||'')+' · '+(p.mrn||''); sel.appendChild(o);
    });
}

window.quick=function(t){
    var ta=document.getElementById('msgText');
    ta.value=t; ta.focus();
    ta.dispatchEvent(new Event('input',{bubbles:true}));
};

window.sendIt=function(){
    var text=document.getElementById('msgText').value.trim();
    if(!text){ pcToast('Type a message first','error'); return; }
    var roles=[].slice.call(document.querySelectorAll('#recips input:checked')).map(function(c){return c.value;});
    if(!roles.length){ pcToast('Tick at least one recipient','error'); return; }
    var psel=document.getElementById('msgPatient');
    var m=pcMessages.send({
        text:text, toRoles:roles,
        priority:document.getElementById('msgPriority').value,
        patientId:psel.value||null,
        patientName:psel.value?psel.options[psel.selectedIndex].textContent.split('·')[0].trim():'',
        category:'message'
    });
    if(!m){ pcToast('Could not send','error'); return; }
    document.getElementById('msgText').value='';
    try{ pcStore.drop('field:msgDraft'); }catch(e){}
    document.querySelectorAll('#recips input:checked').forEach(function(c){
        c.checked=false; c.parentElement.classList.remove('on');
    });
    pcToast('Sent to '+roles.length+' department'+(roles.length===1?'':'s'),'success');
    render();
};

window.setFilter=function(f,btn){
    filter=f;
    btn.parentElement.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});
    btn.classList.add('on'); render();
};

window.markAll=function(){ pcMessages.markAllRead(); render(); pcToast('All marked read','info'); };

function ago(iso){
    var s=Math.floor((Date.now()-new Date(iso))/1000);
    if(s<60) return 'just now';
    if(s<3600) return Math.floor(s/60)+'m ago';
    if(s<86400) return Math.floor(s/3600)+'h ago';
    return new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}

function render(){
    var me=window.currentStaff||{};
    var list;
    if(filter==='sent'){
        list=pcMessages.list.call ? [] : [];
        // sent = everything I authored; read straight from the store
        try{ list=JSON.parse(localStorage.getItem('pclinic_messages')||'[]')
                 .filter(function(m){return m.fromId===me.staffId;}); }catch(e){ list=[]; }
    } else {
        list=pcMessages.list();
        if(filter==='unread') list=list.filter(function(m){return (m.readBy||[]).indexOf(me.staffId)===-1;});
        if(filter==='urgent') list=list.filter(function(m){return m.priority==='urgent';});
    }

    document.getElementById('unreadN').textContent=pcMessages.unread();

    var box=document.getElementById('inbox');
    if(!list.length){
        box.innerHTML='<div class="empty"><i class="ti ti-inbox"></i>'+
            (filter==='sent'?'You have not sent any messages yet.':'Nothing here.')+'</div>';
        return;
    }
    box.innerHTML='';
    list.slice(0,60).forEach(function(m){
        var unread=(m.readBy||[]).indexOf(me.staffId)===-1 && filter!=='sent';
        var d=document.createElement('div');
        d.className='msg'+(unread?' unread':'')+(m.priority==='urgent'?' urgent':'');

        var av=document.createElement('div'); av.className='av';
        av.textContent=(m.fromName||'?').substring(0,2).toUpperCase();

        var body=document.createElement('div'); body.className='body';
        var top=document.createElement('div'); top.className='top';
        var f=document.createElement('span'); f.className='from'; f.textContent=m.fromName||'System';
        var r=document.createElement('span'); r.className='role'; r.textContent=m.fromRole||'sys';
        var w=document.createElement('span'); w.className='when'; w.textContent=ago(m.at);
        top.append(f,r,w);

        var tx=document.createElement('div'); tx.className='text'; tx.textContent=m.text;
        var to=document.createElement('div'); to.className='to';
        to.textContent='→ '+(m.toRoles||[]).join(', ')+(m.patientName?'  ·  re: '+m.patientName:'');

        body.append(top,tx,to);
        d.append(av,body);
        if(unread) d.onclick=function(){ pcMessages.markRead(m.id); render(); };
        box.appendChild(d);
    });
}

window.addEventListener('messagesUpdated',render);

requireAuth([]).then(function(staff){
    window.currentStaff=staff;
    document.getElementById('userName').textContent=staff.name;
    document.getElementById('userAvatar').textContent=(staff.name||'??').substring(0,2).toUpperCase();
    buildRecipients(); loadPatients(); render();
}).catch(function(){});
})();
</script>
</body>
</html>
