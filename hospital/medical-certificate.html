<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PClinic — Medical Certificate</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="pclinic-ui.css?v=20260804_CHUK_3ROW">
<link rel="preload" as="style" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css"></noscript>
<script>(function(){try{document.documentElement.setAttribute('data-theme',localStorage.getItem('pclinic-theme')||'light');}catch(e){}})();</script>
<style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--f);background:var(--bg);color:var(--tp);font-size:13px;min-height:100vh;-webkit-font-smoothing:antialiased}
    body::before{content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
        background:radial-gradient(circle at 20% 30%,rgba(0,113,227,.05) 0,transparent 50%),
                   radial-gradient(circle at 80% 70%,rgba(52,199,89,.05) 0,transparent 50%)}
    .wrap{max-width:1080px;margin:0 auto;padding:0 18px 26px}
    .grid{display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start}
    .panel{background:var(--glass-bg);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
        border:.5px solid var(--glass-brd);border-radius:var(--r2);box-shadow:var(--sh-2),var(--glass-spec);padding:16px}
    .panel h2{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
    .panel h2 i{color:var(--ac)}
    label{display:block;font-size:10.5px;font-weight:700;color:var(--tm);margin:11px 0 5px;text-transform:uppercase;letter-spacing:.04em}
    input,select,textarea{width:100%;padding:9px 11px;border-radius:9px;border:.5px solid rgba(0,0,0,.1);
        background:var(--s1);color:var(--tp);font-family:var(--f);font-size:13px;outline:none}
    textarea{min-height:80px;resize:vertical}
    input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 4px var(--acl)}
    .row{display:flex;gap:10px}.row>*{flex:1}

    #doc{background:#fff;color:#111;border-radius:var(--r2);padding:34px 38px;box-shadow:var(--sh-2);min-height:420px}
    .dh{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;padding-bottom:15px;border-bottom:2px solid #111}
    .dh .org{font-size:20px;font-weight:800;letter-spacing:-.4px}
    .dh .sub{font-size:11px;color:#666;margin-top:3px;line-height:1.55}
    .dh .meta{text-align:right;font-size:11px;color:#444;line-height:1.7}
    .dtitle{text-align:center;font-size:16px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;margin:22px 0 18px}
    .pinfo{display:grid;grid-template-columns:1fr 1fr;gap:7px 22px;font-size:12.5px;margin-bottom:20px;
        padding:13px 15px;background:#f7f7f9;border-radius:9px}
    .pinfo span{color:#666;display:inline-block;min-width:92px}
    .dbody{font-size:13.5px;line-height:1.85;white-space:pre-wrap;min-height:130px}
    .sig{margin-top:44px;display:flex;justify-content:space-between;gap:50px}
    .sig div{flex:1;border-top:1px solid #999;padding-top:7px;font-size:10.5px;color:#666;text-align:center}
    .stamp{margin-top:22px;font-size:10.5px;color:#888;text-align:center;font-style:italic}

    @media print{
        @page{size:A4;margin:15mm}
        body{background:#fff!important}
        body::before,.pc-topbar,.pc-headerbar,.noprint,.pc-toasts,#pcHandoff{display:none!important}
        .wrap{max-width:none;padding:0} .grid{display:block}
        #doc{box-shadow:none;border-radius:0;padding:0}
    }
    @media(max-width:880px){.grid{grid-template-columns:1fr}}
</style>
    <script src="pclinic-file.js?v=20260804_CHUK_3ROW" defer></script>
</head>
<body>

<div class="pc-topbar noprint" style="display: none !important;">
    <div class="pc-brand">
        <img class="pc-logo" src="logo-wide.png" alt="PClinic" width="118" height="30">
        <span class="pc-appsub">Certificate</span>
    </div>
    <div class="pc-tr">
        <button class="pc-iconbtn" onclick="pcToggleTheme()" title="Dark mode"><i class="ti ti-moon" id="themeIcon"></i></button>
        <div class="pc-chip"><span class="pc-avatar" id="userAvatar">··</span><span id="userName">…</span></div>
        <button class="pc-iconbtn" onclick="pclinicLogout()" title="Sign out"><i class="ti ti-logout"></i></button>
    </div>
</div>

<div class="pc-headerbar noprint">
    <nav class="pc-crumb"><a href="hub.html">🏥 Hub</a><span class="sep">›</span>
        <a href="doctor-dashboard.html">Doctor</a><span class="sep">›</span><span>Medical Certificate</span></nav>
    <span class="pc-spacer"></span>
    <button class="pc-btn" onclick="history.back()"><i class="ti ti-arrow-left"></i> Back</button>
    <button class="pc-btn pc-btn-primary" onclick="window.print()"><i class="ti ti-printer"></i> Print</button>
</div>

<div class="wrap">
<div class="grid">
    <div id="doc"><div style="padding:50px;text-align:center;color:#888">Select a patient to begin…</div></div>

    <div class="panel noprint">
        <h2><i class="ti ti-certificate"></i> Medical Certificate</h2>
        <label for="docFrom">Period from</label><div class="row">
     <input type="date" id="docFrom"><input type="date" id="docTo"></div>
     <label for="docBody">Findings / Purpose</label>
     <textarea id="docBody" data-pc-remember="mcBody" placeholder="This is to certify that the above-named patient was examined and found to be…"></textarea>
        <button class="pc-btn pc-btn-primary" style="width:100%;margin-top:14px" onclick="saveDoc()">
            <i class="ti ti-device-floppy"></i> Save &amp; Print
        </button>
    </div>
</div>
</div>

<div class="pc-toasts noprint"></div>

<script type="module" src="firebase-config.js"></script>
<script src="auth-guard.js"></script>
<script src="pclinic-state.js"></script>
<script src="patient-data.js"></script>
<script src="pclinic-orders.js"></script>

<script>
(function(){
'use strict';
var P=null;
function esc(v){var d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML;}
function age(dob){if(!dob)return'';var d=new Date(dob);if(isNaN(d))return'';
  var a=new Date().getFullYear()-d.getFullYear();var m=new Date().getMonth()-d.getMonth();
  if(m<0||(m===0&&new Date().getDate()<d.getDate()))a--;return a>=0&&a<130?a+' yrs':'';}
function nm(p){return p?(p.name||((p.firstName||'')+' '+(p.lastName||'')).trim()):'';}

function findPatient(){
  var id=new URLSearchParams(location.search).get('patient');
  if(!id){try{id=localStorage.getItem('pclinic_active_patient');}catch(e){}}
  if(!id)return null;
  try{ if(typeof getPatients==='function')
    return (getPatients()||[]).filter(function(x){return String(x.id)===String(id);})[0]||null;
  }catch(e){}
  return null;
}

function render(){
  if(!P){return;}
  var v=document.getElementById('docBody');
  var body=v?v.value:'';
  var extra=window.buildExtra?window.buildExtra():'';
  var staff=window.currentStaff||{};
  document.getElementById('doc').innerHTML=
   '<div class="dh"><div><div class="org">PClinic</div>'+
   '<div class="sub">Hospital Management System<br>Kigali, Rwanda<br>+250 784 446 481</div></div>'+
   '<div class="meta"><div><b>MC-'+String(P.id)+'-'+new Date().getFullYear()+'</b></div>'+
   '<div>'+new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})+'</div></div></div>'+
   '<div class="dtitle">Medical Certificate</div>'+
   '<div class="pinfo">'+
     '<div><span>Patient</span><b>'+esc(nm(P))+'</b></div>'+
     '<div><span>File no.</span>'+esc(P.mrn||('ID '+P.id))+'</div>'+
     '<div><span>Age / Sex</span>'+esc(age(P.dob))+(P.gender?' · '+esc(P.gender):'')+'</div>'+
     '<div><span>District</span>'+esc(P.district||'—')+'</div>'+
     (P.nationalId?'<div><span>National ID</span>'+esc(P.nationalId)+'</div>':'')+
     (P.insurance&&P.insurance.provider?'<div><span>Insurance</span>'+esc(P.insurance.provider)+'</div>':'')+
   '</div>'+
   extra+
   '<div class="dbody">'+esc(body)+'</div>'+
   '<div class="sig"><div>Patient / Guardian</div><div>'+esc(staff.name||'Doctor')+'<br>Attending Physician</div></div>'+
   '<div class="stamp">Issued at PClinic on '+new Date().toLocaleString('en-GB')+' · official hospital document</div>';
}

window.saveDoc=function(){
  if(!P){pcToast('No patient selected','error');return;}
  var body=(document.getElementById('docBody')||{}).value||'';
  if(!body.trim()){pcToast('Fill in the details first','error');return;}
  try{
    var key='pclinic_documents';
    var all=JSON.parse(localStorage.getItem(key)||'[]');
    all.unshift({id:'doc-'+Date.now().toString(36),type:'MC',title:'Medical Certificate',
      patientId:P.id,patientName:nm(P),body:body,
      by:(window.currentStaff||{}).name||'',at:new Date().toISOString()});
    localStorage.setItem(key,JSON.stringify(all.slice(0,300)));
  }catch(e){}
  render();
  pcToast('Medical Certificate saved','success');
  setTimeout(function(){window.print();},450);
};

document.addEventListener('input',function(e){ if(e.target.closest('.panel')) render(); });

requireAuth([]).then(function(staff){
  window.currentStaff=staff;
  document.getElementById('userName').textContent=staff.name;
  document.getElementById('userAvatar').textContent=(staff.name||'??').substring(0,2).toUpperCase();
  var tries=0;
  (function w(){ P=findPatient(); if(P){render();return;} if(++tries<20)setTimeout(w,220);
    else document.getElementById('doc').innerHTML='<div style="padding:50px;text-align:center;color:#888">'+
      '<i class="ti ti-user-off" style="font-size:38px;opacity:.35"></i><p style="margin-top:12px">'+
      'No patient selected.</p><p style="font-size:12px;margin-top:6px">'+
      'Open this from the doctor dashboard with a patient active.</p></div>';
  })();
}).catch(function(){});
})();
</script>
<script src="pclinic-handoff.js"></script>
</body>
</html>
