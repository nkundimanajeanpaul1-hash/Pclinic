<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ═══ FIREBASE + AUTH GUARD ═══ -->
    <script type="module" src="firebase-config.js"></script>
    <script src="auth-guard.js"></script>
<script src="pclinic-state.js"></script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bed Management • PClinic</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <script src="shared.js" defer></script>
    <script src="patient-data.js" defer></script>
    <link rel="stylesheet" href="pclinic-ui.css">
<style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #f0f2f5; --s1: #ffffff; --s2: #f8f9fa; --s3: #f1f3f6; --bd: #e4e7ec;
            --tp: #1a1a2e; --ts: #2d2d44; --tm: #6b7280;
            --ac: #ec4899; --acb: #fdf2f8;
            --green: #10b981; --greenb: #ecfdf5;
            --orange: #f59e0b; --orangeb: #fffbeb;
            --red: #ef4444; --redb: #fef2f2;
            --gradient: linear-gradient(135deg, #ec4899, #f472b6);
            --shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.04);
            --shadow2: 0 4px 20px rgba(0,0,0,.08), 0 12px 40px rgba(0,0,0,.06);
            --r: 10px; --r2: 14px;
            --f: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        [data-theme="dark"] {
            --bg: #0f1117; --s1: #1a1d27; --s2: #14171f; --s3: #222533; --bd: #2d3040;
            --tp: #f0f2f5; --ts: #d1d5db; --tm: #9ca3af;
            --ac: #f472b6; --acb: #3a1a2a;
        }
        body { font-family: var(--f); background: var(--bg); color: var(--tp); font-size: 13px; line-height: 1.6; min-height: 100vh; }
        .topbar {
            display: flex; align-items: center; justify-content: space-between; padding: 8px 24px;
            background: rgba(255,255,255,0.85); backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 0.5px solid var(--bd); position: sticky; top: 0; z-index: 100; height: 56px;
        }
        [data-theme="dark"] .topbar { background: rgba(26,29,39,0.85); }
        .tl { display: flex; align-items: center; gap: 10px; }
        .logo-box { width: 32px; height: 32px; border-radius: 8px; background: var(--gradient); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .appname { font-size: 16px; font-weight: 700; color: var(--tp); }
        .appname span { color: var(--ac); }
        .appsub { font-size: 11px; color: var(--tm); margin-left: 2px; }
        .tr { display: flex; align-items: center; gap: 6px; }
        .tb-btn {
            width: 32px; height: 32px; border-radius: 50%; border: 0.5px solid var(--bd);
            background: var(--s1); display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--tm); font-size: 15px; transition: var(--transition);
        }
        .tb-btn:hover { background: var(--s3); color: var(--tp); }
        .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--tm); padding: 10px 24px 6px; }
        .breadcrumb a { color: var(--ac); text-decoration: none; font-weight: 500; }
        .breadcrumb .current { color: var(--ts); font-weight: 500; }
        .greeting { padding: 12px 24px 6px; }
        .greeting h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
        .greeting h1 .highlight { background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; padding: 12px 24px 8px; }
        .stat-card { background: var(--s1); border: 0.5px solid var(--bd); border-radius: var(--r2); padding: 14px 18px; display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow); }
        .stat-card .icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .stat-card .icon.pink { background: var(--acb); color: var(--ac); }
        .stat-card .icon.green { background: var(--greenb); color: var(--green); }
        .stat-card .icon.orange { background: var(--orangeb); color: var(--orange); }
        .stat-card .icon.red { background: var(--redb); color: var(--red); }
        .stat-card .number { font-size: 22px; font-weight: 800; }
        .stat-card .label { font-size: 12px; color: var(--tm); font-weight: 500; }

        .ward-section { margin: 8px 24px 8px; }
        .ward-title { font-size: 13px; font-weight: 700; color: var(--tm); text-transform: uppercase; letter-spacing: 0.5px; margin: 16px 0 10px; display: flex; align-items: center; gap: 8px; }
        .beds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 8px; }
        .bed-card {
            background: var(--s1); border: 1.5px solid var(--bd); border-radius: var(--r); padding: 12px;
            cursor: pointer; transition: var(--transition); box-shadow: var(--shadow);
        }
        .bed-card:hover { transform: translateY(-2px); box-shadow: var(--shadow2); }
        .bed-card.occupied { border-color: var(--red); background: var(--redb); }
        .bed-card.available { border-color: var(--green); background: var(--greenb); }
        .bed-card.cleaning { border-color: var(--orange); background: var(--orangeb); }
        .bed-card .bed-num { font-size: 14px; font-weight: 800; color: var(--tp); margin-bottom: 4px; }
        .bed-card .bed-status { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
        .bed-card.occupied .bed-status { color: var(--red); }
        .bed-card.available .bed-status { color: var(--green); }
        .bed-card.cleaning .bed-status { color: var(--orange); }
        .bed-card .bed-patient { font-size: 11.5px; color: var(--ts); }

        .legend { display: flex; gap: 16px; padding: 4px 24px 12px; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--tm); }
        .legend-dot { width: 10px; height: 10px; border-radius: 3px; }
        .legend-dot.available { background: var(--green); }
        .legend-dot.occupied { background: var(--red); }
        .legend-dot.cleaning { background: var(--orange); }

        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(6px);
            z-index: 500; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: var(--s1); border-radius: 16px; max-width: 420px; width: 100%; padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .modal-box h3 { font-size: 17px; font-weight: 800; margin-bottom: 14px; }
        .field { margin-bottom: 12px; }
        .field label { display: block; font-size: 10.5px; font-weight: 700; color: var(--tm); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 5px; }
        .field input, .field select { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--bd); background: var(--s2); color: var(--tp); font-size: 12.5px; font-family: var(--f); }
        .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
        .btn { padding: 9px 16px; border-radius: 8px; font-size: 12.5px; font-weight: 600; border: none; cursor: pointer; font-family: var(--f); transition: var(--transition); }
        .btn-green { background: var(--gradient); color: #fff; flex: 1; }
        .btn-outline { background: var(--s3); color: var(--tp); }
        .btn-red { background: var(--redb); color: var(--red); }

        #toastContainer { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 999; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .toast { background: rgba(28,28,30,0.92); color: #fff; border-radius: 12px; padding: 10px 20px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; animation: toastPop 0.4s cubic-bezier(0.34,1.56,0.64,1); }
        .toast.success { background: var(--green); } .toast.error { background: var(--red); } .toast.info { background: var(--ac); }
        @keyframes toastPop { from{opacity:0;transform:translateY(20px) scale(0.9);} to{opacity:1;transform:translateY(0) scale(1);} }
        @keyframes toastOut { from{opacity:1;} to{opacity:0;transform:translateY(-20px) scale(0.9);} }

        @media (max-width: 900px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 700px) {
            .ward-section, .stats-grid, .greeting, .breadcrumb, .legend { padding-left: 16px; padding-right: 16px; margin-left: 0; margin-right: 0; }
        }
    </style>
    <script src="pclinic-file.js" defer></script>
</head>
<body>

    <div class="topbar">
        <div class="tl">
            <div class="logo-box"><img src="logo.png" alt="PClinic" style="width:100%;height:100%;object-fit:cover;border-radius:8px;" onerror="this.style.display='none'" /></div>
            <span class="appname">P<span>clinic</span></span>
            <span class="appsub">Bed Management</span>
        </div>
        <div class="tr">
            <button class="tb-btn" onclick="toggleDarkMode()" title="Toggle Dark Mode"><i class="ti ti-moon" id="themeIcon"></i></button>
            <div class="tb-btn" onclick="logout()" title="Logout"><i class="ti ti-logout"></i></div>
        </div>
    </div>

    <div class="breadcrumb">
        <a href="hub.html">🏥 Hub</a>
        <span style="color:var(--bd);">›</span>
        <span class="current">Bed Management</span>
    </div>

    <div class="greeting">
        <h1>Bed <span class="highlight">Management</span></h1>
        <p style="color:var(--tm); font-size:13px; margin-top:2px;">Ward occupancy and bed allocation, at a glance</p>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><div class="icon pink"><i class="ti ti-bed"></i></div><div><div class="number" id="statTotal">0</div><div class="label">Total Beds</div></div></div>
        <div class="stat-card"><div class="icon green"><i class="ti ti-circle-check"></i></div><div><div class="number" id="statAvailable">0</div><div class="label">Available</div></div></div>
        <div class="stat-card"><div class="icon red"><i class="ti ti-user"></i></div><div><div class="number" id="statOccupied">0</div><div class="label">Occupied</div></div></div>
        <div class="stat-card"><div class="icon orange"><i class="ti ti-droplet"></i></div><div><div class="number" id="statCleaning">0</div><div class="label">Cleaning</div></div></div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="legend-dot available"></span> Available</div>
        <div class="legend-item"><span class="legend-dot occupied"></span> Occupied</div>
        <div class="legend-item"><span class="legend-dot cleaning"></span> Cleaning</div>
    </div>

    <div id="wardsContainer"></div>

    <!-- ═══ BED DETAIL MODAL ═══ -->
    <div class="modal-overlay" id="bedModal" onclick="if(event.target===this) closeBedModal()">
        <div class="modal-box" id="bedModalBody"></div>
    </div>

    <div id="toastContainer"></div>

    <script>
        (function() {
            'use strict';

            const STORAGE_KEY = 'pclinic_beds_data';
            const WARDS = ['General Ward', 'Maternity Ward', 'ICU', 'Pediatric Ward'];
            const BEDS_PER_WARD = 8;

            function loadBeds() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) return JSON.parse(raw);
                } catch (e) {}
                // Seed default layout
                const beds = {};
                WARDS.forEach(ward => {
                    beds[ward] = [];
                    for (let i = 1; i <= BEDS_PER_WARD; i++) {
                        beds[ward].push({ number: ward.split(' ')[0].substring(0, 1) + i, status: 'available', patient: '' });
                    }
                });
                return beds;
            }
            function saveBeds(beds) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(beds));
            }
            let beds = loadBeds();

            function renderAll() {
                let total = 0, available = 0, occupied = 0, cleaning = 0;
                const container = document.getElementById('wardsContainer');
                container.innerHTML = WARDS.map(ward => {
                    const wardBeds = beds[ward] || [];
                    wardBeds.forEach(b => {
                        total++;
                        if (b.status === 'available') available++;
                        else if (b.status === 'occupied') occupied++;
                        else if (b.status === 'cleaning') cleaning++;
                    });
                    const occCount = wardBeds.filter(b => b.status === 'occupied').length;
                    return `
                        <div class="ward-section">
                            <div class="ward-title"><i class="ti ti-building-hospital"></i> ${ward} <span style="color:var(--tm);font-weight:500;text-transform:none;">(${occCount}/${wardBeds.length} occupied)</span></div>
                            <div class="beds-grid">
                                ${wardBeds.map((b, i) => `
                                    <div class="bed-card ${b.status}" onclick="openBedModal('${ward}', ${i})">
                                        <div class="bed-num">Bed ${b.number}</div>
                                        <div class="bed-status">${b.status}</div>
                                        <div class="bed-patient">${b.patient || (b.status === 'available' ? 'Ready for patient' : b.status === 'cleaning' ? 'Being prepared' : '—')}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }).join('');

                document.getElementById('statTotal').textContent = total;
                document.getElementById('statAvailable').textContent = available;
                document.getElementById('statOccupied').textContent = occupied;
                document.getElementById('statCleaning').textContent = cleaning;
            }

            window.openBedModal = function(ward, index) {
                const bed = beds[ward][index];
                const modal = document.getElementById('bedModal');
                const body = document.getElementById('bedModalBody');
                body.innerHTML = `
                    <h3><i class="ti ti-bed"></i> ${ward} — Bed ${bed.number}</h3>
                    <div class="field">
                        <label>Status</label>
                        <select id="modalStatus">
                            <option value="available" ${bed.status === 'available' ? 'selected' : ''}>Available</option>
                            <option value="occupied" ${bed.status === 'occupied' ? 'selected' : ''}>Occupied</option>
                            <option value="cleaning" ${bed.status === 'cleaning' ? 'selected' : ''}>Cleaning</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Patient Name (if occupied)</label>
                        <input type="text" id="modalPatient" value="${bed.patient || ''}" placeholder="e.g. John Mugisha" />
                    </div>
                    <div class="modal-actions">
                        <button class="btn btn-outline" onclick="closeBedModal()">Cancel</button>
                        <button class="btn btn-green" onclick="saveBed('${ward}', ${index})">Save</button>
                    </div>
                `;
                modal.classList.add('open');
            };
            window.closeBedModal = function() {
                document.getElementById('bedModal').classList.remove('open');
            };
            window.saveBed = function(ward, index) {
                const status = document.getElementById('modalStatus').value;
                const patient = document.getElementById('modalPatient').value.trim();
                beds[ward][index].status = status;
                beds[ward][index].patient = status === 'occupied' ? patient : '';
                saveBeds(beds);
                renderAll();
                closeBedModal();
                showToast('✅ Bed updated', 'success');
            };

            window.showToast = function(msg, type) {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = 'toast' + (type ? ' ' + type : '');
                toast.innerHTML = `<span>${type==='success'?'✅':type==='error'?'❌':'ℹ️'}</span> ${msg}`;
                container.appendChild(toast);
                setTimeout(() => { toast.style.animation = 'toastOut 0.3s ease forwards'; setTimeout(() => toast.remove(), 300); }, 3000);
            };
            window.toggleDarkMode = function() {
                const html = document.documentElement;
                const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                html.setAttribute('data-theme', next);
                localStorage.setItem('pclinic-theme', next);
                document.getElementById('themeIcon').className = next === 'dark' ? 'ti ti-sun' : 'ti ti-moon';
            };
            (function() {
                const saved = (localStorage.getItem('pclinic-theme') || localStorage.getItem('pclinic_theme')) || 'light';
                document.documentElement.setAttribute('data-theme', saved);
                document.getElementById('themeIcon').className = saved === 'dark' ? 'ti ti-sun' : 'ti ti-moon';
            })();
            window.logout = function() { window.pclinicLogout(); };
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeBedModal();
            });

            renderAll();
            console.log('🏥 PClinic Bed Management loaded');
        })();
    </script>

    <script>
        requireAuth([]).then(function(staff) {
            window.currentStaff = staff;
        }).catch(function(err) {
            console.warn('Auth guard redirect:', err && err.message);
        });
    </script>
</body>
</html>
