<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PClinic — Billing</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="pclinic-ui.css">
<link rel="preload" as="style" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css"></noscript>
<script>(function(){try{document.documentElement.setAttribute('data-theme',localStorage.getItem('pclinic-theme')||'light');}catch(e){}})();</script>
<style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--f);background:var(--bg);color:var(--tp);font-size:13px;min-height:100vh;-webkit-font-smoothing:antialiased}
    body::before{content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
        background:radial-gradient(circle at 20% 30%,rgba(0,113,227,.05) 0,transparent 50%),
                   radial-gradient(circle at 80% 70%,rgba(52,199,89,.05) 0,transparent 50%)}
    .wrap{max-width:1300px;margin:0 auto;padding:0 18px 26px}
    .grid{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;align-items:start}
    .panel{background:var(--glass-bg);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
        border:.5px solid var(--glass-brd);border-radius:var(--r2);box-shadow:var(--sh-2),var(--glass-spec);padding:16px}
    .panel h2{font-size:14px;font-weight:700;letter-spacing:-.2px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
    .panel h2 i{color:var(--ac)}
    label{display:block;font-size:11px;font-weight:600;color:var(--tm);margin:10px 0 5px;letter-spacing:.02em;text-transform:uppercase}
    input,select,textarea{width:100%;height:34px;padding:0 11px;border-radius:9px;border:.5px solid var(--bd);
        background:var(--s1);color:var(--tp);font-family:var(--f);font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s}
    textarea{height:auto;padding:9px 11px;resize:vertical;min-height:56px}
    input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 4px var(--acl)}
    .row{display:flex;gap:9px}.row>*{flex:1}
    .cat{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
    .cat button{padding:6px 12px;border-radius:30px;border:.5px solid var(--bd);background:var(--s1);
        font-family:var(--f);font-size:11.5px;font-weight:600;color:var(--ts);cursor:pointer;transition:all .25s var(--spring)}
    .cat button:hover{transform:translateY(-1px)}
    .cat button.on{background:var(--ac);color:#fff;border-color:transparent}
    .svc{max-height:290px;overflow-y:auto;border:.5px solid var(--bd);border-radius:11px;background:var(--s1)}
    .svc-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;
        border-bottom:.5px solid var(--bd);cursor:pointer;transition:background .18s}
    .svc-item:last-child{border-bottom:0}
    .svc-item:hover{background:var(--acb)}
    .svc-item .n{font-size:12.5px;font-weight:500}
    .svc-item .c{font-size:10px;color:var(--tm)}
    .svc-item .p{font-size:12.5px;font-weight:700;color:var(--ac);white-space:nowrap}
    table{width:100%;border-collapse:collapse;font-size:12.5px}
    th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--tm);
       padding:7px 8px;border-bottom:.5px solid var(--bd)}
    td{padding:8px;border-bottom:.5px solid var(--bd)}
    tr:last-child td{border-bottom:0}
    .qty{width:52px;height:27px;text-align:center;padding:0 4px}
    .del{background:none;border:0;color:var(--red);cursor:pointer;font-size:15px;padding:3px;border-radius:6px;transition:all .2s}
    .del:hover{background:var(--redb);transform:scale(1.12)}
    .totals{margin-top:12px;padding-top:11px;border-top:.5px dashed var(--bd)}
    .trow{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
    .trow.grand{font-size:17px;font-weight:800;color:var(--ac);padding-top:8px;margin-top:5px;border-top:.5px solid var(--bd)}
    .empty{text-align:center;color:var(--tm);padding:26px 14px;font-size:12.5px}
    .bill-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;
        border-radius:10px;border:.5px solid var(--bd);background:var(--s1);margin-bottom:7px;transition:all .25s var(--spring)}
    .bill-row:hover{transform:translateX(3px);box-shadow:var(--sh-1)}
    .badge{font-size:9.5px;font-weight:700;padding:3px 9px;border-radius:30px;letter-spacing:.03em}
    .b-pending{background:var(--orangeb);color:var(--oranged)}
    .b-partial{background:var(--acb);color:var(--ac)}
    .b-paid{background:var(--greenb);color:var(--greend)}
    .b-cancelled{background:var(--redb);color:var(--redd)}
    @media(max-width:900px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="pc-topbar">
    <div class="pc-brand">
        <img class="pc-logo" src="logo-wide.png" alt="PClinic" width="118" height="30">
        <span class="pc-appsub">Billing</span>
    </div>
    <div class="pc-tr">
        <button class="pc-iconbtn" onclick="pcToggleTheme()" title="Dark mode"><i class="ti ti-moon" id="themeIcon"></i></button>
        <div class="pc-chip" id="userChip"><span class="pc-avatar" id="userAvatar">··</span><span id="userName">…</span></div>
        <button class="pc-iconbtn" onclick="pclinicLogout()" title="Sign out"><i class="ti ti-logout"></i></button>
    </div>
</div>

<div class="pc-headerbar">
    <nav class="pc-crumb"><a href="hub.html">🏥 Hub</a><span class="sep">›</span>
        <a href="doctor-dashboard.html">Doctor</a><span class="sep">›</span><span>Billing</span></nav>
    <span class="pc-divider"></span>
    <span class="pc-greet">Create a bill</span>
    <span class="pc-spacer"></span>
    <button class="pc-btn" onclick="history.back()"><i class="ti ti-arrow-left"></i> Back</button>
</div>

<div class="wrap">
<div class="grid">

    <!-- LEFT: build the bill -->
    <div class="panel">
        <h2><i class="ti ti-receipt"></i> New Bill</h2>

        <label for="patientSel">Patient</label>
        <select id="patientSel" data-pc-remember="billPatient"><option value="">Select a patient…</option></select>

        <label>Add services</label>
        <div class="cat" id="catBar"></div>
        <div class="svc" id="svcList"></div>

        <div style="margin-top:14px">
            <table>
                <thead><tr><th>Service</th><th style="width:60px">Qty</th><th style="width:100px;text-align:right">Amount</th><th style="width:34px"></th></tr></thead>
                <tbody id="lineItems"><tr><td colspan="4" class="empty">No items yet — pick a service above</td></tr></tbody>
            </table>
        </div>

        <div class="totals">
            <div class="trow"><span>Subtotal</span><span id="subT">RWF 0</span></div>
            <div class="trow"><span>Discount</span>
                <span><input type="number" id="disc" value="0" min="0" style="width:110px;height:27px;text-align:right"></span></div>
            <div class="trow grand"><span>Total</span><span id="grandT">RWF 0</span></div>
        </div>

        <div class="row" style="margin-top:14px">
            <button class="pc-btn pc-btn-primary" onclick="saveBill()" style="flex:2"><i class="ti ti-check"></i> Create Bill &amp; Send to Cashier</button>
            <button class="pc-btn" onclick="clearBill()"><i class="ti ti-x"></i> Clear</button>
        </div>
    </div>

    <!-- RIGHT: recent bills -->
    <div class="panel">
        <h2><i class="ti ti-list"></i> Recent Bills</h2>
        <div class="cat" style="margin-bottom:12px">
            <button class="on" data-f="all" onclick="filterBills('all',this)">All</button>
            <button data-f="pending" onclick="filterBills('pending',this)">Pending</button>
            <button data-f="partial" onclick="filterBills('partial',this)">Partial</button>
            <button data-f="paid" onclick="filterBills('paid',this)">Paid</button>
        </div>
        <div id="billList"></div>
    </div>

</div>
</div>

<div class="pc-toasts"></div>

<script type="module" src="firebase-config.js"></script>
<script src="auth-guard.js"></script>
<script src="pclinic-state.js"></script>
<script src="patient-data.js"></script>
<script src="pclinic-orders.js"></script>

<script>
(function(){
'use strict';
var cart = [], curFilter = 'all';

function money(n){ return 'RWF ' + (Number(n)||0).toLocaleString('en-US'); }

// ── Patients ──
function loadPatients(){
    var sel = document.getElementById('patientSel');
    var list = [];
    try { if (typeof getPatients==='function') list = getPatients()||[]; } catch(e){}
    sel.innerHTML = '<option value="">Select a patient…</option>';
    list.forEach(function(p){
        var o = document.createElement('option');
        o.value = p.id;
        o.textContent = (p.name || (p.firstName+' '+p.lastName)) + '  ·  ' + (p.mrn||'');
        sel.appendChild(o);
    });
    if (!list.length) {
        var o=document.createElement('option'); o.disabled=true;
        o.textContent='No patients registered yet'; sel.appendChild(o);
    }
}

// ── Service catalogue ──
function loadCategories(){
    var depts = {};
    pcTariff.all().forEach(function(t){ depts[t.dept]=1; });
    var bar = document.getElementById('catBar');
    bar.innerHTML='';
    var names = {consultation:'Consultation',procedure:'Procedures',lab:'Laboratory',
                 radiology:'Imaging',admission:'Admission',physio:'Physio',theatre:'Theatre'};
    Object.keys(depts).forEach(function(d,i){
        var b=document.createElement('button');
        b.textContent = names[d]||d;
        if(i===0) b.className='on';
        b.onclick=function(){
            bar.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});
            b.classList.add('on'); renderServices(d);
        };
        bar.appendChild(b);
    });
    renderServices(Object.keys(depts)[0]);
}

function renderServices(dept){
    var box=document.getElementById('svcList');
    box.innerHTML='';
    pcTariff.byDept(dept).forEach(function(t){
        var d=document.createElement('div');
        d.className='svc-item';
        d.innerHTML='<span><span class="n"></span><br><span class="c"></span></span><span class="p"></span>';
        d.querySelector('.n').textContent=t.name;
        d.querySelector('.c').textContent=t.code;
        d.querySelector('.p').textContent=money(t.price);
        d.onclick=function(){ addItem(t); };
        box.appendChild(d);
    });
}

// ── Cart ──
function addItem(t){
    var ex = cart.filter(function(c){return c.code===t.code;})[0];
    if (ex) ex.qty++;
    else cart.push({code:t.code,name:t.name,price:t.price,qty:1});
    renderCart();
    pcToast(t.name + ' added', 'success');
}

function renderCart(){
    var tb=document.getElementById('lineItems');
    if(!cart.length){
        tb.innerHTML='<tr><td colspan="4" class="empty">No items yet — pick a service above</td></tr>';
        recalc(); return;
    }
    tb.innerHTML='';
    cart.forEach(function(c,i){
        var tr=document.createElement('tr');
        var td1=document.createElement('td'); td1.textContent=c.name;
        var td2=document.createElement('td');
        var q=document.createElement('input'); q.type='number'; q.min='1'; q.value=c.qty; q.className='qty';
        q.onchange=function(){ c.qty=Math.max(1,parseInt(q.value)||1); renderCart(); };
        td2.appendChild(q);
        var td3=document.createElement('td'); td3.style.textAlign='right'; td3.style.fontWeight='600';
        td3.textContent=money(c.price*c.qty);
        var td4=document.createElement('td');
        var b=document.createElement('button'); b.className='del'; b.innerHTML='<i class="ti ti-trash"></i>';
        b.onclick=function(){ cart.splice(i,1); renderCart(); };
        td4.appendChild(b);
        tr.append(td1,td2,td3,td4); tb.appendChild(tr);
    });
    recalc();
}

function recalc(){
    var sub=cart.reduce(function(s,c){return s+c.price*c.qty;},0);
    var d=Math.max(0,parseInt(document.getElementById('disc').value)||0);
    document.getElementById('subT').textContent=money(sub);
    document.getElementById('grandT').textContent=money(Math.max(0,sub-d));
}
document.getElementById('disc').addEventListener('input',recalc);

// ── Save ──
window.saveBill=function(){
    var sel=document.getElementById('patientSel');
    if(!sel.value){ pcToast('Choose a patient first','error'); sel.focus(); return; }
    if(!cart.length){ pcToast('Add at least one service','error'); return; }
    var pid=parseInt(sel.value,10);
    var pname=sel.options[sel.selectedIndex].textContent.split('·')[0].trim();
    var bill=pcBilling.create({
        patientId:pid, patientName:pname, items:cart.slice(),
        discount:Math.max(0,parseInt(document.getElementById('disc').value)||0),
        source:'doctor'
    });
    if(!bill){ pcToast('Could not create the bill','error'); return; }
    pcToast('Bill ' + bill.number + ' sent to cashier','success');
    clearBill(); renderBills();
};

window.clearBill=function(){
    cart=[]; document.getElementById('disc').value=0; renderCart();
};

// ── Recent bills ──
window.filterBills=function(f,btn){
    curFilter=f;
    btn.parentElement.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});
    btn.classList.add('on'); renderBills();
};

function renderBills(){
    var box=document.getElementById('billList');
    var list=pcBilling.list().filter(function(b){ return curFilter==='all'||b.status===curFilter; }).slice(0,25);
    if(!list.length){ box.innerHTML='<div class="empty">No bills yet</div>'; return; }
    box.innerHTML='';
    list.forEach(function(b){
        var d=document.createElement('div'); d.className='bill-row';
        var left=document.createElement('div');
        left.innerHTML='<div style="font-weight:600;font-size:12.5px"></div>'+
                       '<div style="font-size:10.5px;color:var(--tm);margin-top:2px"></div>';
        left.children[0].textContent=b.number+' · '+(b.patientName||'—');
        left.children[1].textContent=new Date(b.createdAt).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})
            + ' · ' + b.items.length + ' item' + (b.items.length===1?'':'s');
        var right=document.createElement('div');
        right.style.cssText='text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end';
        var amt=document.createElement('div'); amt.style.cssText='font-weight:700;font-size:13px';
        amt.textContent=money(b.total);
        var bg=document.createElement('span'); bg.className='badge b-'+b.status; bg.textContent=b.status;
        right.append(amt,bg);
        d.append(left,right);
        d.onclick=function(){ location.href='receipt.html?bill='+b.id; };
        d.style.cursor='pointer';
        box.appendChild(d);
    });
}

window.addEventListener('billsUpdated',renderBills);
window.addEventListener('patientsUpdated',loadPatients);

requireAuth([]).then(function(staff){
    window.currentStaff=staff;
    document.getElementById('userName').textContent=staff.name;
    document.getElementById('userAvatar').textContent=(staff.name||'??').substring(0,2).toUpperCase();
    loadPatients(); loadCategories(); renderCart(); renderBills();
    // Pre-select a patient passed in the URL
    var pid=new URLSearchParams(location.search).get('patient');
    if(pid){ var s=document.getElementById('patientSel'); s.value=pid; }
}).catch(function(){});
})();
</script>
<script src="pclinic-handoff.js"></script>
</body>
</html>
