<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <!-- ═══ FIREBASE + AUTH GUARD ═══ -->
    <script type="module" src="firebase-config.js"></script>
    <script src="auth-guard.js"></script>
    <script src="pclinic-state.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClinic GA • Cumulative Laboratory Flow Sheet</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css">
    <link rel="stylesheet" href="pclinic-ui.css">
    <link rel="stylesheet" href="pclinic-file.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #f0f2f5;
            --s1: #ffffff;
            --s2: #ebf3fb; /* OpenClinic alternating light blue */
            --s3: #e2eef9;
            --bd: #d1e2f2;
            --tp: #1a1a2e;
            --ts: #374151;
            --tm: #6b7280;
            --ac: #0071e3;
            --ach: #005bb5;
            --acb: rgba(0, 113, 227, 0.1);
            --green: #059669;
            --orange: #f59e0b;
            --red: #d9534f;
            --redb: #fce8e6;
            --yellowb: #fff3cd;
            --shadow: 0 1px 4px rgba(0,0,0,0.05), 0 4px 16px rgba(0,0,0,0.04);
            --f: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
            --smooth: cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* Apple-Grade Dark Mode (from zero) — 0 invisible text */
        [data-theme="dark"], html[data-theme="dark"], body.dark-mode {
            --bg: #0d0d12 !important;
            --s1: #161620 !important;
            --s2: #1a1e29 !important;
            --s3: #222736 !important;
            --bd: rgba(255, 255, 255, 0.14) !important;
            --tp: #f3f4f6 !important;
            --ts: #d1d5db !important;
            --tm: #9ca3af !important;
            --ac: #60a5fa !important;
            --ach: #93c5fd !important;
            --acb: rgba(96, 165, 250, 0.15) !important;
            --redb: rgba(239, 68, 68, 0.22) !important;
            --yellowb: rgba(245, 158, 11, 0.22) !important;
            color-scheme: dark;
        }

        body {
            font-family: var(--f);
            background: var(--bg);
            color: var(--tp);
            font-size: 13px;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1450px;
            margin: 0 auto;
            animation: fadeIn 0.12s var(--smooth);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ─── OPENCLINIC PATIENT DEMOGRAPHIC BANNER ─── */
        .oc-patient-banner {
            background: var(--s1);
            border: 1px solid var(--bd);
            border-radius: 14px;
            padding: 14px 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px 20px;
            font-size: 12.5px;
        }

        .oc-demo-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .oc-demo-lbl {
            font-size: 11px;
            font-weight: 700;
            color: var(--tm);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .oc-demo-val {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--tp);
        }

        .oc-demo-val.mrn {
            color: var(--ac);
        }

        /* ─── OPENCLINIC GA CUMULATIVE FLOW SHEET MATRIX ─── */
        .oc-matrix-wrapper {
            background: var(--s1);
            border: 1px solid var(--bd);
            border-radius: 14px;
            box-shadow: var(--shadow);
            overflow-x: auto;
            margin-bottom: 24px;
        }

        table.oc-matrix-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12.5px;
            text-align: left;
        }

        table.oc-matrix-table thead th {
            background: var(--s3);
            color: var(--tp);
            font-weight: 700;
            padding: 12px 14px;
            border-bottom: 2px solid var(--bd);
            border-right: 1px solid var(--bd);
            vertical-align: bottom;
            white-space: nowrap;
        }

        table.oc-matrix-table thead th:last-child {
            border-right: none;
        }

        .oc-col-order-hdr {
            text-align: center;
            font-size: 11.5px;
            line-height: 1.4;
        }

        .oc-col-order-date {
            font-weight: 800;
            color: var(--tp);
            font-size: 12.5px;
        }

        .oc-col-order-id {
            color: var(--ac);
            font-weight: 800;
            font-family: monospace;
            font-size: 12.5px;
        }

        .oc-col-links {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            margin-top: 4px;
            font-size: 11px;
        }

        .oc-col-link {
            color: var(--ac);
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .oc-col-link:hover {
            text-decoration: underline;
        }

        /* Matrix Rows */
        table.oc-matrix-table tbody tr {
            border-bottom: 1px solid var(--bd);
            transition: background 0.15s ease;
        }

        table.oc-matrix-table tbody tr.row-even {
            background: var(--s2); /* #ebf3fb */
        }

        table.oc-matrix-table tbody tr.row-odd {
            background: var(--s1); /* #ffffff */
        }

        table.oc-matrix-table tbody tr:hover {
            background: rgba(0, 113, 227, 0.08) !important;
        }

        table.oc-matrix-table td {
            padding: 9px 12px;
            border-right: 1px solid var(--bd);
            vertical-align: middle;
        }

        table.oc-matrix-table td:last-child {
            border-right: none;
        }

        /* Category Left Column */
        .oc-cat-cell {
            font-weight: 800;
            font-size: 12px;
            vertical-align: top !important;
            padding: 14px 12px !important;
            background: var(--s1);
            border-right: 2px solid var(--bd) !important;
            letter-spacing: 0.3px;
        }

        .oc-cat-chem { color: #059669; }
        .oc-cat-fbc  { color: #800040; }
        .oc-cat-sero { color: #c81e51; }
        .oc-cat-mic  { color: #005bb5; }
        .oc-cat-uri  { color: #006666; }

        [data-theme="dark"] .oc-cat-chem { color: #34d399; }
        [data-theme="dark"] .oc-cat-fbc  { color: #c084fc; }
        [data-theme="dark"] .oc-cat-sero { color: #f472b6; }
        [data-theme="dark"] .oc-cat-mic  { color: #60a5fa; }
        [data-theme="dark"] .oc-cat-uri  { color: #2dd4bf; }

        /* Test Name Cell */
        .oc-test-cell {
            font-family: var(--f);
            font-size: 12.5px;
            font-weight: 500;
            color: var(--tp);
            white-space: nowrap;
        }

        .oc-test-code {
            font-weight: 700;
            color: var(--tp);
            margin-right: 6px;
        }

        .oc-test-range {
            color: var(--tm);
            font-size: 11.5px;
            margin-left: 6px;
        }

        /* Result Cell */
        .oc-res-cell {
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--tp);
            white-space: nowrap;
        }

        .oc-res-abnormal {
            background: var(--redb) !important;
            color: #c92a2a !important;
            font-weight: 800 !important;
        }

        [data-theme="dark"] .oc-res-abnormal {
            color: #ff8787 !important;
        }

        .oc-flag {
            display: inline-block;
            background: #d9534f;
            color: #ffffff;
            font-weight: 800;
            font-size: 10px;
            padding: 1px 5px;
            border-radius: 4px;
            margin-left: 5px;
            vertical-align: middle;
        }

        .oc-pending-badge {
            color: #f59e0b;
            font-weight: 700;
            font-style: italic;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* Header action buttons */
        .pc-topbar {
            background: var(--s1);
            border: 1px solid var(--bd);
            border-radius: 14px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }

        .btn-apple {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            background: var(--s2);
            color: var(--tp);
            border: 1px solid var(--bd);
            text-decoration: none;
            font-family: inherit;
        }

        .btn-apple:hover {
            background: var(--s3);
            transform: scale(1.02);
        }

        .btn-apple.primary {
            background: var(--ac);
            color: #ffffff;
            border-color: var(--ac);
        }

        .btn-apple.primary:hover {
            background: var(--ach);
        }

        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            padding: 12px 18px;
            border-radius: 12px;
            background: var(--tp);
            color: var(--s1);
            font-size: 13px;
            font-weight: 600;
            box-shadow: var(--shadow2);
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Compact Toolbar (No Top Navigation Bar / Logo, No Demographic Banner) -->
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 14px;">
            <div style="font-size: 14.5px; font-weight: 700; color: var(--tp); display: flex; align-items: center; gap: 8px;">
                <i class="ti ti-test-pipe" style="color: var(--ac); font-size: 18px;"></i>
                <span>Cumulative Laboratory Results Flow Sheet</span>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
                <a href="lab-request.html" class="btn-apple" style="text-decoration:none;" title="New Lab Request"><i class="ti ti-test-pipe"></i> New Request</a>
                <a href="lab-dashboard.html" class="btn-apple" style="text-decoration:none;" title="Laboratory Portal"><i class="ti ti-layout-dashboard"></i> Laboratory</a>
                <a href="doctor-dashboard.html" class="btn-apple" style="text-decoration:none;" title="Doctor Console"><i class="ti ti-user-check"></i> Doctor</a>
                <button class="btn-apple" onclick="window.print()" title="Print report">
                    <i class="ti ti-printer"></i> Print
                </button>
                <button class="btn-apple" onclick="closeLabResultsPage()" title="Close and return">
                    <i class="ti ti-arrow-left"></i> Close
                </button>
            </div>
        </div>

        <!-- OpenClinic GA Cumulative Flow Sheet Table -->
        <div class="oc-matrix-wrapper">
            <table class="oc-matrix-table" id="ocMatrixTable">
                <thead id="matrixHead"></thead>
                <tbody id="matrixBody"></tbody>
            </table>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="pclinic-catalog.js"></script>
    <script src="pclinic-orders.js"></script>
    <script src="pclinic-file.js"></script>
    <script src="pclinic-handoff.js"></script>

    <script>
    (function() {
        'use strict';

        let currentPatient = null;

        // ─── STANDARD OPENCLINIC GA LABORATORY PARAMETER REGISTER ───
        const OC_CATEGORIES = [
            {
                id: 'chem',
                title: '20000 USUAL CHEMISTRY',
                className: 'oc-cat-chem',
                tests: [
                    { code: '20001', name: 'UREA/BLOOD', unit: 'mmol/l', range: '3-9.2', defaultVal: '4.900' },
                    { code: '20002', name: 'CREATININE/BLOOD', unit: 'µmol/l', range: '63.6-110.5', defaultVal: '71.200' },
                    { code: '20003', name: 'NA + (SODIUM)/BLOOD', unit: 'mmol/l', range: '135-145', defaultVal: '140.000' },
                    { code: '20004', name: 'K + (POTASSIUM)/BLOOD', unit: 'mmol/l', range: '3.5-5.0', defaultVal: '4.400' },
                    { code: '20005', name: 'MAGNESIUM/BLOOD', unit: 'mmol/l', range: '0.66-1.07', defaultVal: '0.860' },
                    { code: '20006', name: 'CL -(CHLORURE)/BLOOD', unit: 'mmol/l', range: '98-107', defaultVal: '102.000', abnormalVal: '116.000' },
                    { code: '20007', name: 'FASTING GLUCOSE/BLOOD', unit: 'mmol/l', range: '3.9-5.6', defaultVal: '4.800' },
                    { code: '20008', name: 'LIVER FUNCTION (SGPT/ALT)', unit: 'U/l', range: '7-56', defaultVal: '24.000' },
                    { code: '20009', name: 'LIVER FUNCTION (SGOT/AST)', unit: 'U/l', range: '10-40', defaultVal: '22.000' }
                ]
            },
            {
                id: 'fbc',
                title: '31000 FULL BLOOD COUNT',
                className: 'oc-cat-fbc',
                tests: [
                    { code: '31001', name: 'WBC', unit: '10^3/µl', range: '4-10', defaultVal: '7.34', abnormalVal: '23.18' },
                    { code: '31002', name: 'RBC', unit: '10^6/µl', range: '4.5-6.2', defaultVal: '4.82', abnormalVal: '3.86' },
                    { code: '31003', name: 'hemoglobin', unit: 'g/dl', range: '13-17', defaultVal: '14.9', abnormalVal: '12.4' },
                    { code: '31004', name: 'Hct', unit: '%', range: '40-54', defaultVal: '45.0', abnormalVal: '34.3' },
                    { code: '31005', name: 'MCV', unit: 'fL', range: '82-98', defaultVal: '89.2', abnormalVal: '88.9' },
                    { code: '31006', name: 'MCH', unit: 'pg', range: '27-31', defaultVal: '30.9', abnormalVal: '32.1' },
                    { code: '31007', name: 'MCHC', unit: 'g/dl', range: '32-36', defaultVal: '34.7', abnormalVal: '36.2' },
                    { code: '31008', name: 'platelets', unit: '10^3/µl', range: '150-450', defaultVal: '220', abnormalVal: '174' },
                    { code: '31009', name: 'RDW', unit: '%', range: '11.5-14.5', defaultVal: '13.1', abnormalVal: '16.8' },
                    { code: '31010', name: 'MPV', unit: 'fL', range: '6.9-10.6', defaultVal: '9.4', abnormalVal: '10.2' },
                    { code: '32001', name: 'neutrophiles', unit: '%', range: '40-75', defaultVal: '62.0', abnormalVal: '83.4' },
                    { code: '32002', name: 'lymphocytes', unit: '%', range: '20-40', defaultVal: '28.5', defaultValOld: '12.1' },
                    { code: '32003', name: 'monocytes', unit: '%', range: '2-8', defaultVal: '6.2' },
                    { code: '32004', name: 'eosinophiles', unit: '%', range: '1-4', defaultVal: '2.1' }
                ]
            },
            {
                id: 'sero',
                title: '40000 SEROLOGY & IMMUNOLOGY',
                className: 'oc-cat-sero',
                tests: [
                    { code: '40001', name: 'HIV 1/2 ANTIBODY/AG', unit: '', range: 'Negative', defaultVal: 'Negative' },
                    { code: '40002', name: 'HBsAg (HEPATITIS B)', unit: '', range: 'Negative', defaultVal: 'Negative' },
                    { code: '40003', name: 'HCV ANTIBODY', unit: '', range: 'Negative', defaultVal: 'Negative' },
                    { code: '40004', name: 'SYPHILIS RPR/VDRL', unit: '', range: 'Negative', defaultVal: 'Negative' },
                    { code: '40005', name: 'CRP (C-REACTIVE PROTEIN)', unit: 'mg/l', range: '0-5', defaultVal: '2.400' },
                    { code: '40006', name: 'WIDAL TEST (SALMONELLA)', unit: '', range: 'Negative', defaultVal: 'Negative' },
                    { code: '40007', name: 'H. PYLORI AG/AB', unit: '', range: 'Negative', defaultVal: 'Negative' }
                ]
            },
            {
                id: 'micro',
                title: '50000 MICROBIOLOGY & CULTURES',
                className: 'oc-cat-mic',
                tests: [
                    { code: '50001', name: 'MALARIA PARASITE (MP)', unit: '', range: 'Negative', defaultVal: 'Negative' },
                    { code: '50002', name: 'BLOOD CULTURE & SENSITIVITY', unit: '', range: 'No growth', defaultVal: 'No growth' },
                    { code: '50003', name: 'URINE CULTURE & SENSITIVITY', unit: '', range: 'No growth', defaultVal: 'No growth' },
                    { code: '50004', name: 'STOOL OVA & CYSTS', unit: '', range: 'Negative', defaultVal: 'Negative' }
                ]
            },
            {
                id: 'uri',
                title: '60000 URINALYSIS',
                className: 'oc-cat-uri',
                tests: [
                    { code: '60001', name: 'URINE PROTEIN/ALBUMIN', unit: '', range: 'Negative', defaultVal: 'Negative' },
                    { code: '60002', name: 'URINE GLUCOSE', unit: '', range: 'Negative', defaultVal: 'Negative' },
                    { code: '60003', name: 'URINE KETONES', unit: '', range: 'Negative', defaultVal: 'Negative' },
                    { code: '60004', name: 'URINE WBC / LEUKOCYTES', unit: '/HPF', range: '0-5', defaultVal: '2' }
                ]
            }
        ];

        // ─── INITIALIZE ───
        function init() {
            loadDarkMode();
            loadPatientData();
            buildOpenClinicMatrix();
        }

        function loadDarkMode() {
            const isDark = localStorage.getItem('pclinic-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            document.body.classList.toggle('dark-mode', isDark);
            const ic = document.getElementById('themeIcon');
            if (ic) ic.className = isDark ? 'ti ti-sun' : 'ti ti-moon';
        }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function showToast(msg, type = 'info') {
            const c = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = 'toast';
            t.style.background = type === 'success' ? '#059669' : type === 'error' ? '#ef4444' : '#1a1a2e';
            t.textContent = msg;
            c.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        // ─── LOAD PATIENT ───
        function loadPatientData() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const pid = urlParams.get('patient') || localStorage.getItem('pclinic_active_patient');
                if (pid) {
                    const pts = JSON.parse(localStorage.getItem('pclinic_patients') || '[]');
                    const found = pts.find(p => String(p.id) === String(pid));
                    if (found) {
                        currentPatient = found;
                        updatePatientBanner(found);
                        return;
                    }
                }
            } catch (e) {}

            try {
                if (window.parent && window.parent.currentPatient) {
                    currentPatient = window.parent.currentPatient;
                    updatePatientBanner(currentPatient);
                    return;
                }
            } catch (e) {}

            // Default fallback if no patient selected
            currentPatient = {
                id: '655055',
                firstName: 'GASPARD',
                lastName: 'TEKEREZA',
                mrn: '655055',
                dob: '1986-01-07',
                gender: 'Male',
                department: 'SURGERY WARD 7',
                district: 'KAMONYI'
            };
            updatePatientBanner(currentPatient);
        }

        function updatePatientBanner(p) {
            // Patient banner deleted per user request
        }

        // ─── BUILD OPENCLINIC GA CUMULATIVE FLOW SHEET MATRIX ───
        function buildOpenClinicMatrix() {
            // 1. Generate Order Columns (Standard OpenClinic historical progression + any new pending orders for patient)
            const orderCols = [
                {
                    dateStr: '29/07/2026',
                    timeStr: '00:00',
                    orderId: '5709945',
                    isHistorical: true,
                    abnormalCodes: ['31001', '31003', '31004', '32001'] // WBC 23.18 (!), Hb 12.4 (!), etc.
                },
                {
                    dateStr: '29/07/2026',
                    timeStr: '16:07',
                    orderId: '5712693',
                    isHistorical: true,
                    abnormalCodes: []
                },
                {
                    dateStr: '30/07/2026',
                    timeStr: '13:22',
                    orderId: '5716274',
                    isHistorical: true,
                    abnormalCodes: ['31002', '31007', '31008', '31009', '31010'] // RBC 3.86 (!), PLT 174 (!), etc.
                },
                {
                    dateStr: '01/08/2026',
                    timeStr: '00:00',
                    orderId: '5723334',
                    isHistorical: true,
                    abnormalCodes: ['20006', '31008', '31009', '31010', '32001'] // CL 116.000 (!), etc.
                }
            ];

            // 2. Check if currentPatient has any real orders in pclinic_orders or labRequests
            if (currentPatient) {
                try {
                    const orders = JSON.parse(localStorage.getItem('pclinic_orders') || '[]');
                    orders.forEach(o => {
                        if (String(o.patientId) === String(currentPatient.id) && o.type === 'lab') {
                            const dObj = new Date(o.orderedAt || Date.now());
                            orderCols.push({
                                dateStr: dObj.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' }),
                                timeStr: dObj.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }),
                                orderId: String(o.id).replace(/[^0-9]/g, '').slice(0, 7) || '5801245',
                                isPending: o.status !== 'completed' && o.status !== 'Completed',
                                testsOrdered: (o.items || []).map(i => i.name)
                            });
                        }
                    });
                } catch(e) {}
            }

            // 3. Render Table Header (thead)
            const head = document.getElementById('matrixHead');
            let headHtml = `
                <tr>
                    <th style="width: 220px; text-align: left;">Analysis</th>
                    <th style="width: 380px; text-align: left;">Test Parameter &amp; Reference Range</th>
            `;
            orderCols.forEach(col => {
                headHtml += `
                    <th class="oc-col-order-hdr">
                        <div class="oc-col-order-date">${col.dateStr} ${col.timeStr}</div>
                        <div class="oc-col-order-id">${col.orderId}</div>
                        <div class="oc-col-links">
                            <span class="oc-col-link" onclick="showToast('📄 Displaying Lab results report #${col.orderId}', 'info')">
                                <i class="ti ti-file-text"></i> Lab.results
                            </span>
                            <span class="oc-col-link" onclick="showToast('📋 Opening order #${col.orderId}', 'info')">
                                <i class="ti ti-clipboard-list"></i> Order
                            </span>
                        </div>
                    </th>
                `;
            });
            headHtml += '</tr>';
            head.innerHTML = headHtml;

            // 4. Render Table Body (tbody)
            const body = document.getElementById('matrixBody');
            let bodyHtml = '';

            let rowCount = 0;

            OC_CATEGORIES.forEach(cat => {
                const totalTests = cat.tests.length;

                cat.tests.forEach((t, idx) => {
                    const rowClass = (rowCount % 2 === 0) ? 'row-even' : 'row-odd';
                    rowCount++;

                    bodyHtml += `<tr class="${rowClass}">`;

                    // Category Left Cell (Spans all tests in category)
                    if (idx === 0) {
                        bodyHtml += `
                            <td class="oc-cat-cell ${cat.className}" rowspan="${totalTests}">
                                ${cat.title}
                            </td>
                        `;
                    }

                    // Test Parameter Cell: "CODE TEST NAME (unit) [range]"
                    const unitStr = t.unit ? ` (${t.unit})` : '';
                    const rangeStr = t.range ? ` [${t.range}]` : '';
                    bodyHtml += `
                        <td class="oc-test-cell">
                            <span class="oc-test-code">${t.code}</span>
                            <span>${t.name}${unitStr}</span>
                            <span class="oc-test-range">${rangeStr}</span>
                        </td>
                    `;

                    // Generate Cells for Each Order Column
                    orderCols.forEach((col, cIdx) => {
                        if (col.isPending) {
                            // Check if this test was part of the pending order
                            const isOrdered = col.testsOrdered && col.testsOrdered.some(nm => 
                                nm.toLowerCase().includes(t.name.toLowerCase()) || 
                                t.name.toLowerCase().includes(nm.toLowerCase())
                            );
                            if (isOrdered) {
                                bodyHtml += `
                                    <td class="oc-res-cell">
                                        <span class="oc-pending-badge">⏳ Pending</span>
                                    </td>
                                `;
                            } else {
                                bodyHtml += '<td class="oc-res-cell" style="color:var(--tm);opacity:0.3;">--</td>';
                            }
                        } else {
                            // Historical order column
                            const isAbnormal = col.abnormalCodes && col.abnormalCodes.includes(t.code);
                            const resValue = isAbnormal ? (t.abnormalVal || t.defaultVal) : t.defaultVal;
                            const cellClass = isAbnormal ? 'oc-res-cell oc-res-abnormal' : 'oc-res-cell';
                            const flagBadge = isAbnormal ? '<span class="oc-flag">!</span>' : '';

                            bodyHtml += `
                                <td class="${cellClass}">
                                    <span>${resValue}</span>${flagBadge}
                                </td>
                            `;
                        }
                    });

                    bodyHtml += '</tr>';
                });
            });

            body.innerHTML = bodyHtml;
        }

        // ─── CLOSE AND NAVIGATE ───
        function closeLabResultsPage() {
            try {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'CLOSE_LAB_RESULTS' }, '*');
                    return;
                }
            } catch (e) {}
            window.location.href = 'doctor-dashboard.html';
        }

        window.pcToggleTheme = function() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const next = isDark ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            document.body.classList.toggle('dark-mode', next === 'dark');
            localStorage.setItem('pclinic-theme', next);
            const ic = document.getElementById('themeIcon');
            if (ic) ic.className = next === 'dark' ? 'ti ti-sun' : 'ti ti-moon';
        };

        window.addEventListener('DOMContentLoaded', init);
        window.closeLabResultsPage = closeLabResultsPage;
        window.buildOpenClinicMatrix = buildOpenClinicMatrix;
    })();
    </script>
</body>
</html>
