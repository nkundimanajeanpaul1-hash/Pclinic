<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PClinic — Imaging Results</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="pclinic-ui.css">
<link rel="stylesheet" href="pclinic-file.css">
<link rel="preload" as="style" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css"></noscript>
<script>(function(){try{document.documentElement.setAttribute('data-theme',localStorage.getItem('pclinic-theme')||'light');}catch(e){}})();</script>
<style>
.flt { display:grid; grid-template-columns:1.3fr 1fr 1fr 1fr; gap:8px; }
@media(max-width:760px){ .flt{ grid-template-columns:1fr 1fr; } }
.stat-pill { font-size:9.5px; font-weight:700; padding:3px 9px; border-radius:30px; white-space:nowrap; }
.st-pending  { background:var(--orangeb); color:var(--oranged); }
.st-progress { background:var(--acb);     color:var(--ac); }
.st-done     { background:var(--greenb);  color:var(--greend); }
.res-body { font-size:12.5px; line-height:1.75; white-space:pre-wrap; }
.chipbar { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.chip { height:27px; padding:0 11px; border-radius:8px; cursor:pointer; font-size:11px; font-weight:700;
    border:.5px solid rgba(0,0,0,.08); background:var(--s1); color:var(--tp); }
.chip.on { background:var(--ac); color:#fff; border-color:transparent; }
</style>
</head>
<body class="pcf">

<div class="pc-topbar noprint">
    <div class="pc-brand">
        <img class="pc-logo" src="logo-wide.png" alt="PClinic" width="118" height="30">
        <span class="pc-appsub">Imaging Results</span>
    </div>
    <div class="pc-tr">
        <button class="pc-iconbtn" onclick="pcToggleTheme()" title="Dark mode"><i class="ti ti-moon" id="themeIcon"></i></button>
        <div class="pc-chip"><span class="pc-avatar" id="userAvatar">··</span><span id="userName">…</span></div>
        <button class="pc-iconbtn" onclick="pclinicLogout()" title="Sign out"><i class="ti ti-logout"></i></button>
    </div>
</div>

<div class="pcf-wrap">
  <div id="pcfRoot" style="flex:1;min-height:0;display:flex;flex-direction:column">

    <!-- LIST + SEARCH -->
    <div id="viewHistory" style="flex:1;min-height:0;display:flex;flex-direction:column;gap:9px">
        <div class="pcf-panel" style="flex-shrink:0">
            <h2><i class="ti ti-search"></i> Find an imaging result
                <span class="count" id="histCount">0</span></h2>
            <div class="flt">
                <div><label class="pcf-lbl" for="fQ">Search</label>
                    <input class="pcf-in" id="fQ" placeholder="Exam, finding, doctor…" autocomplete="off"></div>
                <div><label class="pcf-lbl" for="fType">Type of image</label>
                    <select class="pcf-in" id="fType"><option value="">All types</option></select></div>
                <div><label class="pcf-lbl" for="fDoc">Requested by</label>
                    <select class="pcf-in" id="fDoc"><option value="">All doctors</option></select></div>
                <div><label class="pcf-lbl" for="fFrom">Date from</label>
                    <input class="pcf-in" type="date" id="fFrom"></div>
            </div>
            <div class="chipbar" id="quickChips"></div>
        </div>
        <div class="pcf-panel pcf-pane" style="flex:1;min-height:0">
            <div class="pcf-hist" id="histList"></div>
        </div>
    </div>

    <!-- ONE RESULT -->
    <div id="viewFile" style="display:none;flex:1;min-height:0;flex-direction:column;gap:9px">
        <div class="pcf-cmd noprint">
            <button class="pcf-btn sm" id="btnBack"><i class="ti ti-arrow-left"></i> All results</button>
            <b class="mode" id="fileMode"></b>
            <span class="spacer"></span>
            <button class="pcf-btn sm" id="btnPrint"><i class="ti ti-printer"></i> Print</button>
            <button class="pcf-btn sm primary" id="btnReport" style="display:none">
                <i class="ti ti-writing"></i> Enter report</button>
        </div>
        <div class="pcf-grid single" id="fileGrid">
            <div class="pcf-pane"><div class="pcf-doc" id="doc"></div></div>
        </div>
    </div>

  </div>
</div>

<div class="pc-toasts noprint"></div>

<script type="module" src="firebase-config.js"></script>
<script src="auth-guard.js"></script>
<script src="pclinic-state.js"></script>
<script src="patient-data.js"></script>
<script src="pclinic-orders.js"></script>
<script src="pclinic-catalog.js"></script>
<script src="pclinic-file.js"></script>
<script src="pclinic-vitals.js"></script>

<script>
(function () {
'use strict';
var P=null, rows=[], viewing=null, myRole='';
function esc(v){var d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML;}
function $(s){return document.querySelector(s);}
function money(n){return 'RWF ' + (Number(n)||0).toLocaleString('en-US');}
function val(id){var e=document.getElementById(id);return e?e.value.trim():'';}
function longDate(d){return new Date(d).toLocaleDateString('en-GB',
    {weekday:'long',day:'numeric',month:'long',year:'numeric'});}

/* Build the unified list: every imaging ORDER for this patient, with
   its result if radiology has reported it. Requests and results are
   two halves of the same thing, so they live in one timeline. */
function collect(){
    var out=[];
    var orders = (window.pcOrders ? pcOrders.list({patientId:P.id, type:'imaging'}) : []) || [];
    orders.forEach(function(o){
        out.push({
            id:o.id, at:o.orderedAt, by:o.orderedBy||'',
            modality: modOf(o), exams:(o.items||[]).map(function(i){return i.name;}),
            status:o.status, total:o.total||0,
            result:o.result||null, reportedBy:o.completedBy||'', reportedAt:o.completedAt||'',
            notes:o.notes||'', priority:o.priority||'routine', order:o
        });
    });
    // Files saved by the request page that never became orders (offline)
    (pcFile.list(P.id,'imaging')||[]).forEach(function(f){
        if(f.orderId && out.some(function(x){return x.id===f.orderId;})) return;
        out.push({ id:f.id, at:f.at, by:f.by||'', modality:f.modalityLabel||'',
            exams:(f.exams||[]).map(function(e){return e.name;}),
            status:'pending', total:f.total||0, result:null,
            notes:f.reason||'', priority:f.priority||'routine' });
    });
    out.sort(function(a,b){return new Date(b.at)-new Date(a.at);});
    return out;
}
function modOf(o){
    var c=(o.items&&o.items[0]&&o.items[0].code)||'';
    var m=c.match(/^IMG-([A-Z]+)-/);
    if(m){ var f=pcCatalog.modality(m[1].toLowerCase()); if(f) return f.label; }
    return 'Imaging';
}

function fillFilters(){
    var types={}, docs={};
    rows.forEach(function(r){ if(r.modality)types[r.modality]=1; if(r.by)docs[r.by]=1; });
    var t=$('#fType'), d=$('#fDoc');
    t.innerHTML='<option value="">All types</option>' +
        Object.keys(types).sort().map(function(x){return '<option>'+esc(x)+'</option>';}).join('');
    d.innerHTML='<option value="">All doctors</option>' +
        Object.keys(docs).sort().map(function(x){return '<option>'+esc(x)+'</option>';}).join('');
    $('#quickChips').innerHTML =
        '<button class="chip on" data-f="all">All</button>' +
        '<button class="chip" data-f="done">Reported</button>' +
        '<button class="chip" data-f="pending">Awaiting result</button>' +
        '<button class="chip" data-f="30">Last 30 days</button>';
    $('#quickChips').querySelectorAll('.chip').forEach(function(c){
        c.onclick=function(){
            $('#quickChips').querySelectorAll('.chip').forEach(function(x){x.classList.remove('on');});
            c.classList.add('on'); paint();
        };
    });
}

function activeChip(){
    var c=$('#quickChips .chip.on'); return c?c.dataset.f:'all';
}

function filtered(){
    var q=val('fQ').toLowerCase(), ty=val('fType'), dc=val('fDoc'), fr=val('fFrom'), ch=activeChip();
    return rows.filter(function(r){
        if(ty && r.modality!==ty) return false;
        if(dc && r.by!==dc) return false;
        if(fr && new Date(r.at) < new Date(fr+'T00:00:00')) return false;
        if(ch==='done'    && r.status!=='completed') return false;
        if(ch==='pending' && r.status==='completed') return false;
        if(ch==='30' && (Date.now()-new Date(r.at)) > 30*864e5) return false;
        if(q){
            var hay=(r.modality+' '+r.exams.join(' ')+' '+r.by+' '+(r.result&&r.result.report||'')+
                     ' '+r.notes).toLowerCase();
            if(hay.indexOf(q)===-1) return false;
        }
        return true;
    });
}

function pill(s){
    if(s==='completed') return '<span class="stat-pill st-done">Reported</span>';
    if(s==='in-progress'||s==='started') return '<span class="stat-pill st-progress">In progress</span>';
    return '<span class="stat-pill st-pending">Awaiting</span>';
}

function paint(){
    var list=filtered();
    $('#histCount').textContent = list.length + ' of ' + rows.length;
    var box=$('#histList');
    if(!list.length){
        box.innerHTML='<div class="pcf-empty"><i class="ti ti-photo-scan"></i>' +
            (rows.length?'Nothing matches those filters.':'No imaging requested for this patient yet.') +
            '</div>';
        return;
    }
    box.innerHTML=list.map(function(r,i){
        var d=new Date(r.at);
        return '<div class="pcf-hrow" data-i="'+i+'">' +
            '<div class="date"><div class="d">'+d.getDate()+'</div>' +
            '<div class="m">'+d.toLocaleDateString('en-GB',{month:'short'})+'</div></div>' +
            '<div class="meat"><b>'+esc(r.modality)+' · '+esc(r.exams.join(', ')||'—')+'</b>' +
            '<span>'+esc(r.by?('Requested by '+r.by):'')+
              (r.reportedBy?' · reported by '+esc(r.reportedBy):'')+'</span></div>' +
            '<div class="by">'+pill(r.status)+'<br>'+money(r.total)+'</div>' +
            '<i class="ti ti-chevron-right" style="color:#c7c7cc"></i></div>';
    }).join('');
    box.querySelectorAll('.pcf-hrow').forEach(function(el){
        el.onclick=function(){ open(list[+el.dataset.i]); };
    });
}

function open(r){
    viewing=r;
    $('#viewHistory').style.display='none';
    $('#viewFile').style.display='flex';
    $('#fileMode').textContent=r.modality+' — '+longDate(r.at);
    var canReport = /radio|admin/i.test(myRole);
    $('#btnReport').style.display = (canReport && r.order) ? '' : 'none';
    paintDoc(r);
}

function paintDoc(r){
    var d=new Date(r.at);
    var res = r.result||{};
    $('#doc').innerHTML =
    '<div class="dh"><div><div class="org">PClinic</div>' +
      '<div class="sub">Hospital Management System<br>Kigali, Rwanda<br>+250 784 446 481</div></div>' +
      '<div class="meta"><div><b>IMR-'+esc(P.id)+'-'+d.getFullYear()+'</b></div>' +
      '<div>'+d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})+'</div>' +
      '<div>'+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+'</div></div></div>' +
    '<div class="dtitle">Imaging Report</div>' +
    '<div class="pinfo">' +
      '<div><span>Patient</span><b>'+esc(pcFile.nameOf(P))+'</b></div>' +
      '<div><span>File no.</span>'+esc(P.mrn||('ID '+P.id))+'</div>' +
      '<div><span>Age / Sex</span>'+esc(pcFile.age(P.dob))+(P.gender?' · '+esc(P.gender):'')+'</div>' +
      '<div><span>Modality</span>'+esc(r.modality)+'</div>' +
      '<div><span>Requested by</span>'+esc(r.by||'—')+'</div>' +
      '<div><span>Status</span>'+esc(r.status==='completed'?'Reported':'Awaiting result')+'</div>' +
    '</div>' +
    '<div class="sec"><h4>Examination</h4><p>'+esc(r.exams.join('\n'))+'</p></div>' +
    (r.notes?'<div class="sec"><h4>Clinical indication</h4><p>'+esc(r.notes)+'</p></div>':'') +
    (res.report
      ? '<div class="sec"><h4>Findings</h4><p class="res-body">'+esc(res.report)+'</p></div>' +
        (res.impression?'<div class="sec"><h4>Impression</h4><p>'+esc(res.impression)+'</p></div>':'') +
        '<div class="sec"><h4>Reported by</h4><p>'+esc(r.reportedBy||'—') +
        (r.reportedAt?' · '+esc(new Date(r.reportedAt).toLocaleString('en-GB')):'')+'</p></div>'
      : '<div class="sec"><h4>Findings</h4><p class="none">' +
        'Radiology has not reported this yet.</p></div>') +
    '<div class="sec"><h4>Charge</h4><p>'+money(r.total)+'</p></div>' +
    '<div class="sig"><div>Radiologist</div><div>'+esc(r.by||'')+'<br>Requesting Physician</div></div>' +
    '<div class="stamp">PClinic · generated '+new Date().toLocaleString('en-GB')+'</div>';
}

/* Radiology enters the report from here */
$('#btnReport').onclick=function(){
    if(!viewing||!viewing.order) return;
    pcFile.sheet({
        title:'Enter imaging report', icon:'ti-writing', done:'Save report',
        build:function(body){
            body.innerHTML =
                '<label class="pcf-lbl" for="rpt">Findings</label>' +
                '<textarea id="rpt" style="min-height:150px" placeholder="Describe what is seen…"></textarea>' +
                '<label class="pcf-lbl" for="imp">Impression</label>' +
                '<textarea id="imp" style="min-height:70px" placeholder="Conclusion / diagnosis…"></textarea>';
        },
        onClose:function(){
            var rpt=val('rpt'), imp=val('imp');
            if(!rpt) return;
            pcOrders.complete(viewing.order.id, {report:rpt, impression:imp});
            pcToast('Report saved · the requesting doctor has been notified','success');
            rows=collect(); fillFilters();
            var again=rows.filter(function(x){return x.id===viewing.id;})[0];
            if(again) open(again); else back();
        }
    });
};

function back(){
    viewing=null;
    $('#viewFile').style.display='none';
    $('#viewHistory').style.display='flex';
    rows=collect(); paint();
}
$('#btnBack').onclick=back;
$('#btnPrint').onclick=function(){pcFile.print('#doc','Imaging Report — '+pcFile.nameOf(P));};
['fQ','fType','fDoc','fFrom'].forEach(function(id){
    document.addEventListener('input',function(e){ if(e.target.id===id) paint(); });
    document.addEventListener('change',function(e){ if(e.target.id===id) paint(); });
});

requireAuth([]).then(function(s){
    window.currentStaff=s; myRole=s.role||'';
    $('#userName').textContent=s.name;
    $('#userAvatar').textContent=(s.name||'??').substring(0,2).toUpperCase();
    var tries=0;
    (function wait(){
        P=pcFile.patient();
        if(P){ rows=collect(); fillFilters(); paint(); return; }
        if(++tries<20)return setTimeout(wait,200);
        $('#pcfRoot').innerHTML='<div class="pcf-panel"><div class="pcf-empty">' +
            '<i class="ti ti-user-off"></i>No patient selected.<br>' +
            '<a href="doctor-dashboard.html" class="pcf-btn" style="margin-top:14px;text-decoration:none">' +
            '<i class="ti ti-layout-dashboard"></i> Go to the dashboard</a></div></div>';
    })();
}).catch(function(){});
window.addEventListener('ordersUpdated',function(){ if(P){rows=collect();if(!viewing)paint();} });
})();
</script>
<script src="pclinic-handoff.js"></script>
</body>
</html>
