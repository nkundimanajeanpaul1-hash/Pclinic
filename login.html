<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PClinic — Login</title>
<meta name="description" content="Sign in to your PClinic dashboard." />
<link rel="icon" type="image/png" href="logo.png" />
<!-- Start the TLS handshake to Firebase immediately, in parallel with
     parsing, so the auth SDK isn't waiting on DNS+TLS when it's requested. -->
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://www.gstatic.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="login-bg.jpg">
<!-- Fonts load non-blocking: the page renders in a system font first,
     then upgrades to Inter when it arrives. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"></noscript>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* Inline SVG icons — replaces a 713 KB webfont that was loaded for 5 glyphs */
    .ic { width: 1em; height: 1em; display: block; }
    .icon-left .ic, .pw-toggle .ic { width: 18px; height: 18px; }
    .fallback-icon .ic { width: 32px; height: 32px; }

    :root {
        --ac: #34d399;
        --ac2: #60a5fa;
        --gradient: linear-gradient(135deg, #34d399, #22c55e);
        --f: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    html, body {
        height: 100%;
        width: 100%;
    }

    body {
        font-family: var(--f);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        width: 100%;
        position: relative;
        overflow-x: hidden;
    }

    /* ── BACKGROUND ── */
    .bg-wrapper {
        position: fixed;
        inset: 0;
        z-index: -2;
        background-image: url('login-bg.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }
    .bg-overlay {
        position: fixed;
        inset: 0;
        z-index: -1;
        background: linear-gradient(160deg, rgba(5,10,20,0.75), rgba(5,10,20,0.88));
    }

    /* ── PAGE-LEVEL LOADING (checking existing session) ── */
    /* Small, non-blocking status chip. The login form is usable the whole
       time this is on screen — it only reports that we're double-checking
       for an existing session in the background. */
    #sessionCheck {
        position: fixed;
        top: 14px;
        right: 14px;
        z-index: 50;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px 15px;
        border-radius: 999px;
        background: rgba(11, 15, 26, 0.82);
        border: 1px solid rgba(255,255,255,0.12);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        opacity: 0;
        animation: chipIn 0.25s ease forwards;
        transition: opacity 0.3s ease;
    }
    #sessionCheck[hidden] { display: none; }
    @keyframes chipIn { to { opacity: 1; } }
    #sessionCheck .ring {
        width: 15px;
        height: 15px;
        border: 2px solid rgba(255,255,255,0.2);
        border-top-color: var(--ac);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        flex-shrink: 0;
    }
    #sessionCheck .txt {
        font-size: 11.5px;
        color: rgba(255,255,255,0.72);
        letter-spacing: 0.2px;
        white-space: nowrap;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── PAGE CONTAINER ── */
    .page {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
    }

    /* ── LOGIN CARD ── */
    .card {
        width: 100%;
        max-width: 380px;
        background: rgba(255,255,255,0.07);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 20px;
        padding: 34px 32px 28px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        animation: cardIn 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes cardIn {
        from { opacity: 0; transform: translateY(16px) scale(0.97); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        margin-bottom: 22px;
    }
    /* The logo is a WIDE lockup in dark navy, so it needs its natural
       aspect ratio (not a 46x46 crop) and a light chip behind it —
       on the dark card the navy "Clinic" text was invisible. */
    .brand img {
        height: 40px;
        width: auto;
        max-width: 190px;
        object-fit: contain;
        display: block;
        margin: 0 auto 12px;
        padding: 9px 15px;
        border-radius: 11px;
        background: #fff;
        box-shadow: 0 3px 14px rgba(0,0,0,0.28);
    }
    .brand .fallback-icon {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        background: var(--gradient);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        margin-bottom: 10px;
        color: #06281c;
    }
    .brand .name {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.5px;
        color: #fff;
    }
    .brand .tagline {
        font-size: 12px;
        color: rgba(255,255,255,0.55);
        margin-top: 3px;
    }

    label {
        display: block;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.8px;
        color: rgba(255,255,255,0.55);
        margin-bottom: 6px;
    }
    .field { margin-bottom: 16px; }
    .input-wrap { position: relative; }
    .input-wrap .icon-left {
        position: absolute;
        left: 13px;
        top: 50%;
        transform: translateY(-50%);
        color: rgba(255,255,255,0.4);
        font-size: 15px;
        pointer-events: none;
    }
    .input-wrap input {
        width: 100%;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 11px;
        padding: 11px 14px 11px 38px;
        font-size: 14px;
        color: #fff;
        font-family: var(--f);
        transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .input-wrap input::placeholder { color: rgba(255,255,255,0.32); }
    .input-wrap input:focus {
        outline: none;
        border-color: var(--ac);
        background: rgba(255,255,255,0.09);
        box-shadow: 0 0 0 3px rgba(52,211,153,0.18);
    }
    .input-wrap input.error {
        border-color: #f87171;
        box-shadow: 0 0 0 3px rgba(248,113,113,0.18);
    }
    .pw-toggle {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: transparent;
        border: none;
        color: rgba(255,255,255,0.45);
        cursor: pointer;
        font-size: 16px;
        padding: 4px;
        display: flex;
        transition: color 0.2s;
    }
    .pw-toggle:hover { color: rgba(255,255,255,0.9); }

    .row-between {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
        font-size: 12.5px;
    }
    .remember-check {
        display: flex;
        align-items: center;
        gap: 7px;
        color: rgba(255,255,255,0.6);
        cursor: pointer;
    }
    .remember-check input {
        width: 15px;
        height: 15px;
        accent-color: var(--ac);
        cursor: pointer;
    }

    .btn-submit {
        width: 100%;
        padding: 12px;
        border-radius: 11px;
        border: none;
        font-family: var(--f);
        font-size: 14px;
        font-weight: 700;
        color: #06281c;
        background: var(--gradient);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        box-shadow: 0 8px 24px rgba(52,211,153,0.3);
        transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
    }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(52,211,153,0.4); }
    .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

    .spinner {
        display: none;
        width: 16px;
        height: 16px;
        border: 2.5px solid rgba(6,40,28,0.3);
        border-top-color: #06281c;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
    }
    .spinner.active { display: block; }

    .message {
        margin-top: 16px;
        padding: 10px 14px;
        border-radius: 10px;
        text-align: center;
        font-size: 12.5px;
        display: none;
        animation: msgIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .message.show { display: block; }
    .message.success { background: rgba(52,211,153,0.15); color: #6ee7b7; border: 1px solid rgba(52,211,153,0.25); }
    .message.error { background: rgba(248,113,113,0.15); color: #fca5a5; border: 1px solid rgba(248,113,113,0.25); }
    @keyframes msgIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .back-link {
        display: block;
        text-align: center;
        margin-top: 22px;
        font-size: 12px;
        color: rgba(255,255,255,0.4);
        text-decoration: none;
        transition: color 0.2s;
    }
    .back-link:hover { color: rgba(255,255,255,0.8); }

    @media (max-width: 420px) {
        .card { padding: 28px 22px 24px; border-radius: 16px; }
        .brand .name { font-size: 19px; }
    }
</style>
    </head>

<body>

    <!-- ═══ CHECKING EXISTING SESSION ═══ -->
    <div id="sessionCheck" hidden>
        <div class="ring"></div>
        <div class="txt">Checking your session…</div>
    </div>

    <div class="bg-wrapper"></div>
    <div class="bg-overlay"></div>

    <div class="page" id="pageContent">
        <div class="card">
            <div class="brand">
                <img src="logo-login.png" alt="PClinic" width="181" height="64" fetchpriority="high" onerror="this.style.display='none'; document.getElementById('fallbackIcon').style.display='flex';"/>
                <div class="fallback-icon" id="fallbackIcon" style="display:none;"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M9 8h1m-1 4h1m-1 4h1m4-8h1m-1 4h1m-1 4h1M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16"/></svg></div>
                <div class="name">PClinic</div>
                <div class="tagline">Sign in to your dashboard</div>
            </div>

            <form id="loginForm" autocomplete="off" novalidate>
                <div class="field">
                    <label>STAFF ID</label>
                    <div class="input-wrap">
                        <span class="icon-left"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z"/><path d="M10 7h4M9 13a2 2 0 1 0 4 0 2 2 0 1 0-4 0M8 17a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2"/></svg></span>
                        <input
                            type="text"
                            inputmode="numeric"
                            pattern="[0-9]*"
                            id="staffId"
                            required
                            autocomplete="off"
                            placeholder="e.g. 41054"
                        />
                    </div>
                </div>

                <div class="field">
                    <label>PASSWORD</label>
                    <div class="input-wrap">
                        <span class="icon-left"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M12 16v.01M8 11V7a4 4 0 1 1 8 0v4"/></svg></span>
                        <input
                            type="password"
                            id="password"
                            required
                            autocomplete="current-password"
                            placeholder="••••••••"
                            style="padding-right:40px;"
                        />
                        <button type="button" class="pw-toggle" id="togglePassword" aria-label="Toggle password visibility">
                            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12a2 2 0 1 0 4 0 2 2 0 1 0-4 0"/><path d="M21 12c-2.4 4-5.4 6-9 6s-6.6-2-9-6c2.4-4 5.4-6 9-6s6.6 2 9 6"/></svg>
                        </button>
                    </div>
                </div>

                <div class="row-between">
                    <label class="remember-check" title="Sessions and identifiers are not retained on shared clinic devices">
                        <input type="checkbox" id="remember" disabled />
                        <span>Secure session-only login</span>
                    </label>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <span id="btnText">Sign In</span>
                    <span class="spinner" id="spinner"></span>
                </button>
            </form>

            <div class="message" id="message"></div>

            <a href="index.html" class="back-link">← Back to Home</a>
        </div>
    </div>

    <!-- ═══ FIREBASE (must load first) ═══ -->
    <script type="module" src="firebase-config.js"></script>

    <!-- ═══ LOGIN LOGIC ═══ -->
    <script>
        (function() {
            'use strict';

            const sessionCheck = document.getElementById('sessionCheck');
            const pageContent = document.getElementById('pageContent');
            const form = document.getElementById('loginForm');
            const staffIdInput = document.getElementById('staffId');
            const passwordInput = document.getElementById('password');
            const messageEl = document.getElementById('message');
            const toggleBtn = document.getElementById('togglePassword');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');
            const rememberCheck = document.getElementById('remember');

            // Fail closed on shared devices: opening the login page removes
            // clinical data and staff identifiers left by an earlier session.
            try {
                const allowedPreferences = { 'pclinic-theme': true, 'pclinic-lang': true, 'pclinic-compact': true, 'pclinic-fontsize': true };
                Object.keys(localStorage).forEach(function (key) {
                    if ((key.indexOf('pclinic') === 0 || key === 'userRole' || key === 'userName') && !allowedPreferences[key]) {
                        localStorage.removeItem(key);
                    }
                });
            } catch (e) {}
            if (rememberCheck) rememberCheck.checked = false;

            // The form is already painted and usable. These just manage the
            // small background-check chip in the corner.
            function revealForm() { hideSessionChip(); }

            function hideSessionChip() {
                if (!sessionCheck || sessionCheck.hidden) return;
                sessionCheck.style.opacity = '0';
                setTimeout(function () { sessionCheck.hidden = true; }, 300);
            }

            // Only show the chip if the session check is actually taking a
            // moment. Below this threshold it resolves before a user would
            // ever notice, and a flash of spinner is worse than none.
            let sessionChipTimer = setTimeout(function () {
                if (sessionCheck) sessionCheck.hidden = false;
            }, 450);
            function cancelSessionChip() {
                clearTimeout(sessionChipTimer);
                hideSessionChip();
            }

            // ─── TOGGLE PASSWORD ───
            toggleBtn.addEventListener('click', function() {
                const svg = this.querySelector('svg');
                const shown = passwordInput.type === 'text';
                passwordInput.type = shown ? 'password' : 'text';
                svg.innerHTML = shown
                    ? '<path d="M10 12a2 2 0 1 0 4 0 2 2 0 1 0-4 0"/><path d="M21 12c-2.4 4-5.4 6-9 6s-6.6-2-9-6c2.4-4 5.4-6 9-6s6.6 2 9 6"/>'
                    : '<path d="m3 3 18 18"/><path d="M10.585 10.587a2 2 0 0 0 2.829 2.828"/><path d="M16.681 16.673A8.717 8.717 0 0 1 12 18c-3.6 0-6.6-2-9-6 1.272-2.12 2.712-3.678 4.32-4.674m2.86-1.146A9.055 9.055 0 0 1 12 6c3.6 0 6.6 2 9 6-.666 1.11-1.379 2.067-2.138 2.87"/>';
            });

            function showMessage(text, type) {
                messageEl.textContent = text;
                messageEl.className = 'message show ' + (type === 'success' ? 'success' : 'error');
            }
            function hideMessage() {
                messageEl.className = 'message';
                messageEl.textContent = '';
            }
            function setLoading(loading) {
                submitBtn.disabled = loading;
                btnText.textContent = loading ? 'Signing in…' : 'Sign In';
                spinner.classList.toggle('active', loading);
            }

            // Staff identifiers are not retained on shared clinic devices.
            localStorage.removeItem('pclinic_remember_staffid');

            // If a previous page redirected us here with a reason, show it once the form is visible.
            const authMsg = sessionStorage.getItem('pclinic_auth_message');

            function friendlyAuthError(err) {
                const code = err && err.code ? err.code : '';
                switch (code) {
                    case 'auth/invalid-credential':
                    case 'auth/user-not-found':
                    case 'auth/wrong-password':
                        return '❌ Incorrect Staff ID or password.';
                    case 'auth/too-many-requests':
                        return '⚠️ Too many attempts. Please wait a moment and try again.';
                    case 'auth/network-request-failed':
                        return '⚠️ Network error. Check your connection and try again.';
                    case 'auth/invalid-email':
                        return '⚠️ Staff ID must be numeric only.';
                    default:
                        return '❌ Login failed. Please try again.';
                }
            }

            async function waitForFirebase() {
                if (window.firebaseReady && window.firebaseAuth) return true;
                return new Promise((resolve) => {
                    window.addEventListener('firebaseReady', () => resolve(true), { once: true });
                    setTimeout(() => resolve(!!window.firebaseAuth), 8000);
                });
            }

            // ─── SECURE LOGIN INITIALIZATION ───
            // Opening the login page always ends any existing session. It also
            // performs a one-time cleanup of IndexedDB left by older releases,
            // then reloads with a fresh in-memory Firestore instance.
            (async function initializeSecureLogin() {
                const ready = await waitForFirebase();
                if (!ready) {
                    cancelSessionChip();
                    if (authMsg) { showMessage(authMsg, 'error'); sessionStorage.removeItem('pclinic_auth_message'); }
                    return;
                }
                try {
                    if (typeof window.firebaseAuth.authStateReady === 'function') await window.firebaseAuth.authStateReady();
                    if (window.firebaseAuth.currentUser) {
                        await window.firebaseAuthFunctions.signOut(window.firebaseAuth);
                    }
                } catch (e) {}

                if (!sessionStorage.getItem('pclinic_login_cache_reset')) {
                    sessionStorage.setItem('pclinic_login_cache_reset', '1');
                    try {
                        if (typeof window.pclinicClearFirebaseCache === 'function') {
                            await window.pclinicClearFirebaseCache();
                        }
                    } catch (e) {}
                    window.location.replace('login.html');
                    return;
                }

                cancelSessionChip();
                if (authMsg) {
                    showMessage(authMsg, 'error');
                    sessionStorage.removeItem('pclinic_auth_message');
                }
            })();

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                hideMessage();

                const staffId = staffIdInput.value.trim();
                const password = passwordInput.value;

                if (!/^[0-9]+$/.test(staffId)) {
                    staffIdInput.classList.add('error');
                    showMessage('⚠️ Staff ID must contain numbers only.', 'error');
                    staffIdInput.focus();
                    return;
                }
                staffIdInput.classList.remove('error');

                if (!password) {
                    passwordInput.classList.add('error');
                    showMessage('⚠️ Please enter your password.', 'error');
                    passwordInput.focus();
                    return;
                }
                passwordInput.classList.remove('error');

                setLoading(true);

                const ready = await waitForFirebase();
                if (!ready) {
                    setLoading(false);
                    showMessage('❌ Could not connect. Please check your internet and try again.', 'error');
                    return;
                }

                try {
                    const { signInWithEmailAndPassword } = window.firebaseAuthFunctions;
                    const email = window.pclinicStaffIdToEmail(staffId);
                    const cred = await signInWithEmailAndPassword(window.firebaseAuth, email, password);

                    const { doc, getDoc } = window.firebaseFunctions;
                    const userSnap = await getDoc(doc(window.firebaseDB, 'users', cred.user.uid));

                    if (!userSnap.exists()) {
                        await window.firebaseAuthFunctions.signOut(window.firebaseAuth);
                        showMessage('❌ Account not set up. Contact your administrator.', 'error');
                        setLoading(false);
                        return;
                    }
                    const profile = userSnap.data();
                    if (profile.active === false) {
                        await window.firebaseAuthFunctions.signOut(window.firebaseAuth);
                        showMessage('❌ This account has been disabled. Contact your administrator.', 'error');
                        setLoading(false);
                        return;
                    }

                    localStorage.removeItem('pclinic_remember_staffid');

                    showMessage(`✅ Welcome, ${profile.name || staffId}!`, 'success');
                    // Redirect right away — no artificial waiting.
                    window.location.replace('hub.html');

                } catch (err) {
                    console.error('Login error:', err);
                    showMessage(friendlyAuthError(err), 'error');
                    setLoading(false);
                }
            });

            staffIdInput.addEventListener('input', function() {
                this.classList.remove('error');
                hideMessage();
            });
            passwordInput.addEventListener('input', function() {
                this.classList.remove('error');
                hideMessage();
            });

            console.log('🏥 PClinic Login — Firebase Auth (numeric Staff ID)');
        })();
    </script>

</body>
</html>
