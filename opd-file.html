<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PClinic — OPD File</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="pclinic-ui.css?v=20260804_CHUK_3ROW">
<link rel="stylesheet" href="pclinic-file.css">
<link rel="preload" as="style" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css"></noscript>
<script>(function(){try{document.documentElement.setAttribute('data-theme',localStorage.getItem('pclinic-theme')||'light');}catch(e){}})();</script>
</head>
<body class="pcf">

<div class="pc-topbar noprint" style="display: none !important;">
    <div class="pc-brand">
        <img class="pc-logo" src="logo-wide.png" alt="PClinic" width="118" height="30">
        <span class="pc-appsub" id="appSub">OPD File</span>
    </div>
    <div class="pc-tr">
        <button class="pc-iconbtn" onclick="if(window.pcVitals) pcVitals.open();" title="Vital Signs" style="width:auto;padding:0 12px;display:inline-flex;align-items:center;gap:6px;background:rgba(225,29,72,0.08);color:#e11d48;border-radius:18px;font-weight:600;font-size:13px;height:32px;border:none;cursor:pointer;"><i class="ti ti-heart-rate-monitor"></i> Vital Signs</button>
        <button class="pc-iconbtn" onclick="pcToggleTheme()" title="Dark mode"><i class="ti ti-moon" id="themeIcon"></i></button>
        <div class="pc-chip"><span class="pc-avatar" id="userAvatar">··</span><span id="userName">…</span></div>
        <button class="pc-iconbtn" onclick="pclinicLogout()" title="Sign out"><i class="ti ti-logout"></i></button>
    </div>
</div>

<div class="pcf-wrap">
    <div id="pcfRoot" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>
</div>

<div class="pc-toasts noprint"></div>

<script type="module" src="firebase-config.js"></script>
<script src="auth-guard.js"></script>
<script src="pclinic-state.js"></script>
<script src="patient-data.js"></script>
<script src="pclinic-orders.js"></script>
<script src="pclinic-catalog.js"></script>
<script src="pclinic-file.js?v=20260804_CHUK_3ROW"></script>
<script src="pclinic-vitals.js"></script>
<script src="pclinic-filepage.js"></script>
<script>
pcFilePage.init({
  "type": "opd",
  "ref": "OPD",
  "title": "OPD File",
  "sub": "OPD File",
  "docTitle": "Out-Patient Consultation",
  "icon": "ti-folder-open",
  "histTitle": "OPD visit history",
  "histUnit": "visit",
  "newLabel": "New OPD File for Today",
  "dx": true,
  "rdv": true,
  "att": true,
  "vitals": false,
  "rx": false,
  "fields": [
    {
      "id": "complaint",
      "label": "Chief complaint & history of presenting illness (including duration)",
      "kind": "area",
      "ph": "e.g. Fever and headache for 3 days. Gradual onset, associated chills, worse at night, no relief with paracetamol…",
      "panel": "Consultation",
      "icon": "ti-stethoscope",
      "rows": 5
    },
    {
      "id": "past",
      "label": "Past medical / surgical history",
      "kind": "area",
      "ph": "Previous illnesses, operations, chronic medication…",
      "panel": "Consultation"
    },
    {
      "id": "exam",
      "label": "Examination findings",
      "kind": "area",
      "ph": "General condition, systemic examination…",
      "panel": "Examination",
      "icon": "ti-clipboard-heart"
    },
    {
      "id": "plan",
      "label": "Management plan",
      "kind": "area",
      "ph": "Investigations, treatment, advice…",
      "panel": "Plan",
      "icon": "ti-clipboard-check"
    }
  ]
});
</script>
<script src="pclinic-handoff.js"></script>

</html>
