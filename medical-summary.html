<html lang="en" data-theme="light">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f5f5f7;
            --s1: #ffffff;
            --s2: #f8f9fa;
            --s3: #f1f3f6;
            --bd: #d1d5db;
            --tp: #1a1a2e;
            --ts: #374151;
            --tm: #6b7280;
            --ac: #0071e3;
            --ach: #005bb5;
            --green: #10b981;
            --greenb: #e9f9ee;
            --greend: #1a7a32;
            --orange: #ff9500;
            --orangeb: #fff4e0;
            --oranged: #7a4500;
            --red: #ef4444;
            --redb: #ffebe9;
            --redd: #8a1f1a;
            --purple: #7c3aed;
            --purpleb: #f5eaff;
            --purpled: #5c2475;
            --shadow: 0 1px 3px rgba(0,0,0,0.05), 0 4px 14px rgba(0,0,0,0.05);
            --shadow2: 0 6px 20px rgba(0, 113, 227, 0.12), 0 2px 6px rgba(0,0,0,0.04);
            --f: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
            color-scheme: light;
        }

        [data-theme="dark"], html[data-theme="dark"], body.dark-mode {
            --bg: #0b111e !important;
            --s1: #161f30 !important;
            --s2: #1e293b !important;
            --s3: #263346 !important;
            --bd: rgba(255, 255, 255, 0.12) !important;
            --tp: #f1f5f9 !important;
            --ts: #cbd5e1 !important;
            --tm: #94a3b8 !important;
            --ac: #38bdf8 !important;
            --ach: #0284c7 !important;
            color-scheme: dark;
        }

        body {
            font-family: var(--f);
            background: var(--bg);
            background-image:
                radial-gradient(1200px 700px at 12% 8%, rgba(0, 113, 227, 0.05), transparent 55%),
                radial-gradient(1100px 680px at 88% 14%, rgba(16, 185, 129, 0.04), transparent 55%);
            background-attachment: fixed;
            color: var(--tp);
            font-size: 13px;
            padding: 0 16px 32px;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* ═══ 3 BARS TOP HIERARCHY — MATCHING OTHER OPD PAGES ═══ */
        html body #pcMasterHeader, html body #pcMasterHeader.pc-master-header {
            display: flex !important; flex-direction: column !important; gap: 8px !important;
            position: relative !important; z-index: 40 !important;
            width: 100% !important; max-width: 100% !important; margin: 0 auto 12px auto !important;
            padding: 8px 16px 4px !important; background: transparent !important;
            overflow: visible !important;
        }
        html body #pc_chuk_top_menu.chuk-top-menu { position: relative !important; top: auto !important; z-index: 3 !important; }
        html body #pc_common_demo_bar.oc-demo-bar, html body .oc-demo-bar { position: relative !important; top: auto !important; z-index: 2 !important; margin: 0 !important; flex-shrink: 0 !important; }
        html body #dcBar.dc-bar, html body #dcBar { position: relative !important; top: auto !important; z-index: 1 !important; margin: 0 !important; width: 100% !important; clear: both !important; flex-shrink: 0 !important; }

        /* ═══ MAIN MACBOOK CONTAINER ═══ */
        .mac-summary-wrap {
            max-width: 1440px;
            margin: 0 auto;
            position: relative;
        }

        .mac-window-shell {
            background: rgba(255, 255, 255, 0.80);
            -webkit-backdrop-filter: blur(32px) saturate(190%);
            backdrop-filter: blur(32px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(15, 45, 90, 0.08), inset 0 1px 1px #ffffff;
            overflow: hidden;
            transition: all 0.25s ease;
        }

        [data-theme="dark"] .mac-window-shell {
            background: rgba(20, 28, 45, 0.82);
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45), inset 0 1px 1px rgba(255,255,255,0.06);
        }

        /* ═══ MACBOOK WINDOW HEADER STRIP ═══ */
        .mac-title-bar {
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.65);
            border-bottom: 1px solid rgba(15, 23, 42, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        [data-theme="dark"] .mac-title-bar {
            background: rgba(26, 36, 56, 0.70);
            border-bottom-color: rgba(255, 255, 255, 0.08);
        }

        .mac-title-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mac-traffic-dots {
            display: inline-flex;
            gap: 6px;
            align-items: center;
        }

        .mac-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            display: inline-block;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .mac-dot:hover { opacity: 0.8; }
        .mac-dot-red    { background: #ff5f56; border: 0.5px solid #e0443e; }
        .mac-dot-yellow { background: #ffbd2e; border: 0.5px solid #dea123; }
        .mac-dot-green  { background: #27c93f; border: 0.5px solid #1aab29; }

        .mac-heading {
            font-size: 14px;
            font-weight: 700;
            color: var(--tp);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.01em;
        }
        .mac-heading i { color: var(--ac); font-size: 16px; }

        .mac-count-pill {
            font-size: 11.5px;
            font-weight: 600;
            color: #0369a1;
            background: rgba(224, 242, 254, 0.85);
            border: 0.5px solid rgba(56, 189, 248, 0.40);
            padding: 2px 9px;
            border-radius: 999px;
        }

        [data-theme="dark"] .mac-count-pill {
            color: #38bdf8;
            background: rgba(14, 165, 233, 0.18);
            border-color: rgba(56, 189, 248, 0.35);
        }

        /* ═══ MACBOOK FILTER SEARCH CAPSULE ═══ */
        .mac-search-capsule {
            display: flex;
            align-items: center;
            gap: 7px;
            height: 34px;
            padding: 0 12px;
            background: rgba(255, 255, 255, 0.90);
            border: 1px solid rgba(15, 23, 42, 0.10);
            border-radius: 999px;
            box-shadow: 0 2px 6px rgba(15, 45, 90, 0.05);
            width: 280px;
            transition: all 0.22s ease;
        }

        .mac-search-capsule:focus-within {
            width: 320px;
            border-color: var(--ac);
            box-shadow: 0 4px 14px rgba(0, 113, 227, 0.18);
            background: #ffffff;
        }

        [data-theme="dark"] .mac-search-capsule {
            background: rgba(30, 41, 59, 0.85);
            border-color: rgba(255, 255, 255, 0.14);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .mac-search-capsule i {
            font-size: 14px;
            color: #64748b;
        }

        .mac-search-capsule input {
            border: none;
            outline: none;
            background: transparent;
            font-family: inherit;
            font-size: 12px;
            color: var(--tp);
            width: 100%;
        }

        .mac-search-capsule input::placeholder {
            color: #94a3b8;
        }

        .mac-key-badge {
            font-size: 9.5px;
            font-weight: 600;
            color: #64748b;
            background: rgba(15, 23, 42, 0.06);
            border: 0.5px solid rgba(15, 23, 42, 0.08);
            border-radius: 5px;
            padding: 1px 4.5px;
            flex-shrink: 0;
        }

        [data-theme="dark"] .mac-key-badge {
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.12);
        }

        /* ═══ CATEGORY TABS ROW ═══ */
        .mac-filter-tabs {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.40);
            border-bottom: 1px solid rgba(15, 23, 42, 0.05);
            overflow-x: auto;
            scrollbar-width: none;
        }
        .mac-filter-tabs::-webkit-scrollbar { display: none; }

        [data-theme="dark"] .mac-filter-tabs {
            background: rgba(18, 25, 39, 0.50);
            border-bottom-color: rgba(255, 255, 255, 0.06);
        }

        .mac-pill-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            height: 28px;
            padding: 0 11px;
            border-radius: 999px;
            border: 1px solid rgba(15, 23, 42, 0.08);
            background: rgba(255, 255, 255, 0.70);
            font-size: 11.5px;
            font-weight: 600;
            color: var(--ts);
            cursor: pointer;
            transition: all 0.18s ease;
            white-space: nowrap;
        }

        .mac-pill-btn:hover {
            background: #ffffff;
            color: var(--ac);
            border-color: rgba(0, 113, 227, 0.3);
            transform: translateY(-1px);
        }

        .mac-pill-btn.active {
            background: #0071e3 !important;
            color: #ffffff !important;
            border-color: #0071e3 !important;
            box-shadow: 0 2px 8px rgba(0, 113, 227, 0.35);
        }

        [data-theme="dark"] .mac-pill-btn {
            background: rgba(30, 41, 59, 0.65);
            border-color: rgba(255, 255, 255, 0.10);
            color: #cbd5e1;
        }
        [data-theme="dark"] .mac-pill-btn:hover {
            background: rgba(51, 65, 85, 0.9);
            color: #38bdf8;
        }
        [data-theme="dark"] .mac-pill-btn.active {
            background: #0284c7 !important;
            color: #ffffff !important;
            border-color: #0284c7 !important;
        }

        /* ═══ MACBOOK 2-COLUMN FORM CARDS GRID ═══ */
        .mac-body-content {
            padding: 16px 18px 22px;
        }

        .mac-cards-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        @media (max-width: 900px) {
            .mac-cards-grid {
                grid-template-columns: 1fr;
            }
        }

        .mac-card {
            background: rgba(255, 255, 255, 0.85);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.95);
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(15, 45, 90, 0.04), inset 0 1px 1px #ffffff;
            transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-decoration: none;
            position: relative;
        }

        .mac-card:hover {
            background: #ffffff;
            transform: translateY(-2px) scale(1.006);
            box-shadow: 0 8px 24px rgba(0, 113, 227, 0.14), 0 2px 6px rgba(0,0,0,0.04);
            border-color: rgba(0, 113, 227, 0.35);
        }

        .mac-card:active {
            transform: scale(0.985);
        }

        [data-theme="dark"] .mac-card {
            background: rgba(26, 36, 56, 0.80);
            border-color: rgba(255, 255, 255, 0.08);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }
        [data-theme="dark"] .mac-card:hover {
            background: rgba(33, 46, 70, 0.95);
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .mac-card-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.04);
        }

        .mac-card-body {
            flex: 1;
            min-width: 0;
        }

        .mac-card-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--tp);
            line-height: 1.3;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .mac-card-sub {
            font-size: 11px;
            color: var(--tm);
            margin-top: 1.5px;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rec-date {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            height: 19px;
            padding: 0 7px;
            border-radius: 999px;
            background: rgba(16, 185, 129, 0.12);
            color: #059669;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin-left: 6px;
        }

        [data-theme="dark"] .rec-date {
            background: rgba(16, 185, 129, 0.20);
            color: #34d399;
        }

        .mac-card-btn {
            height: 28px;
            padding: 0 12px;
            border-radius: 999px;
            background: linear-gradient(180deg, #0a84ff, #0071e3);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            box-shadow: 0 2px 6px rgba(0, 113, 227, 0.30);
            cursor: pointer;
            transition: all 0.18s ease;
            flex-shrink: 0;
        }

        .mac-card:hover .mac-card-btn {
            background: #0071e3;
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.45);
            transform: scale(1.05);
        }

        /* ═══ EMPTY FILTER RESULT ═══ */
        .mac-no-match {
            text-align: center;
            padding: 40px 20px;
            color: var(--tm);
            font-size: 12.5px;
            grid-column: 1 / -1;
        }

        /* ═══ LOCK / PATIENT GATE ═══ */
        #medSummaryLock {
            text-align: center;
            padding: 60px 20px;
            color: var(--tm);
            font-size: 13px;
        }
        #medSummaryLock .lock-orb {
            width: 60px;
            height: 60px;
            margin: 0 auto 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            background: rgba(0, 113, 227, 0.08);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        /* ═══ TOAST ═══ */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            padding: 10px 16px;
            border-radius: 12px;
            background: var(--tp);
            color: var(--bg);
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>

        { id: 20, cat: 'diagnostics', title: 'Physiotherapy evaluation form',        target: 'physio-request.html',       type: 'physio',      icon: 'ti-run',                  icBg: '#e6f6f8', icCol: '#007080', desc: 'Functional physiotherapy report' },

        // ── Registries & Nursing ──
        { id: 13, cat: 'registry',    title: 'MSAS - Register Injection',            target: 'injection-registry.html',   type: 'injection',   icon: 'ti-needle',               icBg: '#e6f6f8', icCol: '#007080', desc: 'MOH injectable medication register' },
        { id: 14, cat: 'registry',    title: 'MSAS - Register pansement',            target: 'pansement-registry.html',   type: 'pansement',   icon: 'ti-bandage',              icBg: '#e6f6f8', icCol: '#007080', desc: 'Wound dressing & pansement log' },
        { id: 15, cat: 'registry',    title: 'MSHP - Blood transfusion receiver',    target: 'transfusion-registry.html', type: 'transfusion', icon: 'ti-droplet',              icBg: '#ffebe9', icCol: '#c0392b', desc: 'Blood product receiver registry' },
        { id: 16, cat: 'registry',    title: 'MSPLS - HC - Deaths registry',         target: 'deaths-registry.html',      type: 'death',       icon: 'ti-book',                 icBg: '#f1f5f9', icCol: '#475569', desc: 'Mortality & deaths health register' },
        { id: 19, cat: 'registry',    title: 'Pediatric triage (CPTAS)',             target: 'triage-form.html',          type: 'triage',      icon: 'ti-shield-check',         icBg: '#eaf2ff', icCol: '#0071e3', desc: 'Canadian Pediatric Triage Scale' },
        { id: 7,  cat: 'registry',    title: 'Follow-up of psychiatric patient',     target: 'psychiatric-care.html',     type: 'psych',       icon: 'ti-mood-smile',           icBg: '#f5eaff', icCol: '#7c3aed', desc: 'Mental health & psychiatric review' },
        { id: 23, cat: 'registry',    title: 'Psychiatric care',                     target: 'psychiatric-care.html',     type: 'psych',       icon: 'ti-brain',                icBg: '#f5eaff', icCol: '#7c3aed', desc: 'Psychiatric assessment & care plan' },

        // ── Legal & Transfers ──
        { id: 3,  cat: 'legal',       title: 'Death certificate in ICD-11',          target: 'medical-certificate.html',  type: null,          icon: 'ti-file-certificate',     icBg: '#f1f5f9', icCol: '#334155', desc: 'Official death certificate ICD-11' },
        { id: 18, cat: 'legal',       title: 'Patient transfer',                     target: 'transfer-form.html',        type: null,          icon: 'ti-ambulance',            icBg: '#eaf2ff', icCol: '#0071e3', desc: 'Inter-facility patient transfer' },
        { id: 24, cat: 'legal',       title: 'Referral letter',                      target: 'referral.html',             type: null,          icon: 'ti-mail-forward',         icBg: '#eaf2ff', icCol: '#0071e3', desc: 'Specialist clinical referral letter' },
        { id: 30, cat: 'legal',       title: 'Warning',                              target: 'messages.html',             type: null,          icon: 'ti-alert-triangle',       icBg: '#fff4e0', icCol: '#b85d00', desc: 'Clinical alert & warning notice' }
    ];

    // ─── FAST PATIENT RESOLVER (0ms DELAY) ───
    function resolvePatientImmediately() {
        try {
            const urlParams = new URLSearchParams(window.location.search);
            const pid = urlParams.get('patient') || localStorage.getItem('pclinic_active_patient');
            if (pid) {
                const pts = JSON.parse(localStorage.getItem('pclinic_patients') || '[]');
                const found = pts.find(p => String(p.id) === String(pid) || String(p.mrn) === String(pid));
                if (found) {
                    currentPatient = found;
                    return;
                }
                // Construct instantaneous patient object so forms never lock
                currentPatient = {
                    id: String(pid),
                    mrn: String(pid),
                    name: 'Patient #' + pid,
                    firstName: 'Patient #' + pid
                };
            }
        } catch(e) {}
    }

    function applyPatientGate() {
        const p = currentPatient;
        const grid = document.getElementById('macCardsGrid');
        const count = document.getElementById('medSummaryCount');

        if (grid) grid.style.display = 'grid';
        if (count) {
            const num = grid ? grid.querySelectorAll('.mac-card:not([style*="display: none"])').length : 30;
            if (p && p.id) {
                count.textContent = `${num} of 30 Records · Pt #${p.id}`;
            } else {
                count.textContent = `${num} of 30 Records`;
            }
        }
    }

    function renderCards() {
        const grid = document.getElementById('macCardsGrid');
        if (!grid) return;

        let filtered = SUMMARY_ITEMS;

        // Category filter
        if (activeCategory !== 'all') {
            filtered = filtered.filter(item => item.cat === activeCategory);
        }

        // Search text filter
        if (searchQuery.trim().length > 0) {
            const q = searchQuery.trim().toLowerCase();
            filtered = filtered.filter(item =>
                item.title.toLowerCase().includes(q) ||
                item.desc.toLowerCase().includes(q) ||
                item.cat.toLowerCase().includes(q)
            );
        }

        const countEl = document.getElementById('medSummaryCount');
        if (countEl && currentPatient) {
            countEl.textContent = `${filtered.length} of 30 Records`;
        }

        if (!filtered.length) {
            grid.innerHTML = `
                <div class="mac-no-match">
                    <i class="ti ti-search" style="font-size:24px; color:var(--tm); display:block; margin-bottom:6px;"></i>
                    No clinical record matching “${escapeHtml(searchQuery)}”.
                </div>
            `;
            applyPatientGate();
            return;
        }

        // Render macOS Cards
        grid.innerHTML = filtered.map(item => {
            let lastBadge = '';
            if (currentPatient && currentPatient.id && item.type) {
                try {
                    const docs = (window.pcFile && typeof pcFile.list === 'function')
                        ? pcFile.list(currentPatient.id, item.type)
                        : (function(){ try { return JSON.parse(localStorage.getItem('pclinic_files') || '[]'); } catch(e){ return []; } })()
                              .filter(d => String(d.patientId) === String(currentPatient.id) && d.type === item.type);
                    if (docs && docs.length) {
                        const last = docs.reduce((a, b) => (new Date(a.at || a.timestamp || 0) > new Date(b.at || b.timestamp || 0) ? a : b));
                        const d = last.at || last.timestamp;
                        if (d) {
                            lastBadge = `<span class="rec-date"><i class="ti ti-check"></i> Last: ${new Date(d).toLocaleDateString('en-GB')}</span>`;
                        }
                    }
                } catch(e) {}
            }

            return `
            <div class="mac-card" onclick="window.launchForm('${item.target}', '${escapeHtml(item.title)}')">
                <div class="mac-card-icon" style="background:${item.icBg}; color:${item.icCol};">
                    <i class="ti ${item.icon}"></i>
                </div>
                <div class="mac-card-body">
                    <div class="mac-card-title">
                        <span>${escapeHtml(item.title)}</span>
                        ${lastBadge}
                    </div>
                    <div class="mac-card-sub">${escapeHtml(item.desc)}</div>
                </div>
                <button class="mac-card-btn" aria-label="Open ${escapeHtml(item.title)}">
                    New <i class="ti ti-chevron-right" style="font-size:11px;"></i>
                </button>
            </div>`;
        }).join('');

        applyPatientGate();
    }

    // ─── INSTANT FORM LAUNCH (NO DELAY) ───
    window.launchForm = function(target, title) {
        const p = currentPatient;
        if (target === 'vitals-action') {
            if (window.pcVitals) pcVitals.open();
            else showToast('📊 Recording Vital Signs', 'info');
            return;
        }

        if (p && p.id) {
            try { localStorage.setItem('pclinic_active_patient', String(p.id)); } catch(e){}
            window.location.href = `${target}?patient=${encodeURIComponent(p.id)}`;
        } else {
            const typedId = (document.getElementById('ocSearchId') && document.getElementById('ocSearchId').value.trim()) ||
                            (document.getElementById('ocSearchMrn') && document.getElementById('ocSearchMrn').value.trim()) ||
                            localStorage.getItem('pclinic_active_patient') || '';
            if (typedId) {
                try { localStorage.setItem('pclinic_active_patient', String(typedId)); } catch(e){}
                window.location.href = `${target}?patient=${encodeURIComponent(typedId)}`;
            } else {
                window.location.href = target;
            }
        }
    };

    window.closeMedicalSummary = function() {
        try {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'CLOSE_MODAL' }, window.location.origin);
                return;
            }
        } catch(e) {}
        window.location.href = 'doctor-dashboard.html';
    };

    function escapeHtml(str) {
        return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function showToast(msg, type = 'info') {
        const c = document.getElementById('toastContainer');
        if (!c) return;
        const t = document.createElement('div');
        t.className = 'toast';
        t.style.background = type === 'success' ? '#059669' : type === 'warning' ? '#b45309' : '#0f172a';
        t.innerHTML = `<i class="ti ti-info-circle"></i> ${escapeHtml(msg)}`;
        c.appendChild(t);
        setTimeout(() => t.remove(), 2600);
    }

    // ─── SEARCH & FILTER LISTENERS ───
    function setupFilters() {
        const searchInput = document.getElementById('formFilterInput');
        if (searchInput) {
            searchInput.addEventListener('input', function() {
                searchQuery = this.value;
                renderCards();
            });
            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    this.value = '';
                    searchQuery = '';
                    renderCards();
                    this.blur();
                }
            });
        }

        // Category buttons
        const pills = document.querySelectorAll('.mac-pill-btn');
        pills.forEach(btn => {
            btn.addEventListener('click', function() {
                pills.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                activeCategory = this.getAttribute('data-cat') || 'all';
                renderCards();
            });
        });

        // ⌘F / Ctrl+F Shortcut
        window.addEventListener('keydown', function(e) {
            if ((e.metaKey || e.ctrlKey) && (e.key === 'f' || e.key === 'F')) {
                e.preventDefault();
                if (searchInput) {
                    searchInput.focus();
                    searchInput.select();
                }
            }
        });
    }

    // ─── IMMEDIATE BOOT ON PARSE ───
    resolvePatientImmediately();
    renderCards();

    window.addEventListener('DOMContentLoaded', function () {
        resolvePatientImmediately();
        setupFilters();
        renderCards();

        if (typeof window.requireAuth === 'function') {
            window.requireAuth(['doctor','nurse']).then(function() {
                resolvePatientImmediately();
                renderCards();
            }).catch(function () {});
        }
    });

    window.addEventListener('pcPatientChanged', function(e) {
        if (e.detail && e.detail.id) {
            currentPatient = e.detail;
        } else {
            currentPatient = null;
        }
        renderCards();
    });

    window.addEventListener('storage', function() {
        resolvePatientImmediately();
        renderCards();
    });
    window.addEventListener('patientsUpdated', function() {
        resolvePatientImmediately();
        renderCards();
    });

})();
</script>
