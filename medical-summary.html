<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <script type="module" src="firebase-config.js"></script>
    <script src="auth-guard.js"></script>
    <script src="pclinic-state.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PClinic • PClinic Medical Summary</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css">
    <link rel="stylesheet" href="pclinic-ui.css?v=20260804_CHUK_3ROW">
    <link rel="stylesheet" href="pclinic-file.css">
    <link rel="stylesheet" href="pclinic-apple.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f5f5f7;
            --s1: #ffffff;
            --s2: #f8f9fa;
            --s3: #f1f3f6;
            --bd: #d1d5db;
            --tp: #1a1a2e;
            --ts: #374151;
            --tm: #6b7280;
            --ac: #0071e3;
            --ach: #005bb5;
            --green: #10b981;
            --green-dark: #059669;
            --red: #ef4444;
            --purple: #7c3aed;
            --shadow: 0 1px 4px rgba(0,0,0,0.05), 0 4px 12px rgba(0,0,0,0.04);
            --f: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
            --smooth: cubic-bezier(0.23, 1, 0.32, 1);
            color-scheme: light;
        }

        [data-theme="dark"], html[data-theme="dark"], body.dark-mode {
            --bg: #0d1117 !important;
            --s1: #161b22 !important;
            --s2: #1e242e !important;
            --s3: #262c36 !important;
            --bd: #30363d !important;
            --tp: #f0f6fc !important;
            --ts: #c9d1d9 !important;
            --tm: #8b949e !important;
            --ac: #58a6ff !important;
            color-scheme: dark;
        }

        body {
            font-family: var(--f);
            background: var(--bg);
            color: var(--tp);
            font-size: 13px;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .wrap {
            max-width: 1400px;
            margin: 0 auto;
            animation: fadeIn 0.12s var(--smooth);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .summary-wrapper {
            position: relative;
            background: rgba(255, 255, 255, 0.72);
            -webkit-backdrop-filter: saturate(180%) blur(24px);
            backdrop-filter: saturate(180%) blur(24px);
            border: 0.5px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.06);
            overflow: hidden;
            margin-bottom: 24px;
            transition: transform 0.45s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.45s cubic-bezier(0.34,1.56,0.64,1);
        }
        .summary-wrapper:hover {
            transform: translateY(-3px);
            box-shadow: 0 2px 6px rgba(0,0,0,0.06), 0 16px 44px rgba(0,0,0,0.10);
        }
        .summary-wrapper::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background: linear-gradient(160deg,
                rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.12) 28%, rgba(255,255,255,0) 55%);
        }

        .summary-title-strip {
            position: relative;
            padding: 14px 20px;
            background: rgba(0, 113, 227, 0.08);
            -webkit-backdrop-filter: saturate(180%) blur(18px);
            backdrop-filter: saturate(180%) blur(18px);
            border-bottom: 0.5px solid rgba(0, 0, 0, 0.07);
            font-weight: 800;
            font-size: 13.5px;
            color: #0071e3;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .summary-title-strip i { color: #0071e3; }

        [data-theme="dark"] .summary-title-strip {
            background: #1e242e !important;
        }

        table.oc-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        table.oc-table td {
            position: relative;
            padding: 11px 18px;
            border-bottom: 0.5px solid rgba(0, 0, 0, 0.05);
            color: var(--tp);
            vertical-align: middle;
        }

        table.oc-table tr:last-child td { border-bottom: none; }

        table.oc-table tbody tr {
            transition: background 0.3s cubic-bezier(0.25,0.1,0.25,1), transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
        }

        table.oc-table tr:hover {
            background: rgba(0, 113, 227, 0.06);
            transform: scale(1.004);
        }

        .form-bullet {
            color: var(--ac);
            font-weight: 800;
            margin-right: 8px;
        }

        .form-name {
            font-weight: 600;
            color: var(--tp);
        }

        .new-link {
            color: #ffffff;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            height: 30px;
            padding: 0 16px;
            border-radius: 980px;
            background: linear-gradient(180deg, #0a84ff, #0071e3);
            font-size: 11.5px;
            letter-spacing: -0.01em;
            box-shadow: 0 2px 8px rgba(0, 113, 227, 0.35), inset 0 1px 0 rgba(255,255,255,0.25);
            transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.35s cubic-bezier(0.34,1.56,0.64,1);
            -webkit-tap-highlight-color: transparent;
        }

        .new-link:hover {
            transform: translateY(-2px) scale(1.06);
            box-shadow: 0 10px 26px rgba(0, 113, 227, 0.45);
            text-decoration: none;
        }
        .new-link:active {
            transform: scale(0.93);
            transition-duration: 0.08s;
        }

        .rec-date {
            display: inline-flex;
            align-items: center;
            height: 22px;
            padding: 0 10px;
            margin-left: 8px;
            border-radius: 980px;
            background: rgba(0, 112, 128, 0.10);
            color: #007080;
            font-family: inherit;
            font-size: 10.5px;
            font-weight: 800;
            letter-spacing: -0.01em;
        }

        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            padding: 12px 18px;
            border-radius: 12px;
            background: var(--tp);
            color: var(--bg);
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body class="apple-ui apple-mesh">

<div class="wrap apple-rise">
    <!-- ═══ COMPLETE 30-ITEM MEDICAL SUMMARY TABLE (FROM PHOTO 1 & 2) ═══ -->
    <div class="summary-wrapper">
        <div class="summary-title-strip" id="medSummaryFoldHeader" onclick="toggleMedicalSummaryFold()" style="cursor:pointer; user-select:none;">
            <span style="display:flex; align-items:center; gap:8px;"><i class="ti ti-chevron-down" id="medSummaryChevron" style="transition:transform 0.3s; transform:rotate(0deg);"></i> Medical summary</span>
            <span style="color:var(--tm);font-size:12px;font-weight:500; display:flex; align-items:center; gap:8px;"><span id="medSummaryCount">30 Clinical Records Available</span> <i class="ti ti-fold" style="font-size:14px;" title="Click to unfold"></i></span>
        </div>
        <div id="medSummaryFoldBody" style="max-height:2000px; opacity:1; overflow:hidden; transition: max-height 0.5s cubic-bezier(0.32,0.72,0,1), opacity 0.4s;">
        <div id="medSummaryLock" style="display:none; text-align:center; padding:48px 20px; color:var(--tm); font-size:13px;">
            <div style="width:64px;height:64px;margin:0 auto 14px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:30px;background:rgba(0,113,227,0.08);box-shadow:inset 0 1px 0 rgba(255,255,255,0.6);">🔒</div>
            <div style="font-weight:800;font-size:15px;color:var(--tp);letter-spacing:-0.01em;">No patient selected</div>
            <span style="font-size:11.5px;line-height:1.6;">Choose the patient in the identification bar above (Find / search) —<br>the 30 Medical Summary forms open only for that patient.</span>
        </div>
        <table class="oc-table" id="medSummaryFormsTable">
            <tbody id="summaryTableBody"></tbody>
        </table>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="pclinic-catalog.js"></script>
<script src="pclinic-orders.js"></script>
<script src="pclinic-file.js?v=20260827_FILES"></script>
<script src="pclinic-vitals.js"></script>
<script src="pclinic-handoff.js"></script>
<script>
(function() {
    'use strict';

    let currentPatient = null;

    // EXACT 30 MEDICAL SUMMARY FORMS FROM PHOTO 1 & 2
    // ═══ THE 30 MEDICAL SUMMARY FORMS — every one linked to a real page.
    // 'type' = the Common Server record type (pclinic_files) used to show
    // the last recorded date for THIS patient. All pages pull the patient
    // from the Common Server and save their records back to it. ═══
    const SUMMARY_ITEMS = [
        { title: 'Clinical Progress',                     target: 'clinical-note.html',        type: 'clinical' },
        { title: 'Daily note',                            target: 'clinical-note.html',        type: 'clinical' },
        { title: 'Death certificate in ICD-11',           target: 'medical-certificate.html',  type: null },
        { title: 'Discharge malnutrition ward',           target: 'discharge-summary.html',    type: null },
        { title: 'ECG',                                   target: 'ecg-form.html',             type: 'ecg' },
        { title: 'Follow-up malnutrition',                target: 'malnutrition-followup.html', type: 'malnut' },
        { title: 'Follow-up of the psychiatric patient',  target: 'psychiatric-care.html',     type: 'psych' },
        { title: 'Fysiotherapy order',                    target: 'physio-request.html',       type: 'physio' },
        { title: 'Inpatient admission form (NDH model)',  target: 'admission-form.html',       type: 'admission' },
        { title: 'Inpatient discharge form (RMH model)',  target: 'discharge-summary.html',    type: null },
        { title: 'Inpatient follow-up form (HPRC model)', target: 'ward-round.html',           type: 'ward' },
        { title: 'Intensive care surveillance',           target: 'icu-surveillance.html',     type: 'icu' },
        { title: 'MSAS - Register Injection',             target: 'injection-registry.html',   type: 'injection' },
        { title: 'MSAS - Register pansement',             target: 'pansement-registry.html',   type: 'pansement' },
        { title: 'MSHP - Blood transfusion receiver registry', target: 'transfusion-registry.html', type: 'transfusion' },
        { title: 'MSPLS - HC - Deaths registry',          target: 'deaths-registry.html',      type: 'death' },
        { title: 'Outpatient consultation (RMH)',         target: 'opd-file.html',             type: 'opd' },
        { title: 'Patient transfer',                      target: 'transfer-form.html',        type: null },
        { title: 'Pediatric triage (CPTAS)',              target: 'triage-form.html',          type: 'triage' },
        { title: 'Physiotherapy evaluation form',         target: 'physio-request.html',       type: 'physio' },
        { title: 'Pre-anaesthesia record (KIRA model)',   target: 'surgical-note.html',        type: 'surgical' },
        { title: 'Progress Note',                         target: 'clinical-note.html',        type: 'clinical' },
        { title: 'Psychiatric care',                      target: 'psychiatric-care.html',     type: 'psych' },
        { title: 'Referral letter',                       target: 'referral.html',             type: null },
        { title: 'Stomatology surgery protocol',          target: 'surgical-note.html',        type: 'surgical' },
        { title: 'Surgery protocol',                      target: 'surgical-note.html',        type: 'surgical' },
        { title: 'Surveillance during anaestesia',        target: 'surgical-note.html',        type: 'surgical' },
        { title: 'Surveillance protocol',                 target: 'nursing-note.html',         type: 'nursing' },
        { title: 'Vital signs',                           target: 'vitals-action',             type: null },
        { title: 'Warning',                               target: 'messages.html',             type: null }
    ];

    function init() {
        loadDarkMode();
        loadPatient();
        renderSummaryTable();
    }

    function loadDarkMode() {
        const isDark = localStorage.getItem('pclinic-theme') === 'dark';
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        document.body.classList.toggle('dark-mode', isDark);
    }

    function loadPatient() {
        try {
            const urlParams = new URLSearchParams(window.location.search);
            const pid = urlParams.get('patient') || localStorage.getItem('pclinic_active_patient');
            if (pid) {
                const pts = JSON.parse(localStorage.getItem('pclinic_patients') || '[]');
                const found = pts.find(p => String(p.id) === String(pid) || String(p.mrn) === String(pid));
                if (found) {
                    currentPatient = found;
                    return;
                }
            }
        } catch(e) {}

        try {
            if (window.parent && window.parent.currentPatient && window.parent.currentPatient.id) {
                currentPatient = window.parent.currentPatient;
                return;
            }
        } catch(e) {}

        // ⛔ NO TEMPLATE DATA: no patient → the forms stay locked
        currentPatient = null;
    }

    /* ── 🔒 PATIENT GATE: the 30 Medical Summary forms open ONLY for the
          patient sitting in the identification bar ── */
    function applyPatientGate() {
        const p = currentPatient;
        const table = document.getElementById('medSummaryFormsTable');
        const lock  = document.getElementById('medSummaryLock');
        const count = document.getElementById('medSummaryCount');

        if (p && p.id) {
            if (table) table.style.display = '';
            if (lock)  lock.style.display = 'none';
            if (count) count.textContent = '30 Clinical Records Available';
        } else {
            if (table) table.style.display = 'none';
            if (lock)  lock.style.display = 'block';
            if (count) count.textContent = '🔒 No patient selected';
        }
    }

    function renderSummaryTable() {
        const tbody = document.getElementById('summaryTableBody');
        tbody.innerHTML = SUMMARY_ITEMS.map((item, idx) => {
            // 📅 PULL FROM COMMON SERVER: the latest record of this type for
            // the selected patient (pclinic_files — the shared document store)
            let dateBadge = '';
            if (currentPatient && currentPatient.id && item.type) {
                try {
                    const docs = (window.pcFile && typeof pcFile.list === 'function')
                        ? pcFile.list(currentPatient.id, item.type)
                        : (function(){ try { return JSON.parse(localStorage.getItem('pclinic_files') || '[]'); } catch(e){ return []; } })()
                              .filter(d => String(d.patientId) === String(currentPatient.id) && d.type === item.type);
                    if (docs && docs.length) {
                        const last = docs.reduce((a, b) => (new Date(a.at || a.timestamp || 0) > new Date(b.at || b.timestamp || 0) ? a : b));
                        const d = last.at || last.timestamp;
                        if (d) dateBadge = `<span class="rec-date">Last: ${new Date(d).toLocaleDateString('en-GB')}</span>`;
                    }
                } catch(e) {}
            }
            return `
            <tr>
                <td>
                    <span class="form-bullet">▸</span>
                    <span class="form-name">${escapeHtml(item.title)}</span>
                </td>
                <td style="text-align:right;width:200px;">
                    <a class="new-link" onclick="launchForm('${item.target}', '${escapeHtml(item.title)}')">New</a>
                    ${dateBadge}
                </td>
            </tr>`;
        }).join('');
        applyPatientGate();
    }

    // ─── TAPTIC FEEDBACK (iOS-style haptics on supported devices) ───
    document.addEventListener('click', function(e) {
        try {
            if (navigator.vibrate && (e.target.closest('.new-link') || e.target.closest('.summary-title-strip'))) {
                navigator.vibrate(10);
            }
        } catch(err) {}
    });

    window.launchForm = function(target, title) {
        if (!currentPatient || !currentPatient.id) {
            showToast('🔒 Select a patient first — the identification bar must show the patient before opening a form.', 'warning');
            return;
        }
        const p = currentPatient;
        try { localStorage.setItem('pclinic_active_patient', String(p.id)); } catch(e){}

        if (target === 'vitals-action') {
            if (window.pcVitals) pcVitals.open();
            else showToast('📊 Recording Vital Signs for ' + p.firstName, 'info');
            return;
        }

        showToast(`📄 Opening ${title} for patient #${p.id}`, 'info');
        setTimeout(() => {
            window.location.href = `${target}?patient=${encodeURIComponent(p.id)}`;
        }, 200);
    };

    window.closeMedicalSummary = function() {
        try {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'CLOSE_MODAL' }, window.location.origin);
                return;
            }
        } catch(e) {}
        window.location.href = 'doctor-dashboard.html';
    };

    function escapeHtml(str) {
        return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function showToast(msg, type = 'info') {
        const c = document.getElementById('toastContainer');
        const t = document.createElement('div');
        t.className = 'toast';
        t.style.background = type === 'success' ? '#059669' : type === 'error' ? '#ef4444' : '#1a1a2e';
        t.textContent = msg;
        c.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    window.addEventListener('DOMContentLoaded', function () {
        requireAuth(['doctor','nurse']).then(init).catch(function () {});
    });
    window.addEventListener('pcPatientChanged', function(e) {
        if (e.detail && e.detail.id) {
            // Patient picked from the identification bar / another dashboard
            currentPatient = e.detail;
        } else {
            // ⛔ Explicit CLEAR → lock the forms (do NOT re-read the URL patient)
            currentPatient = null;
        }
        renderSummaryTable();
    });
    window.addEventListener('storage', function() {
        loadPatient();
        renderSummaryTable();
    });
    window.addEventListener('patientsUpdated', function() {
        loadPatient();
        renderSummaryTable();
    });
    window.closeMedicalSummary = closeMedicalSummary;
})();

    function toggleMedicalSummaryFold(){
      var body=document.getElementById('medSummaryFoldBody');
      var chev=document.getElementById('medSummaryChevron');
      var count=document.getElementById('medSummaryCount');
      if(!body) return;
      var style=window.getComputedStyle(body);
      var isOpen = body.style.maxHeight!=='0px' && body.style.opacity!=='0' && style.maxHeight!=='0px';
      if(isOpen && body.style.maxHeight!=='0px'){
        // Actually check if open
        if(body.dataset.open==='false'){
          body.style.maxHeight='2000px'; body.style.opacity='1'; body.dataset.open='true';
          if(chev) chev.style.transform='rotate(0deg)';
          if(count) count.textContent='30 Clinical Records Available — all medical summary of the patient';
        } else {
          body.style.maxHeight='0px'; body.style.opacity='0'; body.dataset.open='false';
          if(chev) chev.style.transform='rotate(-90deg)';
          if(count) count.textContent='Medical summary folded — click to unfold';
        }
      } else {
        // toggle based on dataset
        var isCurrentlyOpen = body.dataset.open!=='false';
        if(isCurrentlyOpen){
          body.style.maxHeight='0px'; body.style.opacity='0'; body.dataset.open='false';
          if(chev) chev.style.transform='rotate(-90deg)';
          if(count) count.textContent='Medical summary folded — click to unfold';
        } else {
          body.style.maxHeight='2000px'; body.style.opacity='1'; body.dataset.open='true';
          if(chev) chev.style.transform='rotate(0deg)';
          if(count) count.textContent='30 Clinical Records Available — all medical summary of the patient';
        }
      }
    }
    window.toggleMedicalSummaryFold=toggleMedicalSummaryFold;
    
    document.addEventListener('DOMContentLoaded', function(){
      var body=document.getElementById('medSummaryFoldBody');
      if(body){ body.dataset.open='true'; body.style.maxHeight='2000px'; body.style.opacity='1'; }
    });
</script>


</body>
</html>
