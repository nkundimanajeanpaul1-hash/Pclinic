<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PClinic — Imaging Workstation</title>
  <link rel="stylesheet" href="pclinic-ui.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css">
  <script type="module" src="firebase-config.js"></script>
  <script src="auth-guard.js"></script>
  <script src="pclinic-state.js"></script>
  <script src="patient-data.js" defer></script>
  <script src="pclinic-radiology.js?v=20260828_MEDIA" defer></script>
    <script src="pclinic-radiology-media.js?v=20260902_MEDIAURL2" defer></script>
  <!-- ═══ DICOM VIEWER (shared with radiology entry page) ═══ -->
  <link rel="stylesheet" href="pclinic-file.css">
  <link rel="stylesheet" href="pclinic-dicom-viewer.css?v=20260902_WORKSTATION">
  <script src="pclinic-dicom-viewer.js?v=20260902_WORKSTATION" defer></script>
  <script src="pclinic-file.js?v=20260902_WORKSTATION" defer></script>
  <script src="shared.js" defer></script>
  <style>
    :root{--bg:#1e1f22;--card:#2b2d31;--text:#e6e6e8;--muted:#9a9ca3;--line:#3d3f46;--blue:#4a9eff;--red:#ff6b6b}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    /* the shared PClinic header (menu + patient identification bar) keeps its own light theme */
    #pcMasterHeader{position:relative;z-index:20}
    button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:9px;background:#343640;color:var(--text);padding:7px 11px;font-weight:700}
    button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
    button.danger{background:#5a2a2a;border-color:#7a3a3a;color:#ffb4b4}
    #workstation{min-height:520px;--dv-reserve:38px}
    /* report drawer (final reports, print, acknowledge) under the workstation */
    #reportsDrawer{border-top:1px solid var(--line);background:#17181b}
    #reportsDrawer > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 16px;font-size:12.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#cfd0d4}
    #reportsDrawer > summary::-webkit-details-marker{display:none}
    #reportsDrawer > summary .cnt{min-width:20px;height:20px;border-radius:10px;background:var(--blue);color:#fff;font-size:11px;display:inline-grid;place-items:center;padding:0 6px}
    #reportsDrawer > summary .hint{margin-left:auto;color:var(--muted);font-weight:600;text-transform:none;letter-spacing:0}
    main{max-width:1100px;margin:0 auto;padding:14px 18px 40px}
    .patient{background:#26313f;border:1px solid #33506e;border-radius:12px;padding:11px 14px;margin-bottom:12px}.patient strong{font-size:15px}.patient div{font-size:12px;color:#9fc3ea;margin-top:2px}
    .notice{font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:12px}
    .empty{padding:20px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px;font-size:13px}
    .report{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
    .rh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}.rh h2{margin:0;font-size:15px}.rh .meta{font-size:11.5px;color:var(--muted);margin-top:3px}
    .status{font-size:10.5px;font-weight:800;letter-spacing:.05em;padding:3px 8px;border-radius:7px;background:#1f5a36;color:#a9f0c3;white-space:nowrap}.status.critical{background:#5a2a2a;color:#ffb4b4}
    .body{padding:12px 14px}.section{margin-bottom:10px}.section h3{margin:0 0 3px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.section pre{margin:0;white-space:pre-wrap;font:inherit;font-size:13px;line-height:1.5}
    .addendum{background:#5a4a1f22;border:1px solid #5a4a1f;border-radius:9px;padding:8px 10px;font-size:12.5px;margin:8px 0}
    .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
    .toast-container{position:fixed;right:14px;bottom:14px;z-index:9999;display:flex;flex-direction:column;gap:8px}
  </style>
</head>
<body>
<!-- The shared PClinic header (top menu + PATIENT IDENTIFICATION BAR) is injected here by pclinic-file.js.
     The patient identified in the bar IS the patient in the workstation, and vice-versa (one truth). -->
<div id="pcMasterHeader"></div>

<!-- Weasis-style DICOM workstation, mounted by pclinic-dicom-viewer.js (PcDicomViewer.mount) -->
<div id="workstation" aria-label="DICOM workstation"></div>

<!-- Final radiology reports (print / acknowledge critical) — the same list as before, in a drawer -->
<details id="reportsDrawer">
  <summary><i class="ti ti-report-medical"></i> Radiology reports <span class="cnt" id="reportCount">0</span><span class="hint">final server-signed reports and addenda · click to open</span></summary>
  <main>
    <div id="patientBanner" class="patient" hidden></div>
    <div id="imageNotice" class="notice" hidden><i class="ti ti-photo-scan"></i> Images are shown in the workstation above. Reports here are the verified, server-signed record.</div>
    <div id="reportList"><div class="empty">Select a patient to view final radiology reports.</div></div>
  </main>
</details>
<button id="closeBtn" hidden aria-hidden="true"></button>
<div class="toast-container" id="toastContainer"></div>
<script>
(function(){
  'use strict';
  let staff=null, patient=null, requestedPatientId='', snapshot={reports:[],addenda:[],alerts:[]}, unsubscribe=null, initError='';
  function notify(message,type){const fn=window.sharedShowToast||window.showToast;if(fn)fn(String(message||''),type||'info',5000);}
  function millis(v){if(!v)return 0;if(typeof v.toMillis==='function')return v.toMillis();if(v.seconds)return v.seconds*1000;return new Date(v).getTime()||0;}
  function when(v){return millis(v)?new Date(millis(v)).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';}
  function patientName(p){return p&&(p.name||((p.firstName||'')+' '+(p.lastName||'')).trim())||'Patient';}
  function findPatient(id){let list=[];try{list=window.getPatients?window.getPatients():[];}catch(e){}return list.find(p=>String(p.id)===String(id)||String(p.mrn)===String(id))||null;}
  function setPatient(p){patient=p||null;syncWorkstationPatient(patient);const banner=document.getElementById('patientBanner');banner.replaceChildren();if(!patient){banner.hidden=true;render();return;}banner.hidden=false;const strong=document.createElement('strong');strong.textContent=patientName(patient);const meta=document.createElement('div');meta.textContent='MRN '+String(patient.mrn||patient.id||'')+' · '+String(patient.gender||'')+' · '+String(patient.dob||'');banner.appendChild(strong);banner.appendChild(meta);render();}
  function patientKeys(p){const out=new Set();if(!p)return out;['id','mrn','patientId'].forEach(k=>{if(p[k]!=null&&String(p[k]).trim())out.add(String(p[k]).trim());});const n=String(p.mrn==null?'':p.mrn).replace(/\D/g,'');if(n)out.add(n);out.add(String(p.id==null?'':p.id).replace(/\D/g,''));out.delete('');return out;}
  function reportKeys(r){const out=new Set();if(!r)return out;['patientId','patientMrn','mrn'].forEach(k=>{if(r[k]!=null&&String(r[k]).trim())out.add(String(r[k]).trim());});const n=String(r.patientMrn==null?'':r.patientMrn).replace(/\D/g,'');if(n)out.add(n);out.add(String(r.patientId==null?'':r.patientId).replace(/\D/g,''));out.delete('');return out;}
  // The old filter required exactly String(r.patientId)===String(patient.id||patient.mrn),
  // which silently dropped reports whenever an order was raised against the MRN while the
  // patient object carried a different internal id (or vice versa).
  function belongsToPatient(r,p){const a=patientKeys(p),b=reportKeys(r);for(const k of b){if(a.has(k))return true;}return false;}
  function reportsFor(p,snap){return ((snap&&snap.reports)||[]).filter(r=>r&&r.status==='final'&&belongsToPatient(r,p));}
  function draftCountFor(p,snap){return ((snap&&snap.reports)||[]).filter(r=>r&&r.status!=='final'&&belongsToPatient(r,p)).length;}
  function errorText(e){if(!e)return '';if(typeof e==='string')return e;const c=e.code||e.status||'';const m=e.message||e.msg||'';if(c&&m)return String(c)+': '+String(m);return String(m||c||e);}
  function field(title,value){const wrap=document.createElement('div');wrap.className='section';const h=document.createElement('h3');h.textContent=title;const pre=document.createElement('pre');pre.textContent=String(value||'—');wrap.appendChild(h);wrap.appendChild(pre);return wrap;}
  function printReport(report){const popup=window.open('','_blank','width=820,height=950');if(!popup){notify('Allow pop-ups to print the report.','warning');return;}function esc(v){const d=document.createElement('div');d.textContent=String(v==null?'':v);return d.innerHTML;}const addenda=(snapshot.addenda||[]).filter(a=>String(a.reportId)===String(report.id));popup.document.write('<!DOCTYPE html><html><head><title>Radiology Report</title><style>body{font-family:Arial,sans-serif;padding:32px;line-height:1.45}h1{font-size:20px;border-bottom:2px solid #111;padding-bottom:10px}h2{font-size:13px;text-transform:uppercase;margin-top:20px}pre{white-space:pre-wrap;font:13px Arial;border:1px solid #ddd;padding:10px;border-radius:8px}.meta{font-size:12px}.add{border-top:1px solid #888;margin-top:22px;padding-top:12px}</style></head><body><h1>PClinic — Final Radiology Report</h1><div class="meta"><b>Patient:</b> '+esc(report.patientName)+' · <b>MRN:</b> '+esc(report.patientMrn||report.patientId)+'<br><b>Study:</b> '+esc(report.study)+' · <b>Accession:</b> '+esc(report.orderId)+'<br><b>Signed:</b> '+esc(when(report.signedAt))+' by '+esc(report.signedByName)+'</div><h2>Findings</h2><pre>'+esc(report.findings)+'</pre><h2>Impression</h2><pre>'+esc(report.impression)+'</pre><h2>Recommendation</h2><pre>'+esc(report.recommendation||'None')+'</pre>'+addenda.map(a=>'<div class="add"><b>Addendum — '+esc(when(a.signedAt))+'</b><p>'+esc(a.text)+'</p><small>Reason: '+esc(a.reason)+' · '+esc(a.signedByName)+'</small></div>').join('')+'</body></html>');popup.document.close();setTimeout(()=>{popup.focus();popup.print();},250);}
  async function acknowledge(report){try{await window.pcRadiology.acknowledgeCritical(report.id);notify('Critical result acknowledged.','success');}catch(error){notify(error&&error.message||'Acknowledgment failed.','error');}}
  function message(text, action){const box=document.createElement('div');box.className='empty';box.textContent=text;if(action){const br=document.createElement('br');box.appendChild(br);const b=document.createElement('button');b.type='button';b.textContent=action.label;b.style.cssText='margin-top:12px';b.onclick=action.run;box.appendChild(b);}return box;}
  function render(){updateReportCount();const host=document.getElementById('reportList');const notice=document.getElementById('imageNotice');host.replaceChildren();const problem=initError||(snapshot&&snapshot.error);if(problem){if(notice)notice.hidden=true;const txt=errorText(problem);const card=document.createElement('div');card.className='empty';card.textContent='Could not load reports from the common server \u2014 '+txt;const br=document.createElement('br');card.appendChild(br);const retry=document.createElement('button');retry.type='button';retry.textContent='Try again';retry.style.cssText='margin-top:12px';retry.onclick=retryLoad;card.appendChild(retry);host.appendChild(card);console.error('[imaging-results] report load failed:',problem);return;}if(!patient){if(notice)notice.hidden=true;host.appendChild(message('Select a patient to view final radiology reports.'));return;}const reports=reportsFor(patient,snapshot);const drafts=draftCountFor(patient,snapshot);if(notice)notice.hidden=!(reports.length||drafts);if(!reports.length){host.appendChild(message(drafts?('No signed report yet \u2014 '+drafts+' draft'+(drafts===1?'':'s')+' awaiting final signature by Radiology.'):'No radiology reports for this patient (MRN '+String(patient.mrn||patient.id||'')+' checked). Nothing was hidden by a patient-id mismatch.'));return;}reports.forEach(report=>{const card=document.createElement('article');card.className='report';const head=document.createElement('div');head.className='rh';const title=document.createElement('div');const h=document.createElement('h2');h.textContent=report.study||'Radiology study';const meta=document.createElement('div');meta.className='meta';meta.textContent='Accession '+String(report.orderId||'')+' · '+when(report.signedAt)+' · '+String(report.signedByName||'Radiologist');title.appendChild(h);title.appendChild(meta);const badge=document.createElement('span');badge.className='status'+(report.critical?' critical':'');badge.textContent=report.critical?'CRITICAL FINAL':'FINAL';head.appendChild(title);head.appendChild(badge);const body=document.createElement('div');body.className='body';body.appendChild(field('Clinical indication',report.indication));body.appendChild(field('Comparison',report.comparison));body.appendChild(field('Findings',report.findings));body.appendChild(field('Impression',report.impression));body.appendChild(field('Recommendation',report.recommendation));const addenda=(snapshot.addenda||[]).filter(a=>String(a.reportId)===String(report.id));addenda.forEach(item=>{const block=document.createElement('div');block.className='addendum';block.textContent='Addendum '+when(item.signedAt)+': '+String(item.text||'')+' — '+String(item.signedByName||'');body.appendChild(block);});const mediaHost=document.createElement('div');mediaHost.style.cssText='margin:2px 0 12px';body.appendChild(mediaHost);if(window.pcRadioMedia&&report.orderId){try{pcRadioMedia.mount(mediaHost,{id:report.orderId,study:report.study},{canManage:false});}catch(e){}}const actions=document.createElement('div');actions.className='actions';const view=document.createElement('button');view.type='button';view.className='primary';view.textContent='Show images in workstation';view.onclick=()=>{if(window.PcDicomViewer&&window.PcDicomViewer.isOpen()){window.PcDicomViewer.selectStudy(report.orderId);window.scrollTo({top:0,behavior:'smooth'});}else notify('The workstation did not load.','warning');};actions.appendChild(view);const print=document.createElement('button');print.type='button';print.className='primary';print.textContent='Print / PDF';print.onclick=()=>printReport(report);actions.appendChild(print);const alert=(snapshot.alerts||[]).find(a=>String(a.reportId)===String(report.id));if(report.critical&&alert&&!alert.acknowledged&&staff&&(staff.role==='admin'||String(report.orderedById||'')===String(staff.staffId||''))){const ack=document.createElement('button');ack.type='button';ack.className='danger';ack.textContent='Acknowledge critical result';ack.onclick=()=>acknowledge(report);actions.appendChild(ack);}if(alert&&alert.acknowledged){const done=document.createElement('span');done.style.cssText='font-size:11px;color:#176b35;font-weight:800;padding:8px';done.textContent='Critical result acknowledged by '+String(alert.acknowledgedByName||'clinician')+' on '+when(alert.acknowledgedAt);actions.appendChild(done);}body.appendChild(actions);card.appendChild(head);card.appendChild(body);host.appendChild(card);});}
  function updateReportCount(){const c=document.getElementById('reportCount');if(!c)return;const n=patient?reportsFor(patient,snapshot).length:0;c.textContent=String(n);}
  const closeBtnEl=document.getElementById('closeBtn');if(closeBtnEl)closeBtnEl.onclick=function(){if(window.parent&&window.parent!==window){window.parent.postMessage({type:'CLOSE_IMAGING_RESULTS'},window.location.origin);}else history.back();};
  window.addEventListener('message',function(event){if(event.origin!==window.location.origin)return;if(window.parent!==window&&event.source!==window.parent)return;if(event.data&&event.data.type==='LOAD_PATIENT'&&event.data.patient)setPatient(event.data.patient);});
  async function retryLoad(){initError='';render();try{await window.pcRadiology.init({staff:staff});}catch(error){initError=errorText(error);}render();}
  /* ── workstation glue ─────────────────────────────────────────
     One patient truth: identification bar ⇄ workstation ⇄ report list. */
  let wsMounted=false, applyingPatient=false;
  function mountWorkstation(){if(wsMounted)return;const host=document.getElementById('workstation');if(!host||!window.PcDicomViewer||typeof window.PcDicomViewer.mount!=='function')return;try{window.PcDicomViewer.mount(host,{canManage:staff&&(staff.role==='radio'||staff.role==='admin'),patient:patient,orderId:new URLSearchParams(location.search).get('order')||'',onPrintReport:printReport,onPatientChange:function(p){if(applyingPatient)return;applyingPatient=true;try{setPatient(p);}finally{applyingPatient=false;}}});wsMounted=true;}catch(e){console.warn('[imaging-results] workstation mount failed:',e);}}
  function writeIdentificationBar(p){try{if(window.pcFile&&typeof window.pcFile.renderDemoBar==='function'){const master=document.getElementById('pcMasterHeader')||document.body;window.pcFile.renderDemoBar(master,p||{_cleared:true,id:'',mrn:'',lastName:'',firstName:'',nationalId:'',department:'',dob:'',gender:'',archiveCode:''});}}catch(e){}}
  function syncWorkstationPatient(p){writeIdentificationBar(p);if(!wsMounted||!window.PcDicomViewer)return;try{window.PcDicomViewer.setPatient(p);}catch(e){}try{if(p&&p.id)localStorage.setItem('pclinic_active_patient',String(p.id));else localStorage.removeItem('pclinic_active_patient');}catch(e){}if(!applyingPatient){applyingPatient=true;try{window.dispatchEvent(new CustomEvent('pcPatientChanged',{detail:p}));}finally{applyingPatient=false;}}}
  window.addEventListener('pcPatientChanged',function(e){if(applyingPatient)return;const d=e&&e.detail;applyingPatient=true;try{if(d&&d.id){if(!patient||String(patient.id)!==String(d.id))setPatient(findPatient(d.id)||d);}else if(patient){setPatient(null);}}finally{applyingPatient=false;}});
  document.addEventListener('DOMContentLoaded',function(){window.requireAuth(['doctor','radio','nurse','admin']).then(async function(s){staff=s;requestedPatientId=new URLSearchParams(location.search).get('patient')||sessionStorage.getItem('pclinic_active_patient')||localStorage.getItem('pclinic_active_patient')||'';mountWorkstation();
    // Subscribe first: pcRadiology.subscribe() replays the current state immediately, and
    // pclinic-radiology.js keeps one shared init promise, so attaching before init() means a
    // failed start reaches the screen instead of dying in a .catch(function(){}) that showed
    // "no reports" for what was really a permissions or connection failure.
    if(unsubscribe)unsubscribe();
    unsubscribe=window.pcRadiology.subscribe(function(next){snapshot=next;render();if(wsMounted&&window.PcDicomViewer&&window.PcDicomViewer.refreshStudies){try{window.PcDicomViewer.refreshStudies();}catch(e){}}});
    try{await window.pcRadiology.init({staff:s});}catch(error){initError=errorText(error);}
    render();
    if(!patient&&requestedPatientId){const resolved=findPatient(requestedPatientId);if(resolved)setPatient(resolved);}
  }).catch(function(error){initError='Sign-in could not be verified \u2014 '+errorText(error);render();});});
  window.pcImagingResults={mountWorkstation:mountWorkstation,reportsFor:reportsFor,belongsToPatient:belongsToPatient,errorText:errorText,render:render,setSnapshot:function(next){snapshot=next||{reports:[],addenda:[],alerts:[]};render();},setPatientForTest:setPatient,retryLoad:retryLoad};
  window.addEventListener('patientsUpdated',function(){if(!patient&&requestedPatientId){const resolved=findPatient(requestedPatientId);if(resolved)setPatient(resolved);}});
  window.addEventListener('beforeunload',function(){if(unsubscribe)unsubscribe();});
})();
</script>
</body>
</html>
