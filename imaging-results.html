<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PClinic — Radiology Reports</title>
  <link rel="stylesheet" href="pclinic-ui.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css">
  <script type="module" src="firebase-config.js"></script>
  <script src="auth-guard.js"></script>
  <script src="pclinic-state.js"></script>
  <script src="patient-data.js" defer></script>
  <script src="pclinic-radiology.js?v=20260828_MEDIA" defer></script>
    <script src="pclinic-radiology-media.js?v=20260828_MEDIA" defer></script>
  <!-- ═══ DICOM VIEWER (shared with radiology entry page) ═══ -->
  <link rel="stylesheet" href="pclinic-dicom-viewer.css?v=20260901_DICOM">
  <script src="pclinic-dicom-viewer.js?v=20260902_VIEWERBTN" defer></script>
  <script src="shared.js" defer></script>
  <style>
    :root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#d2d2d7;--blue:#0071e3;--red:#b42318}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:13px 18px;display:flex;align-items:center;gap:12px}
    header h1{font-size:16px;margin:0;flex:1}.sub{font-size:11px;color:var(--muted)}button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:9px;background:#fff;padding:7px 11px;font-weight:700}
    main{max-width:980px;margin:0 auto;padding:18px}.patient{background:#eaf2ff;border:1px solid #b8d7fb;border-radius:14px;padding:13px 15px;margin-bottom:14px}.patient strong{font-size:15px}.patient div{font-size:12px;color:#31557b;margin-top:3px}
    .notice[hidden]{display:none}.notice{background:#fff7e6;border:1px solid #f0ad4e;color:#8a5a00;border-radius:12px;padding:11px 13px;font-size:12px;font-weight:700;margin-bottom:14px}.empty{padding:48px 20px;text-align:center;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:16px}
    .report{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.04)}.rh{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}.rh h2{font-size:15px;margin:0}.meta{font-size:11px;color:var(--muted);margin-top:4px}.status{margin-left:auto;padding:3px 9px;border-radius:20px;background:#e9f9ee;color:#176b35;font-size:10px;font-weight:800}.critical{background:#fee4e2;color:var(--red)}.body{padding:15px 16px}.section{margin-bottom:14px}.section h3{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 5px}.section pre{white-space:pre-wrap;font:13px/1.5 inherit;margin:0;background:#f8f8fa;border-radius:10px;padding:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.danger{background:#fff0ef;color:var(--red);border-color:#f1b5b0}.addendum{margin-top:9px;border-left:3px solid #af52de;padding:8px 10px;background:#faf4ff;border-radius:5px;font-size:12px}.toast-container{position:fixed;right:18px;bottom:18px;z-index:100}
  </style>
</head>
<body>
<header>
  <div><h1><i class="ti ti-report-medical"></i> Radiology reports</h1><div class="sub">Final server-signed reports and addenda</div></div>
  <button type="button" id="closeBtn"><i class="ti ti-x"></i> Close</button>
</header>
<main>
  <div id="patientBanner" class="patient" hidden></div>
  <div id="imageNotice" class="notice" hidden><i class="ti ti-server-off"></i> Image display requires an approved PACS/DICOMweb connection. This page shows verified reports only and never substitutes demo images.</div>
  <div id="reportList"><div class="empty">Select a patient to view final radiology reports.</div></div>
</main>
<div class="toast-container" id="toastContainer"></div>
<script>
(function(){
  'use strict';
  let staff=null, patient=null, requestedPatientId='', snapshot={reports:[],addenda:[],alerts:[]}, unsubscribe=null, initError='';
  function notify(message,type){const fn=window.sharedShowToast||window.showToast;if(fn)fn(String(message||''),type||'info',5000);}
  function millis(v){if(!v)return 0;if(typeof v.toMillis==='function')return v.toMillis();if(v.seconds)return v.seconds*1000;return new Date(v).getTime()||0;}
  function when(v){return millis(v)?new Date(millis(v)).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';}
  function patientName(p){return p&&(p.name||((p.firstName||'')+' '+(p.lastName||'')).trim())||'Patient';}
  function findPatient(id){let list=[];try{list=window.getPatients?window.getPatients():[];}catch(e){}return list.find(p=>String(p.id)===String(id)||String(p.mrn)===String(id))||null;}
  function setPatient(p){patient=p||null;const banner=document.getElementById('patientBanner');banner.replaceChildren();if(!patient){banner.hidden=true;render();return;}banner.hidden=false;const strong=document.createElement('strong');strong.textContent=patientName(patient);const meta=document.createElement('div');meta.textContent='MRN '+String(patient.mrn||patient.id||'')+' · '+String(patient.gender||'')+' · '+String(patient.dob||'');banner.appendChild(strong);banner.appendChild(meta);render();}
  function patientKeys(p){const out=new Set();if(!p)return out;['id','mrn','patientId'].forEach(k=>{if(p[k]!=null&&String(p[k]).trim())out.add(String(p[k]).trim());});const n=String(p.mrn==null?'':p.mrn).replace(/\D/g,'');if(n)out.add(n);out.add(String(p.id==null?'':p.id).replace(/\D/g,''));out.delete('');return out;}
  function reportKeys(r){const out=new Set();if(!r)return out;['patientId','patientMrn','mrn'].forEach(k=>{if(r[k]!=null&&String(r[k]).trim())out.add(String(r[k]).trim());});const n=String(r.patientMrn==null?'':r.patientMrn).replace(/\D/g,'');if(n)out.add(n);out.add(String(r.patientId==null?'':r.patientId).replace(/\D/g,''));out.delete('');return out;}
  // The old filter required exactly String(r.patientId)===String(patient.id||patient.mrn),
  // which silently dropped reports whenever an order was raised against the MRN while the
  // patient object carried a different internal id (or vice versa).
  function belongsToPatient(r,p){const a=patientKeys(p),b=reportKeys(r);for(const k of b){if(a.has(k))return true;}return false;}
  function reportsFor(p,snap){return ((snap&&snap.reports)||[]).filter(r=>r&&r.status==='final'&&belongsToPatient(r,p));}
  function draftCountFor(p,snap){return ((snap&&snap.reports)||[]).filter(r=>r&&r.status!=='final'&&belongsToPatient(r,p)).length;}
  function errorText(e){if(!e)return '';if(typeof e==='string')return e;const c=e.code||e.status||'';const m=e.message||e.msg||'';if(c&&m)return String(c)+': '+String(m);return String(m||c||e);}
  function field(title,value){const wrap=document.createElement('div');wrap.className='section';const h=document.createElement('h3');h.textContent=title;const pre=document.createElement('pre');pre.textContent=String(value||'—');wrap.appendChild(h);wrap.appendChild(pre);return wrap;}
  function printReport(report){const popup=window.open('','_blank','width=820,height=950');if(!popup){notify('Allow pop-ups to print the report.','warning');return;}function esc(v){const d=document.createElement('div');d.textContent=String(v==null?'':v);return d.innerHTML;}const addenda=(snapshot.addenda||[]).filter(a=>String(a.reportId)===String(report.id));popup.document.write('<!DOCTYPE html><html><head><title>Radiology Report</title><style>body{font-family:Arial,sans-serif;padding:32px;line-height:1.45}h1{font-size:20px;border-bottom:2px solid #111;padding-bottom:10px}h2{font-size:13px;text-transform:uppercase;margin-top:20px}pre{white-space:pre-wrap;font:13px Arial;border:1px solid #ddd;padding:10px;border-radius:8px}.meta{font-size:12px}.add{border-top:1px solid #888;margin-top:22px;padding-top:12px}</style></head><body><h1>PClinic — Final Radiology Report</h1><div class="meta"><b>Patient:</b> '+esc(report.patientName)+' · <b>MRN:</b> '+esc(report.patientMrn||report.patientId)+'<br><b>Study:</b> '+esc(report.study)+' · <b>Accession:</b> '+esc(report.orderId)+'<br><b>Signed:</b> '+esc(when(report.signedAt))+' by '+esc(report.signedByName)+'</div><h2>Findings</h2><pre>'+esc(report.findings)+'</pre><h2>Impression</h2><pre>'+esc(report.impression)+'</pre><h2>Recommendation</h2><pre>'+esc(report.recommendation||'None')+'</pre>'+addenda.map(a=>'<div class="add"><b>Addendum — '+esc(when(a.signedAt))+'</b><p>'+esc(a.text)+'</p><small>Reason: '+esc(a.reason)+' · '+esc(a.signedByName)+'</small></div>').join('')+'</body></html>');popup.document.close();setTimeout(()=>{popup.focus();popup.print();},250);}
  async function acknowledge(report){try{await window.pcRadiology.acknowledgeCritical(report.id);notify('Critical result acknowledged.','success');}catch(error){notify(error&&error.message||'Acknowledgment failed.','error');}}
  function message(text, action){const box=document.createElement('div');box.className='empty';box.textContent=text;if(action){const br=document.createElement('br');box.appendChild(br);const b=document.createElement('button');b.type='button';b.textContent=action.label;b.style.cssText='margin-top:12px';b.onclick=action.run;box.appendChild(b);}return box;}
  function render(){const host=document.getElementById('reportList');const notice=document.getElementById('imageNotice');host.replaceChildren();const problem=initError||(snapshot&&snapshot.error);if(problem){if(notice)notice.hidden=true;const txt=errorText(problem);const card=document.createElement('div');card.className='empty';card.textContent='Could not load reports from the common server \u2014 '+txt;const br=document.createElement('br');card.appendChild(br);const retry=document.createElement('button');retry.type='button';retry.textContent='Try again';retry.style.cssText='margin-top:12px';retry.onclick=retryLoad;card.appendChild(retry);host.appendChild(card);console.error('[imaging-results] report load failed:',problem);return;}if(!patient){if(notice)notice.hidden=true;host.appendChild(message('Select a patient to view final radiology reports.'));return;}const reports=reportsFor(patient,snapshot);const drafts=draftCountFor(patient,snapshot);if(notice)notice.hidden=!(reports.length||drafts);if(!reports.length){host.appendChild(message(drafts?('No signed report yet \u2014 '+drafts+' draft'+(drafts===1?'':'s')+' awaiting final signature by Radiology.'):'No radiology reports for this patient (MRN '+String(patient.mrn||patient.id||'')+' checked). Nothing was hidden by a patient-id mismatch.'));return;}reports.forEach(report=>{const card=document.createElement('article');card.className='report';const head=document.createElement('div');head.className='rh';const title=document.createElement('div');const h=document.createElement('h2');h.textContent=report.study||'Radiology study';const meta=document.createElement('div');meta.className='meta';meta.textContent='Accession '+String(report.orderId||'')+' · '+when(report.signedAt)+' · '+String(report.signedByName||'Radiologist');title.appendChild(h);title.appendChild(meta);const badge=document.createElement('span');badge.className='status'+(report.critical?' critical':'');badge.textContent=report.critical?'CRITICAL FINAL':'FINAL';head.appendChild(title);head.appendChild(badge);const body=document.createElement('div');body.className='body';body.appendChild(field('Clinical indication',report.indication));body.appendChild(field('Comparison',report.comparison));body.appendChild(field('Findings',report.findings));body.appendChild(field('Impression',report.impression));body.appendChild(field('Recommendation',report.recommendation));const addenda=(snapshot.addenda||[]).filter(a=>String(a.reportId)===String(report.id));addenda.forEach(item=>{const block=document.createElement('div');block.className='addendum';block.textContent='Addendum '+when(item.signedAt)+': '+String(item.text||'')+' — '+String(item.signedByName||'');body.appendChild(block);});const mediaHost=document.createElement('div');mediaHost.style.cssText='margin:2px 0 12px';body.appendChild(mediaHost);if(window.pcRadioMedia&&report.orderId){try{pcRadioMedia.mount(mediaHost,{id:report.orderId,study:report.study},{canManage:false});}catch(e){}}const actions=document.createElement('div');actions.className='actions';const view=document.createElement('button');view.type='button';view.className='primary';view.textContent='Open DICOM viewer';view.onclick=()=>{if(window.PcDicomViewer)window.PcDicomViewer.open({id:report.orderId,study:report.study,patientName:report.patientName||''},{canManage:false});else notify('The DICOM viewer did not load.','warning');};actions.appendChild(view);const print=document.createElement('button');print.type='button';print.className='primary';print.textContent='Print / PDF';print.onclick=()=>printReport(report);actions.appendChild(print);const alert=(snapshot.alerts||[]).find(a=>String(a.reportId)===String(report.id));if(report.critical&&alert&&!alert.acknowledged&&staff&&(staff.role==='admin'||String(report.orderedById||'')===String(staff.staffId||''))){const ack=document.createElement('button');ack.type='button';ack.className='danger';ack.textContent='Acknowledge critical result';ack.onclick=()=>acknowledge(report);actions.appendChild(ack);}if(alert&&alert.acknowledged){const done=document.createElement('span');done.style.cssText='font-size:11px;color:#176b35;font-weight:800;padding:8px';done.textContent='Critical result acknowledged by '+String(alert.acknowledgedByName||'clinician')+' on '+when(alert.acknowledgedAt);actions.appendChild(done);}body.appendChild(actions);card.appendChild(head);card.appendChild(body);host.appendChild(card);});}
  document.getElementById('closeBtn').onclick=function(){if(window.parent&&window.parent!==window){window.parent.postMessage({type:'CLOSE_IMAGING_RESULTS'},window.location.origin);}else history.back();};
  window.addEventListener('message',function(event){if(event.origin!==window.location.origin)return;if(window.parent!==window&&event.source!==window.parent)return;if(event.data&&event.data.type==='LOAD_PATIENT'&&event.data.patient)setPatient(event.data.patient);});
  async function retryLoad(){initError='';render();try{await window.pcRadiology.init({staff:staff});}catch(error){initError=errorText(error);}render();}
  document.addEventListener('DOMContentLoaded',function(){window.requireAuth(['doctor','radio','nurse']).then(async function(s){staff=s;requestedPatientId=new URLSearchParams(location.search).get('patient')||sessionStorage.getItem('pclinic_active_patient')||'';
    // Subscribe first: pcRadiology.subscribe() replays the current state immediately, and
    // pclinic-radiology.js keeps one shared init promise, so attaching before init() means a
    // failed start reaches the screen instead of dying in a .catch(function(){}) that showed
    // "no reports" for what was really a permissions or connection failure.
    if(unsubscribe)unsubscribe();
    unsubscribe=window.pcRadiology.subscribe(function(next){snapshot=next;render();});
    try{await window.pcRadiology.init({staff:s});}catch(error){initError=errorText(error);}
    render();
    if(!patient&&requestedPatientId){const resolved=findPatient(requestedPatientId);if(resolved)setPatient(resolved);}
  }).catch(function(error){initError='Sign-in could not be verified \u2014 '+errorText(error);render();});});
  window.pcImagingResults={reportsFor:reportsFor,belongsToPatient:belongsToPatient,errorText:errorText,render:render,setSnapshot:function(next){snapshot=next||{reports:[],addenda:[],alerts:[]};render();},setPatientForTest:setPatient,retryLoad:retryLoad};
  window.addEventListener('patientsUpdated',function(){if(!patient&&requestedPatientId){const resolved=findPatient(requestedPatientId);if(resolved)setPatient(resolved);}});
  window.addEventListener('beforeunload',function(){if(unsubscribe)unsubscribe();});
})();
</script>
</body>
</html>
