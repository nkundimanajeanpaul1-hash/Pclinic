<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ═══ FIREBASE + AUTH GUARD ═══ -->
    <script type="module" src="firebase-config.js"></script>
    <script src="auth-guard.js"></script>
<script src="pclinic-state.js"></script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patient Queue • PClinic</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <script src="shared.js" defer></script>
    <script src="patient-data.js" defer></script>
    <link rel="stylesheet" href="pclinic-ui.css?v=20260804_CHUK_3ROW">
<style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #f0f2f5; --s1: #ffffff; --s2: #f8f9fa; --s3: #f1f3f6; --bd: #e4e7ec;
            --tp: #1a1a2e; --ts: #2d2d44; --tm: #6b7280;
            --ac: #7c3aed; --acb: #f5f3ff;
            --green: #10b981; --greenb: #ecfdf5;
            --orange: #f59e0b; --orangeb: #fffbeb;
            --red: #ef4444; --redb: #fef2f2;
            --gradient: linear-gradient(135deg, #7c3aed, #2563eb);
            --shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.04);
            --shadow2: 0 4px 20px rgba(0,0,0,.08), 0 12px 40px rgba(0,0,0,.06);
            --r: 10px; --r2: 14px;
            --f: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        [data-theme="dark"] {
            --bg: #0f1117; --s1: #1a1d27; --s2: #14171f; --s3: #222533; --bd: #2d3040;
            --tp: #f0f2f5; --ts: #d1d5db; --tm: #9ca3af;
            --ac: #a78bfa; --acb: #2a1a3a;
        }
        body { font-family: var(--f); background: var(--bg); color: var(--tp); font-size: 13px; line-height: 1.6; min-height: 100vh; }
        .topbar {
            display: flex; align-items: center; justify-content: space-between; padding: 8px 24px;
            background: rgba(255,255,255,0.85); backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 0.5px solid var(--bd); position: sticky; top: 0; z-index: 100; height: 56px;
        }
        [data-theme="dark"] .topbar { background: rgba(26,29,39,0.85); }
        .tl { display: flex; align-items: center; gap: 10px; }
        .logo-box { width: 32px; height: 32px; border-radius: 8px; background: var(--gradient); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .appname { font-size: 16px; font-weight: 700; color: var(--tp); }
        .appname span { color: var(--ac); }
        .appsub { font-size: 11px; color: var(--tm); margin-left: 2px; }
        .tr { display: flex; align-items: center; gap: 6px; }
        .tb-btn {
            width: 32px; height: 32px; border-radius: 50%; border: 0.5px solid var(--bd);
            background: var(--s1); display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--tm); font-size: 15px; transition: var(--transition);
        }
        .tb-btn:hover { background: var(--s3); color: var(--tp); }
        .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--tm); padding: 10px 24px 6px; }
        .breadcrumb a { color: var(--ac); text-decoration: none; font-weight: 500; }
        .breadcrumb .current { color: var(--ts); font-weight: 500; }
        .greeting { padding: 12px 24px 6px; }
        .greeting h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
        .greeting h1 .highlight { background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; padding: 12px 24px 8px; }
        .stat-card { background: var(--s1); border: 0.5px solid var(--bd); border-radius: var(--r2); padding: 14px 18px; display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow); }
        .stat-card .icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .stat-card .icon.purple { background: var(--acb); color: var(--ac); }
        .stat-card .icon.green { background: var(--greenb); color: var(--green); }
        .stat-card .icon.orange { background: var(--orangeb); color: var(--orange); }
        .stat-card .icon.red { background: var(--redb); color: var(--red); }
        .stat-card .number { font-size: 22px; font-weight: 800; }
        .stat-card .label { font-size: 12px; color: var(--tm); font-weight: 500; }
        .card { margin: 8px 24px 24px; background: var(--s1); border: 0.5px solid var(--bd); border-radius: var(--r2); box-shadow: var(--shadow); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        thead th { text-align: left; font-size: 10.5px; font-weight: 700; color: var(--tm); text-transform: uppercase; letter-spacing: 0.5px; padding: 12px 16px; border-bottom: 1px solid var(--bd); }
        tbody td { padding: 12px 16px; font-size: 12.5px; border-bottom: 1px solid var(--bd); color: var(--ts); }
        tbody tr:hover { background: var(--s2); }
        tbody tr:last-child td { border-bottom: none; }
        .badge { font-size: 10.5px; font-weight: 600; padding: 3px 10px; border-radius: 10px; }
        .badge.green { background: var(--greenb); color: var(--green); }
        .badge.orange { background: var(--orangeb); color: var(--orange); }
        .badge.red { background: var(--redb); color: var(--red); }
        .badge.gray { background: var(--s3); color: var(--tm); }
        .position-num {
            width: 26px; height: 26px; border-radius: 50%; background: var(--acb); color: var(--ac);
            display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px;
        }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--tm); }
        .empty-state i { font-size: 32px; display: block; margin-bottom: 10px; opacity: 0.5; }
        @media (max-width: 900px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 700px) {
            .card, .stats-grid, .greeting, .breadcrumb { padding-left: 16px; padding-right: 16px; margin-left: 0; margin-right: 0; }
        }
    </style>
    <script src="pclinic-file.js?v=20260827_FILES" defer></script>
</head>
<body>

    <div class="topbar" style="display: none !important;">
        <div class="tl">
            <div class="logo-box"><img src="logo.png" alt="PClinic" style="width:100%;height:100%;object-fit:cover;border-radius:8px;" onerror="this.style.display='none'" /></div>
            <span class="appname">P<span>clinic</span></span>
            <span class="appsub">Queue</span>
        </div>
        <div class="tr">
            <button class="tb-btn" onclick="toggleDarkMode()" title="Toggle Dark Mode"><i class="ti ti-moon" id="themeIcon"></i></button>
            <div class="tb-btn" onclick="logout()" title="Logout"><i class="ti ti-logout"></i></div>
        </div>
    </div>

    <div class="breadcrumb" style="display: none !important;">
        <a href="hub.html">🏥 Hub</a>
        <span style="color:var(--bd);">›</span>
        <span class="current">Patient Queue</span>
    </div>

    <div class="greeting">
        <h1>Live Patient <span class="highlight">Queue</span></h1>
        <p style="color:var(--tm); font-size:13px; margin-top:2px;">Everyone currently waiting, across all departments</p>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><div class="icon purple"><i class="ti ti-list-numbers"></i></div><div><div class="number" id="statWaiting">0</div><div class="label">Waiting</div></div></div>
        <div class="stat-card"><div class="icon orange"><i class="ti ti-clock"></i></div><div><div class="number" id="statInProgress">0</div><div class="label">In Progress</div></div></div>
        <div class="stat-card"><div class="icon green"><i class="ti ti-check"></i></div><div><div class="number" id="statSeenToday">0</div><div class="label">Seen Today</div></div></div>
        <div class="stat-card"><div class="icon red"><i class="ti ti-alert-triangle"></i></div><div><div class="number" id="statUrgent">0</div><div class="label">High Priority</div></div></div>
    </div>

    <div class="card">
        <table>
            <thead>
                <tr><th>#</th><th>Patient</th><th>MRN</th><th>Department</th><th>Priority</th><th>Waiting Since</th><th>Status</th></tr>
            </thead>
            <tbody id="queueBody">
                <tr><td colspan="7" style="text-align:center;color:var(--tm);padding:30px;">Loading…</td></tr>
            </tbody>
        </table>
    </div>

    <div id="toastContainer" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:999;"></div>

    <script>
        (function() {
            'use strict';

            function timeAgo(ts) {
                if (!ts) return '—';
                const diffMs = Date.now() - ts;
                const mins = Math.floor(diffMs / 60000);
                if (mins < 1) return 'just now';
                if (mins < 60) return mins + ' min ago';
                const hrs = Math.floor(mins / 60);
                return hrs + 'h ' + (mins % 60) + 'm ago';
            }

            window.renderQueue = function() {
                const tbody = document.getElementById('queueBody');
                const patients = (typeof getPatients === 'function') ? getPatients() : [];

                const waiting = patients.filter(p => p.queueStatus === 'waiting');
                const inProgress = patients.filter(p => p.queueStatus === 'in-progress');
                const seenToday = patients.filter(p => {
                    if (p.queueStatus !== 'completed' || !p.queueAdded) return false;
                    return new Date(p.queueAdded).toDateString() === new Date().toDateString();
                });
                const urgent = patients.filter(p => p.queueStatus === 'waiting' && (p.priority === 'high' || p.priority === 'urgent'));

                document.getElementById('statWaiting').textContent = waiting.length;
                document.getElementById('statInProgress').textContent = inProgress.length;
                document.getElementById('statSeenToday').textContent = seenToday.length;
                document.getElementById('statUrgent').textContent = urgent.length;

                const active = [...waiting, ...inProgress].sort((a, b) => (a.queueAdded || 0) - (b.queueAdded || 0));

                if (active.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><i class="ti ti-list-check"></i>No one is currently in the queue.</div></td></tr>`;
                    return;
                }

                tbody.innerHTML = active.map((p, i) => {
                    const priorityBadge = p.priority === 'high' || p.priority === 'urgent' ? 'red' : p.priority === 'medium' ? 'orange' : 'gray';
                    const statusBadge = p.queueStatus === 'in-progress' ? 'orange' : 'gray';
                    const name = p.name || ((p.firstName || '') + ' ' + (p.lastName || '')).trim();
                    return `<tr>
                        <td><span class="position-num">${i + 1}</span></td>
                        <td>${name}</td>
                        <td>${p.mrn || '—'}</td>
                        <td>${p.department || 'General'}</td>
                        <td><span class="badge ${priorityBadge}">${p.priority || 'medium'}</span></td>
                        <td>${timeAgo(p.queueAdded)}</td>
                        <td><span class="badge ${statusBadge}">${p.queueStatus === 'in-progress' ? 'In Progress' : 'Waiting'}</span></td>
                    </tr>`;
                }).join('');
            };

            function tryRender(attempt) {
                if (typeof getPatients === 'function') {
                    renderQueue();
                    setInterval(renderQueue, 30000); // keep "waiting since" times fresh
                } else if (attempt < 20) {
                    setTimeout(() => tryRender(attempt + 1), 150);
                } else {
                    document.getElementById('queueBody').innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--red);padding:30px;">Could not load patient data.</td></tr>';
                }
            }
            tryRender(0);
            window.addEventListener('storage', renderQueue);
            window.addEventListener('patientsUpdated', renderQueue);

            window.toggleDarkMode = function() {
                const html = document.documentElement;
                const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                html.setAttribute('data-theme', next);
                localStorage.setItem('pclinic-theme', next);
                document.getElementById('themeIcon').className = next === 'dark' ? 'ti ti-sun' : 'ti ti-moon';
            };
            (function() {
                const saved = (localStorage.getItem('pclinic-theme') || (localStorage.getItem('pclinic-theme') || localStorage.getItem('pclinic_theme'))) || 'light';
                document.documentElement.setAttribute('data-theme', saved);
                document.getElementById('themeIcon').className = saved === 'dark' ? 'ti ti-sun' : 'ti ti-moon';
            })();
            window.logout = function() { window.pclinicLogout(); };

            console.log('🏥 PClinic Queue page loaded');
        })();
    </script>

    <script>
        requireAuth(['reception','doctor','nurse']).then(function(staff) {
            window.currentStaff = staff;
        }).catch(function(err) {
            console.warn('Auth guard redirect:', err && err.message);
        });
    </script>
</body>
</html>
