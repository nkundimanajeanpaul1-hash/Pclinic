<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PClinic — Physiotherapy Request Form</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="pclinic-ui.css?v=20260804_CHUK_3ROW">
<link rel="stylesheet" href="pclinic-file.css">
<link rel="preload" as="style" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css"></noscript>
<script>(function(){try{document.documentElement.setAttribute('data-theme',localStorage.getItem('pclinic-theme')||'light');}catch(e){}})();</script>
<style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--f);background:var(--bg);color:var(--tp);font-size:13px;min-height:100vh;-webkit-font-smoothing:antialiased}
    body::before{content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
        background:radial-gradient(circle at 20% 30%,rgba(5,150,105,.05) 0,transparent 50%),
                   radial-gradient(circle at 80% 70%,rgba(0,113,227,.05) 0,transparent 50%)}
    .wrap{max-width:1300px;margin:0 auto;padding:0 18px 26px}
    .grid{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;align-items:start}
    .panel{background:var(--glass-bg);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
        border:.5px solid var(--glass-brd);border-radius:var(--r2);box-shadow:var(--sh-2),var(--glass-spec);padding:16px}
    .panel h2{font-size:14px;font-weight:700;letter-spacing:-.2px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
    .panel h2 i{color:var(--ac)}
    label{display:block;font-size:11px;font-weight:600;color:var(--tm);margin:10px 0 5px;letter-spacing:.02em;text-transform:uppercase}
    input,select,textarea{width:100%;height:34px;padding:0 11px;border-radius:9px;border:.5px solid var(--bd);
        background:var(--s1);color:var(--tp);font-family:var(--f);font-size:13px;outline:none;transition:border-color .15s,box-shadow .15s}
    textarea{height:auto;padding:9px 11px;resize:vertical;min-height:65px}
    input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 4px var(--acl)}
    .row{display:flex;gap:9px}.row>*{flex:1}
    .cat{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
    .cat button{padding:6px 12px;border-radius:30px;border:.5px solid var(--bd);background:var(--s1);
        font-family:var(--f);font-size:11.5px;font-weight:600;color:var(--ts);cursor:pointer;transition:all .15s ease}
    .cat button:hover{transform:translateY(-1px)}
    .cat button.on{background:var(--ac);color:#fff;border-color:transparent}
    .svc{max-height:260px;overflow-y:auto;border:.5px solid var(--bd);border-radius:11px;background:var(--s1)}
    .svc-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;
        border-bottom:.5px solid var(--bd);cursor:pointer;transition:background .15s}
    .svc-item:last-child{border-bottom:0}
    .svc-item:hover{background:var(--acb)}
    .svc-item .n{font-size:12.5px;font-weight:600}
    .svc-item .c{font-size:11px;color:var(--tm)}
    .svc-item .p{font-size:12.5px;font-weight:700;color:var(--ac);white-space:nowrap}
    table{width:100%;border-collapse:collapse;font-size:12.5px}
    th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--tm);
       padding:7px 8px;border-bottom:.5px solid var(--bd)}
    td{padding:8px;border-bottom:.5px solid var(--bd)}
    tr:last-child td{border-bottom:0}
    .qty{width:52px;height:27px;text-align:center;padding:0 4px}
    .del{background:none;border:0;color:var(--red);cursor:pointer;font-size:15px;padding:3px;border-radius:6px;transition:all .15s}
    .del:hover{background:var(--redb);transform:scale(1.12)}
    .totals{margin-top:12px;padding-top:11px;border-top:.5px dashed var(--bd)}
    .trow{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
    .trow.grand{font-size:17px;font-weight:800;color:var(--ac);padding-top:8px;margin-top:5px;border-top:.5px solid var(--bd)}
    .empty{text-align:center;color:var(--tm);padding:26px 14px;font-size:12.5px}
    .bill-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;
        border-radius:10px;border:.5px solid var(--bd);background:var(--s1);margin-bottom:7px;transition:all .15s ease}
    .bill-row:hover{transform:translateX(3px);box-shadow:var(--sh-1)}
    .badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:30px;letter-spacing:.02em}
    .b-pending{background:rgba(245, 158, 11, 0.15);color:#f59e0b}
    .b-completed{background:rgba(16, 185, 129, 0.15);color:#10b981}
    .b-cancelled{background:rgba(239, 68, 68, 0.15);color:#ef4444}
    @media(max-width:900px){.grid{grid-template-columns:1fr}}

    /* Apple-Grade Dark Mode (from zero) */
    [data-theme="dark"], html[data-theme="dark"], body.dark-mode {
        --bg: #0d0d12 !important;
        --s1: #161620 !important;
        --s2: #1e1e2c !important;
        --s3: #262638 !important;
        --bd: rgba(255,255,255,0.14) !important;
        --tp: #f3f4f6 !important;
        --ts: #d1d5db !important;
        --tm: #9ca3af !important;
        --ac: #34d399 !important;
        --acb: rgba(52,211,153,0.15) !important;
        --glass-bg: rgba(22,22,32,0.88) !important;
        color-scheme: dark;
    }
</style>
</head>
<body>

<div class="pc-topbar" style="display: none !important;">
    <div class="pc-brand">
        <img class="pc-logo" src="logo-wide.png" alt="PClinic" width="118" height="30">
        <span class="pc-appsub">Physiotherapy Request</span>
    </div>
    <div class="pc-tr">
        <button class="pc-iconbtn" onclick="pcToggleTheme()" title="Dark mode"><i class="ti ti-moon" id="themeIcon"></i></button>
        <div class="pc-chip" id="userChip"><span class="pc-avatar" id="userAvatar">··</span><span id="userName">…</span></div>
        <button class="pc-iconbtn" onclick="pclinicLogout()" title="Sign out"><i class="ti ti-logout"></i></button>
    </div>
</div>

<div class="pc-headerbar">
    <nav class="pc-crumb"><a href="hub.html">🏥 Hub</a><span class="sep">›</span>
        <a href="doctor-dashboard.html">Doctor</a><span class="sep">›</span><span>Physio Request</span></nav>
    <span class="pc-divider"></span>
    <span class="pc-greet">Order physiotherapy &amp; bill cashier</span>
    <span class="pc-spacer"></span>
    <button class="pc-btn" onclick="closePhysioPage()"><i class="ti ti-arrow-left"></i> Close</button>
</div>

<div class="wrap">
<div class="grid">

    <!-- LEFT: build the physiotherapy request -->
    <div class="panel">
        <h2><i class="ti ti-accessible"></i> New Physiotherapy Request</h2>

        <label for="patientSel">Patient</label>
        <select id="patientSel"><option value="">Select a patient…</option></select>

        <!-- SINGLE CLINICAL NOTE BOX -->
        <label for="physioNotes">Clinical Notes &amp; Reasons for Physiotherapy Referral</label>
        <textarea id="physioNotes" placeholder="e.g. Post-operative right knee stiffness, target ROM 90 deg, pain management, strengthening quadriceps..."></textarea>

        <label>Add Physiotherapy Modalities (Bills automatically to Cashier)</label>
        <div class="cat" id="catBar">
            <button class="on" onclick="filterCategory('all', this)">All Modalities</button>
            <button onclick="filterCategory('therapy', this)">Manual / Exercise</button>
            <button onclick="filterCategory('modality', this)">Electro / Ultrasound</button>
            <button onclick="filterCategory('rehab', this)">Rehabilitation / Gait</button>
        </div>
        <div class="svc" id="svcList"></div>

        <div style="margin-top:14px">
            <table>
                <thead><tr><th>Modality / Service</th><th style="width:60px">Sessions</th><th style="width:100px;text-align:right">Amount</th><th style="width:34px"></th></tr></thead>
                <tbody id="lineItems"><tr><td colspan="4" class="empty">No modalities yet — pick a service above</td></tr></tbody>
            </table>
        </div>

        <div class="totals">
            <div class="trow"><span>Subtotal</span><span id="subT">RWF 0</span></div>
            <div class="trow grand"><span>Total Cash for Cashier</span><span id="grandT">RWF 0</span></div>
        </div>

        <div class="row" style="margin-top:14px">
            <button class="pc-btn pc-btn-primary" onclick="submitPhysioRequest()" style="flex:2"><i class="ti ti-check"></i> Send to Physiotherapy &amp; Bill Cashier</button>
            <button class="pc-btn" onclick="clearPhysioRequest()"><i class="ti ti-x"></i> Clear</button>
        </div>
    </div>

    <!-- RIGHT: recent physiotherapy requests & history -->
    <div class="panel">
        <h2><i class="ti ti-history"></i> Physiotherapy Request History</h2>
        <div class="cat" style="margin-bottom:12px">
            <button class="on" data-f="all" onclick="filterHistory('all',this)">All Orders</button>
            <button data-f="pending" onclick="filterHistory('pending',this)">Pending</button>
            <button data-f="completed" onclick="filterHistory('completed',this)">Completed</button>
        </div>
        <div id="historyList"></div>
    </div>

</div>
</div>

<div class="pc-toasts"></div>

<script type="module" src="firebase-config.js"></script>
<script src="auth-guard.js"></script>
<script src="pclinic-state.js"></script>
<script src="patient-data.js"></script>
<script src="pclinic-orders.js"></script>
<script src="pclinic-catalog.js"></script>
<script src="pclinic-file.js?v=20260814_RAD"></script>
<script src="pclinic-handoff.js"></script>

<script>
(function(){
'use strict';

var cart = [], curCat = 'all', curFilter = 'all';

// Standard Physiotherapy Tariff
var PHYSIO_TARIFF = [
    { code: 'PT-EVAL', name: 'Physiotherapy Initial Assessment / Eval', duration: '45 mins', price: 15000, cat: 'therapy' },
    { code: 'PT-MAN',  name: 'Manual Therapy & Joint Mobilization',       duration: '30 mins', price: 10000, cat: 'therapy' },
    { code: 'PT-TENS', name: 'TENS / Electrotherapy Session',               duration: '30 mins', price: 8000,  cat: 'modality' },
    { code: 'PT-US',   name: 'Ultrasound Therapy Session',                  duration: '20 mins', price: 8000,  cat: 'modality' },
    { code: 'PT-EX',   name: 'Therapeutic Exercise & Rehab',                duration: '45 mins', price: 10000, cat: 'therapy' },
    { code: 'PT-TRA',  name: 'Spinal Decompression / Traction',             duration: '30 mins', price: 15000, cat: 'rehab' },
    { code: 'PT-GAIT', name: 'Gait Training & Balance Re-education',        duration: '30 mins', price: 10000, cat: 'rehab' },
    { code: 'PT-RESP', name: 'Chest / Respiratory Physiotherapy',           duration: '30 mins', price: 12000, cat: 'rehab' },
    { code: 'PT-CRY',  name: 'Cryotherapy / Heat-Cold Modality',            duration: '20 mins', price: 5000,  cat: 'modality' },
    { code: 'PT-HOME', name: 'Customized Home Exercise Plan (HEP)',         duration: '15 mins', price: 5000,  cat: 'therapy' }
];

function money(n){ return 'RWF ' + (Number(n)||0).toLocaleString('en-US'); }
function esc(v){ var d=document.createElement('div'); d.textContent=v==null?'':String(v); return d.innerHTML; }

// ── Patients ──
function loadPatients(){
    var sel = document.getElementById('patientSel');
    var list = [];
    try { if (typeof getPatients==='function') list = getPatients()||[]; } catch(e){}
    sel.innerHTML = '<option value="">Select a patient…</option>';
    list.forEach(function(p){
        var o = document.createElement('option');
        o.value = p.id;
        o.textContent = (p.name || ((p.firstName||'')+' '+(p.lastName||'')).trim() || 'Patient') + '  ·  ' + (p.mrn||'ID '+p.id);
        sel.appendChild(o);
    });

    // Auto-select active patient from ?patient=ID or localStorage
    var pid = new URLSearchParams(location.search).get('patient');
    if (!pid) {
        try { pid = localStorage.getItem('pclinic_active_patient'); } catch(e){}
    }
    if (pid && sel.querySelector('option[value="' + pid + '"]')) {
        sel.value = pid;
    }
    var activeP = list.find(function(p){ return String(p.id) === String(sel.value || pid); }) || list[0] || null;
    if (activeP && typeof pcFile !== 'undefined' && typeof pcFile.renderDemoBar === 'function') {
        pcFile.renderDemoBar('.panel', activeP);
    }
    sel.addEventListener('change', function() {
        var selP = list.find(function(p){ return String(p.id) === String(sel.value); });
        if (selP && typeof pcFile !== 'undefined' && typeof pcFile.renderDemoBar === 'function') {
            var oldBar = document.getElementById('pc_common_demo_bar');
            if (oldBar) oldBar.remove();
            pcFile.renderDemoBar('.panel', selP);
        }
    });
}

// ── Modalities Catalogue ──
window.filterCategory = function(cat, btn) {
    curCat = cat;
    document.querySelectorAll('#catBar button').forEach(function(x){ x.classList.remove('on'); });
    btn.classList.add('on');
    renderServices();
};

function renderServices(){
    var box = document.getElementById('svcList');
    var list = PHYSIO_TARIFF.filter(function(s){ return curCat === 'all' || s.cat === curCat; });
    box.innerHTML = '';
    list.forEach(function(s){
        var d = document.createElement('div');
        d.className = 'svc-item';
        d.innerHTML = '<span><span class="n"></span><br><span class="c"></span></span><span class="p"></span>';
        d.querySelector('.n').textContent = s.name;
        d.querySelector('.c').textContent = s.code + ' · ' + s.duration;
        d.querySelector('.p').textContent = money(s.price);
        d.onclick = function(){ addItem(s); };
        box.appendChild(d);
    });
}

// ── Cart / Modalities Table ──
function addItem(t){
    var ex = cart.filter(function(c){ return c.code === t.code; })[0];
    if (ex) ex.qty++;
    else cart.push({ code: t.code, name: t.name, price: t.price, qty: 1 });
    renderCart();
    pcToast(t.name + ' added to request', 'success');
}

function renderCart(){
    var tb = document.getElementById('lineItems');
    if (!cart.length){
        tb.innerHTML = '<tr><td colspan="4" class="empty">No modalities yet — pick a service above</td></tr>';
        recalc();
        return;
    }
    tb.innerHTML = '';
    cart.forEach(function(c, i){
        var tr = document.createElement('tr');
        var td1 = document.createElement('td'); td1.textContent = c.name;
        var td2 = document.createElement('td');
        var q = document.createElement('input'); q.type = 'number'; q.min = '1'; q.value = c.qty; q.className = 'qty';
        q.onchange = function(){ c.qty = Math.max(1, parseInt(q.value) || 1); renderCart(); };
        td2.appendChild(q);
        var td3 = document.createElement('td'); td3.style.textAlign = 'right'; td3.style.fontWeight = '600';
        td3.textContent = money(c.price * c.qty);
        var td4 = document.createElement('td');
        var b = document.createElement('button'); b.className = 'del'; b.innerHTML = '<i class="ti ti-trash"></i>';
        b.onclick = function(){ cart.splice(i, 1); renderCart(); };
        td4.appendChild(b);
        tr.append(td1, td2, td3, td4);
        tb.appendChild(tr);
    });
    recalc();
}

function recalc(){
    var sub = cart.reduce(function(s, c){ return s + c.price * c.qty; }, 0);
    document.getElementById('subT').textContent = money(sub);
    document.getElementById('grandT').textContent = money(sub);
}

// ── Submit Physiotherapy Request & Bill Cashier ──
window.submitPhysioRequest = function(){
    var sel = document.getElementById('patientSel');
    if (!sel.value){ pcToast('Choose a patient first', 'error'); sel.focus(); return; }
    if (!cart.length){ pcToast('Add at least one physiotherapy modality', 'error'); return; }
    
    var pid = sel.value;
    var pname = sel.options[sel.selectedIndex].textContent.split('·')[0].trim();
    var notes = document.getElementById('physioNotes').value.trim() || 'Physiotherapy Referral';

    // 1. Create Order in pclinic_orders & auto-bill cashier
    var order = null;
    if (window.pcOrders) {
        order = window.pcOrders.create({
            patientId: pid,
            patientName: pname,
            type: 'physio',
            priority: 'routine',
            notes: notes,
            items: cart.slice()
        });
    }

    // 2. Also record in patient's physioRequests
    var physioReq = {
        id: order ? order.id : ('pt-' + Date.now()),
        patientId: pid,
        patientName: pname,
        notes: notes,
        items: cart.slice(),
        total: cart.reduce(function(s, c){ return s + c.price * c.qty; }, 0),
        status: 'Pending',
        timestamp: new Date().toISOString()
    };

    try {
        var patients = JSON.parse(localStorage.getItem('pclinic_patients') || '[]');
        var idx = patients.findIndex(function(p){ return String(p.id) === String(pid); });
        if (idx !== -1) {
            if (!patients[idx].physioRequests) patients[idx].physioRequests = [];
            patients[idx].physioRequests.unshift(physioReq);
            localStorage.setItem('pclinic_patients', JSON.stringify(patients));
        }
    } catch(e) {}

    pcToast('✅ Physio request sent to Dept & ' + money(physioReq.total) + ' billed to Cashier!', 'success');
    clearPhysioRequest();
    renderHistory();
};

window.clearPhysioRequest = function(){
    cart = [];
    document.getElementById('physioNotes').value = '';
    renderCart();
};

// ── Request History (Right Panel) ──
window.filterHistory = function(f, btn) {
    curFilter = f;
    btn.parentElement.querySelectorAll('button').forEach(function(x){ x.classList.remove('on'); });
    btn.classList.add('on');
    renderHistory();
};

function renderHistory(){
    var box = document.getElementById('historyList');
    var orders = [];
    try {
        orders = JSON.parse(localStorage.getItem('pclinic_orders') || '[]').filter(function(o){
            return o.type === 'physio' || o.dept === 'physio';
        });
    } catch(e){}

    // Also include any patient physioRequests
    try {
        var pts = JSON.parse(localStorage.getItem('pclinic_patients') || '[]');
        pts.forEach(function(p){
            (p.physioRequests || []).forEach(function(req){
                if (!orders.some(function(o){ return String(o.id) === String(req.id); })) {
                    orders.push({
                        id: req.id,
                        patientId: req.patientId,
                        patientName: req.patientName,
                        notes: req.notes,
                        items: req.items || [],
                        status: req.status === 'Completed' ? 'completed' : 'pending',
                        orderedAt: req.timestamp || new Date().toISOString()
                    });
                }
            });
        });
    } catch(e){}

    var list = orders.filter(function(o){
        return curFilter === 'all' || o.status === curFilter;
    }).sort(function(a, b){
        return new Date(b.orderedAt) - new Date(a.orderedAt);
    }).slice(0, 30);

    if (!list.length){
        box.innerHTML = '<div class="empty">No physiotherapy requests recorded yet</div>';
        return;
    }
    box.innerHTML = '';
    list.forEach(function(o){
        var d = document.createElement('div');
        d.className = 'bill-row';
        var left = document.createElement('div');
        left.innerHTML = '<div style="font-weight:600;font-size:12.5px"></div>' +
                       '<div style="font-size:11px;color:var(--ts);margin-top:2px"></div>' +
                       '<div style="font-size:10.5px;color:var(--tm);margin-top:2px"></div>';
        left.children[0].textContent = (o.patientName || 'Patient') + ' · MRN / ID: ' + o.patientId;
        var itemsTxt = (o.items || []).map(function(i){ return i.name; }).join(', ') || 'Physiotherapy Modality';
        left.children[1].textContent = itemsTxt;
        left.children[2].textContent = new Date(o.orderedAt).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) +
            (o.notes ? ' · Note: ' + o.notes : '');
        var right = document.createElement('div');
        right.style.cssText = 'text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end';
        var totalAmt = (o.items || []).reduce(function(s, i){ return s + (i.price || 0) * (i.qty || 1); }, 0);
        var amt = document.createElement('div'); amt.style.cssText = 'font-weight:700;font-size:13px;color:var(--ac)';
        amt.textContent = money(totalAmt);
        var bg = document.createElement('span');
        var st = o.status === 'completed' ? 'completed' : 'pending';
        var stLbl = o.status === 'completed' ? '✅ Completed' : '⏳ Pending';
        bg.className = 'badge b-' + st;
        bg.textContent = stLbl;
        right.append(amt, bg);
        d.append(left, right);
        box.appendChild(d);
    });
}

// ── Close / Back ──
window.closePhysioPage = function(){
    try {
        if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'CLOSE_PHYSIO' }, window.location.origin);
            return;
        }
    } catch (e) {}
    window.location.href = 'doctor-dashboard.html';
};

window.addEventListener('ordersUpdated', renderHistory);
window.addEventListener('patientsUpdated', loadPatients);

requireAuth(['physio']).then(function(staff){
    window.currentStaff = staff;
    document.getElementById('userName').textContent = staff.name || 'Doctor';
    document.getElementById('userAvatar').textContent = (staff.name || 'DR').substring(0,2).toUpperCase();
    loadPatients();
    renderServices();
    renderCart();
    renderHistory();
}).catch(function(){
    loadPatients();
    renderServices();
    renderCart();
    renderHistory();
});

})();
</script>
</body>
</html>
