<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <!-- ═══ FIREBASE + AUTH GUARD ═══ -->
    <script type="module" src="firebase-config.js"></script>
    <script src="auth-guard.js"></script>
    <script src="pclinic-state.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PClinic • Cumulative Laboratory Flow Sheet</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css">
    <link rel="stylesheet" href="pclinic-ui.css?v=20260804_CHUK_3ROW">
    <link rel="stylesheet" href="pclinic-file.css">
    <link rel="stylesheet" href="pclinic-apple.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #f5f5f7;
            --s1: rgba(255, 255, 255, 0.62);
            --s2: rgba(235, 243, 251, 0.45);
            --s3: rgba(226, 238, 249, 0.72);
            --bd: rgba(0, 0, 0, 0.08);
            --tp: #1d1d1f;
            --ts: #3a3a3c;
            --tm: #6e6e73;
            --ac: #0071e3;
            --ach: #005bb5;
            --acb: rgba(0, 113, 227, 0.10);
            --green: #248a3d;
            --orange: #c47b12;
            --red: #c9342a;
            --redb: rgba(201, 52, 42, 0.14);
            --yellowb: rgba(0, 113, 227, 0.08);
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 10px 32px rgba(0, 0, 0, 0.06);
            --f: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', sans-serif;
            --smooth: cubic-bezier(0.22, 1, 0.36, 1);
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --gold: #0071e3;
            --gold-deep: #0071e3;
        }

        /* Apple-Grade Dark Mode (from zero) — 0 invisible text */
        [data-theme="dark"], html[data-theme="dark"], body.dark-mode {
            --bg: #0d0d12 !important;
            --s1: #161620 !important;
            --s2: #1a1e29 !important;
            --s3: #222736 !important;
            --bd: rgba(255, 255, 255, 0.14) !important;
            --tp: #f3f4f6 !important;
            --ts: #d1d5db !important;
            --tm: #9ca3af !important;
            --ac: #60a5fa !important;
            --ach: #93c5fd !important;
            --acb: rgba(96, 165, 250, 0.15) !important;
            --redb: rgba(239, 68, 68, 0.22) !important;
            --yellowb: rgba(245, 158, 11, 0.22) !important;
            color-scheme: dark;
        }

        body {
            font-family: var(--f);
            background: transparent;
            color: var(--tp);
            font-size: 13px;
            padding: 4px 4px 10px;
            -webkit-font-smoothing: antialiased;
            letter-spacing: -0.011em;
        }

        .container {
            max-width: none;
            width: 100%;
            margin: 0 auto;
            animation: ggRise 0.55s var(--spring) both;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes ggRise {
            from { opacity: 0; transform: translateY(16px) scale(0.985); }
            to { opacity: 1; transform: none; }
        }

        /* ─── PCLINIC PATIENT DEMOGRAPHIC BANNER ─── */
        .oc-patient-banner {
            background: linear-gradient(165deg, rgba(255,255,255,0.62), rgba(242,246,252,0.42));
            -webkit-backdrop-filter: saturate(180%) blur(28px);
            backdrop-filter: saturate(180%) blur(28px);
            border: 0.5px solid rgba(255,255,255,0.7);
            border-radius: 18px;
            padding: 10px 14px;
            margin-bottom: 10px;
            box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.85);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px 14px;
            font-size: 11.5px;
            position: relative;
            overflow: hidden;
        }
        .oc-patient-banner::before {
            content: '';
            position: absolute; inset: 0; pointer-events: none;
            background: linear-gradient(160deg, rgba(255,255,255,0.55), transparent 42%);
        }

        .oc-demo-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .oc-demo-lbl {
            font-size: 9.5px;
            font-weight: 700;
            color: var(--tm);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .oc-demo-val {
            font-size: 12.5px;
            font-weight: 700;
            color: var(--tp);
        }

        .oc-demo-val.mrn {
            color: var(--ac);
        }

        /* ─── GOLDEN GATE FLOW SHEET ─── */
        .oc-matrix-wrapper {
            background:
                radial-gradient(700px 280px at 0% 0%, rgba(232, 197, 107, 0.28), transparent 55%),
                linear-gradient(180deg, rgba(255, 252, 244, 0.72), rgba(255, 244, 220, 0.48));
            -webkit-backdrop-filter: saturate(190%) blur(32px);
            backdrop-filter: saturate(190%) blur(32px);
            border: 0.5px solid rgba(255,255,255,0.72);
            border-radius: 20px;
            box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.9);
            overflow: auto;
            max-height: calc(100vh - 150px);
            margin-bottom: 18px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .oc-matrix-wrapper::-webkit-scrollbar { height: 8px; width: 8px; }
        .oc-matrix-wrapper::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #8ec5ff, #0071e3);
            border-radius: 99px;
        }
        .oc-matrix-wrapper::-webkit-scrollbar-track { background: transparent; }

        table.oc-matrix-table {
            width: max-content !important;
            min-width: 100% !important;
            max-width: none !important;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 11px;
            text-align: left;
            table-layout: fixed;
        }

        table.oc-matrix-table thead th {
            position: sticky;
            top: 0;
            z-index: 4;
            background: rgba(255, 246, 226, 0.92);
            -webkit-backdrop-filter: blur(18px);
            backdrop-filter: blur(18px);
            color: var(--tp);
            font-size: 11px;
            font-weight: 700;
            padding: 5px 3px;
            border-bottom: 0.5px solid var(--bd);
            border-right: 0.5px solid var(--bd);
            vertical-align: bottom;
            white-space: nowrap;
        }
        table.oc-matrix-table thead th:nth-child(1),
        table.oc-matrix-table tbody td.oc-cat-cell {
            position: sticky;
            left: 0;
            z-index: 5;
            min-width: 58px;
            max-width: 64px;
            width: 60px;
        }
        table.oc-matrix-table thead th:nth-child(2),
        table.oc-matrix-table tbody td.oc-test-cell {
            position: sticky;
            left: 60px;
            z-index: 5;
            min-width: 108px;
            max-width: 118px;
            width: 112px;
        }
        table.oc-matrix-table thead th:nth-child(1) { z-index: 8; }
        table.oc-matrix-table thead th:nth-child(2) { z-index: 8; }

        table.oc-matrix-table thead th:last-child {
            border-right: none;
        }

        .oc-col-order-hdr {
            text-align: center;
            font-size: 11px;
            line-height: 1.15;
            min-width: 150px !important;
            max-width: 150px !important;
            width: 150px !important;
        }

        .oc-col-order-date {
            font-weight: 800;
            color: var(--tp);
            font-size: 11px;
            letter-spacing: -0.02em;
        }

        .oc-col-order-id {
            color: var(--gold-deep);
            font-weight: 700;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 10px;
        }

        .oc-col-links {
            display: none;
        }

        .oc-col-link {
            color: var(--ac);
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .oc-col-link:hover {
            text-decoration: underline;
        }

        /* Matrix Rows */
        table.oc-matrix-table tbody tr {
            border-bottom: 0.5px solid var(--bd);
            transition: background 0.28s var(--smooth), transform 0.28s var(--smooth);
        }

        table.oc-matrix-table tbody tr.row-even {
            background: rgba(255, 244, 226, 0.42);
        }

        table.oc-matrix-table tbody tr.row-odd {
            background: rgba(255, 255, 255, 0.28);
        }

        table.oc-matrix-table tbody tr:hover {
            background: rgba(232, 197, 107, 0.22) !important;
        }

        table.oc-matrix-table td {
            padding: 4px 3px;
            border-right: 0.5px solid var(--bd);
            vertical-align: middle;
        }

        table.oc-matrix-table td:last-child {
            border-right: none;
        }

        /* Category Left Column */
        .oc-cat-cell {
            font-weight: 800;
            font-size: 11px;
            vertical-align: top !important;
            padding: 5px 5px !important;
            background: rgba(255, 255, 255, 0.92) !important;
            border-right: 1px solid var(--bd) !important;
            letter-spacing: 0.2px;
            line-height: 1.25;
            white-space: normal;
        }

        .oc-cat-chem { color: #059669; }
        .oc-cat-fbc  { color: #800040; }
        .oc-cat-sero { color: #c81e51; }
        .oc-cat-mic  { color: #005bb5; }
        .oc-cat-uri  { color: #006666; }

        [data-theme="dark"] .oc-cat-chem { color: #34d399; }
        [data-theme="dark"] .oc-cat-fbc  { color: #c084fc; }
        [data-theme="dark"] .oc-cat-sero { color: #f472b6; }
        [data-theme="dark"] .oc-cat-mic  { color: #60a5fa; }
        [data-theme="dark"] .oc-cat-uri  { color: #2dd4bf; }

        /* Test Name Cell */
        .oc-test-cell {
            font-family: var(--f);
            font-size: 11px;
            font-weight: 500;
            color: var(--tp);
            white-space: normal;
            background: rgba(255, 248, 232, 0.45) !important;
            overflow: hidden;
            line-height: 1.2;
            word-break: break-word;
        }

        .oc-test-code {
            font-weight: 700;
            color: #b8860b;
            margin-right: 4px;
            font-size: 11px;
        }

        .oc-test-range {
            color: var(--tm);
            font-size: 11px;
            margin-left: 4px;
        }

        /* Result Cell */
        .oc-res-cell {
            text-align: center;
            font-size: 11px;
            font-weight: 650;
            color: var(--tp);
            white-space: nowrap;
            min-width: 150px !important;
            max-width: 150px !important;
            width: 150px !important;
        }

        .oc-res-abnormal {
            background: var(--redb) !important;
            color: #c92a2a !important;
            font-weight: 800 !important;
        }

        [data-theme="dark"] .oc-res-abnormal {
            color: #ff8787 !important;
        }

        .oc-flag {
            display: inline-block;
            background: #d9534f;
            color: #ffffff;
            font-weight: 800;
            font-size: 10px;
            padding: 1px 5px;
            border-radius: 4px;
            margin-left: 5px;
            vertical-align: middle;
        }

        .oc-pending-badge {
            color: #f59e0b;
            font-weight: 700;
            font-style: italic;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* Header action buttons */
        .pc-topbar {
            background: var(--s1);
            border: 1px solid var(--bd);
            border-radius: 14px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }

        .btn-apple {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            background: var(--s2);
            color: var(--tp);
            border: 1px solid var(--bd);
            text-decoration: none;
            font-family: inherit;
        }

        .btn-apple:hover {
            background: var(--s3);
            transform: scale(1.02);
        }

        .btn-apple.primary {
            background: var(--ac);
            color: #ffffff;
            border-color: var(--ac);
        }

        .btn-apple.primary:hover {
            background: var(--ach);
        }

        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            padding: 10px 14px;
            border-radius: 14px;
            background: rgba(28,28,30,0.86);
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            box-shadow: var(--shadow);
            backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            gap: 8px;
            animation: ggRise 0.4s var(--spring);
        }
        @media print {
            body { background: #fff !important; padding: 0; }
            .gg-toolbar, .btn-apple { display: none !important; }
            .oc-matrix-wrapper { max-height: none; overflow: visible; box-shadow: none; }
        }

        /* Shared patient identification + action bars must stay on this page */
        #pcMasterHeader, #pcMasterHeader.pc-master-header {
            display: flex !important;
            flex-direction: column !important;
            visibility: visible !important;
            opacity: 1 !important;
            height: auto !important;
            max-height: none !important;
            overflow: visible !important;
            position: relative !important;
            z-index: 400 !important;
            width: 100% !important;
            max-width: 100% !important;
            margin: 0 0 8px !important;
            padding: 6px 8px 0 !important;
            background: transparent !important;
        }
        #pc_common_demo_bar.oc-demo-bar,
        .oc-demo-bar {
            display: flex !important;
            visibility: visible !important;
            opacity: 1 !important;
            height: auto !important;
            max-height: none !important;
            position: relative !important;
            top: auto !important;
        }
        #dcBar.dc-bar, .dc-bar {
            display: flex !important;
            visibility: visible !important;
        }


        /* Beat global 100% table/column rules from pclinic-file.css */
        .oc-matrix-wrapper table.oc-matrix-table col.col-analysis,
        .oc-matrix-wrapper table.oc-matrix-table th:first-child,
        .oc-matrix-wrapper table.oc-matrix-table td.oc-cat-cell {
            width: 150px !important; max-width: 150px !important; min-width: 150px !important;
            box-sizing: border-box !important;
        }
        .oc-matrix-wrapper table.oc-matrix-table th:nth-child(2),
        .oc-matrix-wrapper table.oc-matrix-table td.oc-test-cell {
            width: 250px !important; max-width: 250px !important; min-width: 250px !important;
            box-sizing: border-box !important;
        }
        .oc-matrix-wrapper table.oc-matrix-table th.oc-col-order-hdr,
        .oc-matrix-wrapper table.oc-matrix-table td.oc-res-cell {
            width: 150px !important; max-width: 150px !important; min-width: 150px !important;
            box-sizing: border-box !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Toolbar + patient banner removed: IDs live in the patient identification strip, actions in the action bar. -->
        <div id="ocPatientBar" class="oc-patient-banner" style="display:none !important;" hidden></div>

        <!-- PClinic Cumulative Flow Sheet Table -->
        <div class="oc-matrix-wrapper">
            <table class="oc-matrix-table" id="ocMatrixTable">
                <thead id="matrixHead"></thead>
                <tbody id="matrixBody"></tbody>
            </table>
        </div>

        <!-- Microbiology Culture & Sensitivity Reports (real lab data) -->
        <div id="microReports" style="display:none;"></div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="patient-data.js"></script>
    <script src="pclinic-catalog.js"></script>
    <script src="pclinic-lab-catalog.js"></script>
<script src="pclinic-orders.js"></script>
    <script src="pclinic-file.js?v=20260814_RAD"></script>
    <script src="pclinic-handoff.js"></script>

    <script>
    (function () {
        'use strict';

        var currentPatient = null;

        /* ── STANDARD PCLINIC LABORATORY PARAMETER REGISTER (codes/ranges only — NO template values) ── */
        var OC_CATEGORIES = [
            {
                id: 'chem',
                title: '20000 USUAL CHEMISTRY',
                className: 'oc-cat-chem',
                tests: [
                    { code: '20001', name: 'UREA/BLOOD', unit: 'mmol/l', range: '3-9.2' },
                    { code: '20002', name: 'CREATININE/BLOOD', unit: 'µmol/l', range: '63.6-110.5' },
                    { code: '20003', name: 'NA + (SODIUM)/BLOOD', unit: 'mmol/l', range: '135-145' },
                    { code: '20004', name: 'K + (POTASSIUM)/BLOOD', unit: 'mmol/l', range: '3.5-5.0' },
                    { code: '20005', name: 'MAGNESIUM/BLOOD', unit: 'mmol/l', range: '0.66-1.07' },
                    { code: '20006', name: 'CL -(CHLORURE)/BLOOD', unit: 'mmol/l', range: '98-107' },
                    { code: '20007', name: 'FASTING GLUCOSE/BLOOD', unit: 'mmol/l', range: '3.9-5.6' },
                    { code: '20008', name: 'LIVER FUNCTION (SGPT/ALT)', unit: 'U/l', range: '7-56' },
                    { code: '20009', name: 'LIVER FUNCTION (SGOT/AST)', unit: 'U/l', range: '10-40' }
                ]
            },
            {
                id: 'fbc',
                title: '31000 FULL BLOOD COUNT',
                className: 'oc-cat-fbc',
                tests: [
                    { code: '31001', name: 'WBC', unit: '10^3/µl', range: '4-10' },
                    { code: '31002', name: 'RBC', unit: '10^6/µl', range: '4.5-6.2' },
                    { code: '31003', name: 'hemoglobin', unit: 'g/dl', range: '13-17' },
                    { code: '31004', name: 'Hct', unit: '%', range: '40-54' },
                    { code: '31005', name: 'MCV', unit: 'fL', range: '82-98' },
                    { code: '31006', name: 'MCH', unit: 'pg', range: '27-31' },
                    { code: '31007', name: 'MCHC', unit: 'g/dl', range: '32-36' },
                    { code: '31008', name: 'platelets', unit: '10^3/µl', range: '150-450' },
                    { code: '31009', name: 'RDW', unit: '%', range: '11.5-14.5' },
                    { code: '31010', name: 'MPV', unit: 'fL', range: '6.9-10.6' },
                    { code: '32001', name: 'neutrophiles', unit: '%', range: '40-75' },
                    { code: '32002', name: 'lymphocytes', unit: '%', range: '20-40' },
                    { code: '32003', name: 'monocytes', unit: '%', range: '2-8' },
                    { code: '32004', name: 'eosinophiles', unit: '%', range: '1-4' }
                ]
            },
            {
                id: 'sero',
                title: '40000 SEROLOGY & IMMUNOLOGY',
                className: 'oc-cat-sero',
                tests: [
                    { code: '40001', name: 'HIV 1/2 ANTIBODY/AG', unit: '', range: 'Negative' },
                    { code: '40002', name: 'HBsAg (HEPATITIS B)', unit: '', range: 'Negative' },
                    { code: '40003', name: 'HCV ANTIBODY', unit: '', range: 'Negative' },
                    { code: '40004', name: 'SYPHILIS RPR/VDRL', unit: '', range: 'Negative' },
                    { code: '40005', name: 'CRP (C-REACTIVE PROTEIN)', unit: 'mg/l', range: '0-5' },
                    { code: '40006', name: 'WIDAL TEST (SALMONELLA)', unit: '', range: 'Negative' },
                    { code: '40007', name: 'H. PYLORI AG/AB', unit: '', range: 'Negative' }
                ]
            },
            {
                id: 'micro',
                title: '50000 MICROBIOLOGY & CULTURES',
                className: 'oc-cat-mic',
                tests: [
                    { code: '50001', name: 'MALARIA PARASITE (MP)', unit: '', range: 'Negative' },
                    { code: '50002', name: 'BLOOD CULTURE & SENSITIVITY', unit: '', range: 'No growth' },
                    { code: '50003', name: 'URINE CULTURE & SENSITIVITY', unit: '', range: 'No growth' },
                    { code: '50004', name: 'STOOL OVA & CYSTS', unit: '', range: 'Negative' }
                ]
            },
            {
                id: 'uri',
                title: '60000 URINALYSIS',
                className: 'oc-cat-uri',
                tests: [
                    { code: '60001', name: 'URINE PROTEIN/ALBUMIN', unit: '', range: 'Negative' },
                    { code: '60002', name: 'URINE GLUCOSE', unit: '', range: 'Negative' },
                    { code: '60003', name: 'URINE KETONES', unit: '', range: 'Negative' },
                    { code: '60004', name: 'URINE WBC / LEUKOCYTES', unit: '/HPF', range: '0-5' }
                ]
            }
        ];

        // ── EXTEND THE FLOW SHEET WITH THE FULL CHUK LAB CATALOG ──
        // Shows a row for every parameter of every catalog exam; codes that
        // already exist (20000/31000/40000/50000/60000 rows) are skipped so
        // old results keep matching. Runs before any rendering.
        (function extendCategoriesWithCatalog() {
            if (!window.pcLabCatalog || typeof window.pcLabCatalog.list !== 'function') return;
            var knownCodes = {};
            var catById = {};
            OC_CATEGORIES.forEach(function (c) {
                catById[c.id] = c;
                c.tests.forEach(function (t) { knownCodes[String(t.code).toUpperCase()] = true; });
            });
            window.pcLabCatalog.list().forEach(function (ex) {
                var catId = ex.category || 'other';
                var cat = catById[catId];
                if (!cat) {
                    cat = {
                        id: catId,
                        title: String(window.pcLabCatalog.categoryLabel(catId) || catId).toUpperCase(),
                        className: 'oc-cat-' + catId,
                        color: '#334155',
                        tests: []
                    };
                    catById[catId] = cat;
                    OC_CATEGORIES.push(cat);
                }
                (ex.parameters || []).forEach(function (p) {
                    if (knownCodes[String(p.code).toUpperCase()]) return;
                    knownCodes[String(p.code).toUpperCase()] = true;
                    cat.tests.push({ code: p.code, name: p.name, unit: p.unit || '', range: p.range || '' });
                });
            });
        })();

        /* ── HELPERS ── */
        function escapeHtml(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function stripMod(v) {
            return String(v == null ? '' : v).replace(/^MOD-/i, '').trim();
        }

        function readPatients() {
            try { return JSON.parse(localStorage.getItem('pclinic_patients') || '[]') || []; }
            catch (e) { return []; }
        }

        function patientName(p) {
            if (!p) return '';
            if (p.name) return p.name;
            var n = ((p.firstName || '') + ' ' + (p.lastName || '')).trim();
            return n || ('Patient ' + stripMod(p.id));
        }

        function flagBadge(flag) {
            var f = String(flag || 'Normal');
            var bg = '#e9f9ee', fg = '#1a7a32';
            if (f.indexOf('High') !== -1 || f.indexOf('Low') !== -1) { bg = '#fff4e0'; fg = '#7a4500'; }
            if (f.indexOf('Critical') !== -1) { bg = '#ffebe9'; fg = '#8a1f1a'; }
            if (f === 'Normal' || f === 'N' || !flag) return '';
            var short = 'H';
            if (f.indexOf('Critical') !== -1) short = 'C';
            else if (f.indexOf('Low') !== -1) short = 'L';
            return '<span style="display:inline-block;background:' + bg + ';color:' + fg + ';font-weight:800;font-size:8px;padding:0 3px;border-radius:8px;margin-left:2px;">' + short + '</span>';
        }

        /* ── LOAD REAL SELECTED PATIENT (NO HARDCODED FALLBACK) ── */
        function loadPatientData() {
            var pts = readPatients();
            var found = null;

            // 1. URL param ?patient=
            try {
                var q = new URLSearchParams(window.location.search).get('patient');
                if (q) {
                    found = pts.find(function (p) { return String(p.id) === String(q) || String(p.mrn) === String(q); }) || null;
                }
            } catch (e) {}

            // 2. Doctor Dashboard snapshot (pclinic_lab_patient_data)
            if (!found) {
                try {
                    var snap = JSON.parse(localStorage.getItem('pclinic_lab_patient_data') || 'null');
                    if (snap && snap.id) {
                        found = pts.find(function (p) { return String(p.id) === String(snap.id); }) || snap;
                    }
                } catch (e) {}
            }

            // 3. Active patient id (pclinic_active_patient)
            if (!found) {
                try {
                    var aid = localStorage.getItem('pclinic_active_patient');
                    if (aid) {
                        found = pts.find(function (p) { return String(p.id) === String(aid) || String(p.mrn) === String(aid); }) || null;
                    }
                } catch (e) {}
            }

            // 4. Parent window (iframe in Doctor Dashboard)
            if (!found) {
                try {
                    if (window.parent && window.parent !== window && window.parent.currentPatient && window.parent.currentPatient.id) {
                        found = window.parent.currentPatient;
                    }
                } catch (e) {}
            }

            if (found && found.id) {
                currentPatient = found;
                updatePatientBanner(found);
                return true;
            }

            // ⛔ NO PATIENT → EMPTY STATE (never a hardcoded fallback patient)
            currentPatient = null;
            updatePatientBanner(null);
            return false;
        }

        /* ── MATCH A SAVED RESULT TO A REGISTER TEST ── */
        function findResultForTest(results, t) {
            if (!Array.isArray(results)) return null;
            for (var i = 0; i < results.length; i++) {
                var r = results[i];
                if (r && r.code && String(r.code) === String(t.code)) return r;
            }
            var tn = String(t.name).toLowerCase();
            for (var j = 0; j < results.length; j++) {
                var r2 = results[j];
                if (!r2) continue;
                var rn = String(r2.test || r2.name || '').toLowerCase();
                if (rn && (rn.indexOf(tn) !== -1 || tn.indexOf(rn) !== -1)) return r2;
            }
            return null;
        }

        function testIsOrdered(testsOrdered, t, cat) {
            if (!Array.isArray(testsOrdered)) return false;
            var tn = String(t.name).toLowerCase();
            var catId = cat ? cat.id : '';
            return testsOrdered.some(function (nm) {
                var n = String(nm || '').toLowerCase();
                if (!n) return false;
                if (n.indexOf(tn) !== -1 || tn.indexOf(n) !== -1) return true;
                // Category-level matches (e.g. order item "Urinalysis" covers all 60000 rows)
                if (catId === 'uri' && (n.indexOf('urinalysis') !== -1 || n.indexOf('urine') !== -1)) return true;
                if (catId === 'fbc' && (n.indexOf('cbc') !== -1 || n.indexOf('blood count') !== -1 || n.indexOf('fbc') !== -1 || n.indexOf('haemoglobin') !== -1)) return true;
                if (catId === 'chem' && (n.indexOf('chemistry') !== -1 || n.indexOf('renal') !== -1 || n.indexOf('liver') !== -1 || n.indexOf('rft') !== -1 || n.indexOf('lft') !== -1)) return true;
                if (catId === 'micro' && (n.indexOf('culture') !== -1 || n.indexOf('microbio') !== -1 || n.indexOf('malaria') !== -1 || n.indexOf('stool') !== -1)) return true;
                if (catId === 'sero' && (n.indexOf('serology') !== -1 || n.indexOf('hiv') !== -1 || n.indexOf('hepatitis') !== -1 || n.indexOf('crp') !== -1)) return true;
                return false;
            });
        }


        function padEmptyResultColumns() {
            var wrap = document.querySelector('.oc-matrix-wrapper');
            var table = document.getElementById('ocMatrixTable');
            var headRow = table && table.tHead && table.tHead.rows[0];
            if (!wrap || !table || !headRow) return;
            var COL = 150;
            var LEFT = 150 + 250;
            var used = 0;
            for (var i = 2; i < headRow.cells.length; i++) used++;
            var room = Math.max(0, wrap.clientWidth - LEFT);
            var need = Math.floor(room / COL);
            var extra = need - used;
            if (extra <= 0) return;
            for (var n = 0; n < extra; n++) {
                var th = document.createElement('th');
                th.className = 'oc-col-order-hdr oc-empty-col';
                th.innerHTML = '<div class="oc-col-order-date" style="opacity:.28">—</div>';
                headRow.appendChild(th);
            }
            var rows = table.tBodies[0] ? table.tBodies[0].rows : [];
            for (var r = 0; r < rows.length; r++) {
                for (var n2 = 0; n2 < extra; n2++) {
                    var td = document.createElement('td');
                    td.className = 'oc-res-cell oc-empty-col';
                    td.style.color = '#9ca3af';
                    td.style.opacity = '0.28';
                    td.textContent = '--';
                    rows[r].appendChild(td);
                }
            }
        }

        /* ── BUILD THE CUMULATIVE FLOW SHEET FROM REAL ORDERS & REAL RESULTS ONLY ── */
        function buildPClinicMatrix() {
            if (!currentPatient || !currentPatient.id) {
                renderEmptyState('🔒 No patient selected.<br><span style="font-size:11.5px;">This flow sheet shows ONLY the selected patient — choose a patient in the Doctor Dashboard.</span>');
                return;
            }

            var pidRaw = stripMod(currentPatient.id);

            // 1. Real lab orders for this patient from the Common Server
            var orders = [];
            try {
                orders = JSON.parse(localStorage.getItem('pclinic_orders') || '[]').filter(function (o) {
                    return stripMod(o.patientId) === pidRaw && (o.type === 'lab' || o.dept === 'lab') && String(o.status || '').toLowerCase() !== 'cancelled';
                });
            } catch (e) {}

            // 2. Build result sets: each real order = one column
            var sets = orders.map(function (o) {
                return {
                    kind: 'order',
                    id: String(o.id || ''),
                    date: o.completedAt || o.orderedAt || new Date().toISOString(),
                    status: o.status || 'pending',
                    results: Array.isArray(o.results) ? o.results : [],
                    testsOrdered: Array.isArray(o.items) ? o.items.reduce(function (acc, it) {
                        acc.push(it.name);
                        if (window.pcLabCatalog) {
                            var ex = window.pcLabCatalog.byCode(it.code) || window.pcLabCatalog.findByName(it.name);
                            if (ex && Array.isArray(ex.parameters)) {
                                ex.parameters.forEach(function (p) { acc.push(p.name); });
                            }
                        }
                        return acc;
                    }, []) : [],
                    verifiedBy: o.completedBy || ''
                };
            });

            // 3. Structured results saved on the patient record without a matching order
            var knownIds = orders.map(function (o) { return String(o.id); });
            var storedResults = Array.isArray(currentPatient.labResults) ? currentPatient.labResults : [];
            storedResults.forEach(function (r) {
                if (!r || !Array.isArray(r.tests) || !r.tests.length) return;
                if (r.orderId && knownIds.indexOf(String(r.orderId)) !== -1) return;
                sets.push({
                    kind: 'stored',
                    id: String(r.id || r.orderId || ''),
                    date: r.date || new Date().toISOString(),
                    status: 'completed',
                    results: r.tests,
                    testsOrdered: r.tests.map(function (t) { return t.test || t.name || ''; }),
                    verifiedBy: r.verifiedBy || ''
                });
            });

            sets.sort(function (a, b) { return new Date(a.date) - new Date(b.date); });

            if (!sets.length) {
                renderEmptyState('No laboratory orders yet for <strong>' + escapeHtml(patientName(currentPatient)) + '</strong>.<br>' +
                    '<span style="font-size:11.5px;">Create a Lab Request and the laboratory will publish verified results here.</span>');
                return;
            }

            // ═══ 2026-08-21 · GROUP-BY-DATE: one column per calendar day ═══
            // Every lab request made on the SAME date now shares ONE column.
            //
            // ── GROUP-BY-DAY HELPERS (unit-tested) ──
            function dayKeyOf(iso) {
                try {
                    var d = new Date(iso);
                    if (isNaN(d.getTime())) return 'unknown';
                    return d.getFullYear() + '-' + String(d.getMonth() + 101).slice(1) + '-' + String(d.getDate() + 100).slice(1);
                } catch (e) { return 'unknown'; }
            }

            function isVerifiedSet(s) {
                return s.status === 'completed' || s.status === 'Completed';
            }

            // sets are already sorted by date, so same-day sets are contiguous.
            function groupSetsByDay(sets) {
                var groups = [];
                sets.forEach(function (s) {
                    var key = dayKeyOf(s.date);
                    var g = groups[groups.length - 1];
                    if (!g || g.key !== key) {
                        g = { key: key, sets: [], verifiedCount: 0 };
                        groups.push(g);
                    }
                    g.sets.push(s);
                    if (isVerifiedSet(s)) g.verifiedCount++;
                });
                return groups;
            }

            // What one cell shows for a day-group:
            //   {kind:'result', r:latest verified result}
            // | {kind:'pending'} if any order asked for the test but none has a result yet
            // | {kind:'empty'}   if the test was never ordered that day
            function cellForGroup(g, t, cat) {
                var found = null, foundDate = null, orderedAny = false;
                g.sets.forEach(function (s) {
                    if (isVerifiedSet(s)) {
                        var r = findResultForTest(s.results, t);
                        if (r && (!found || new Date(s.date) >= new Date(foundDate))) {
                            found = r;
                            foundDate = s.date;
                        }
                    }
                    if (!orderedAny && testIsOrdered(s.testsOrdered, t, cat)) orderedAny = true;
                });
                if (found) return { kind: 'result', r: found };
                if (orderedAny) return { kind: 'pending' };
                return { kind: 'empty' };
            }
            // ── END GROUP-BY-DAY HELPERS ──

            var groups = groupSetsByDay(sets);
            // Newest exam date first (left); older dates follow to the right
            groups.reverse();

            // 4. Table header — ONE column per day
            var head = document.getElementById('matrixHead');
            var headHtml = '<tr>' +
                '<th style="width:60px;text-align:left;">Analysis</th>' +
                '<th style="width:112px;text-align:left;">Parameter</th>';
            groups.forEach(function (g) {
                var first = g.sets[0];
                var d = new Date(first.date);
                var dateStr = d.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });
                var chip;
                if (g.verifiedCount === g.sets.length) {
                    chip = '<span style="display:inline-block;background:#e9f9ee;color:#1a7a32;font-weight:800;font-size:8px;padding:1px 4px;border-radius:20px;margin-top:2px;">✓</span>';
                } else if (g.verifiedCount > 0) {
                    chip = '<span style="display:inline-block;background:#fff4e0;color:#7a4500;font-weight:800;font-size:8px;padding:1px 4px;border-radius:20px;margin-top:2px;">' + g.verifiedCount + '/' + g.sets.length + '</span>';
                } else {
                    chip = '<span style="display:inline-block;background:#fff4e0;color:#7a4500;font-weight:800;font-size:8px;padding:1px 4px;border-radius:20px;margin-top:2px;">…</span>';
                }
                headHtml += '<th class="oc-col-order-hdr">' +
                    '<div class="oc-col-order-date">' + dateStr + '</div>' +
                    chip + '</th>';
            });
            headHtml += '</tr>';
            head.innerHTML = headHtml;

            /*
            // ── PREVIOUS BEHAVIOUR (one column per order) — kept for quick revert ──
            // 4. Table header — one real order column per set
            var head = document.getElementById('matrixHead');
            var headHtml = '<tr>' +
                '<th style="width:60px;text-align:left;">Analysis</th>' +
                '<th style="width:112px;text-align:left;">Parameter</th>';
            sets.forEach(function (s) {
                var d = new Date(s.date);
                var dateStr = d.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });
                var timeStr = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
                var isVerified = s.status === 'completed' || s.status === 'Completed';
                var statusChip = isVerified
                    ? '<span style="display:inline-block;background:#e9f9ee;color:#1a7a32;font-weight:800;font-size:10px;padding:2px 8px;border-radius:20px;margin-top:4px;">✓ Verified</span>'
                    : '<span style="display:inline-block;background:#fff4e0;color:#7a4500;font-weight:800;font-size:10px;padding:2px 8px;border-radius:20px;margin-top:4px;">⏳ Pending</span>';
                headHtml += '<th class="oc-col-order-hdr">' +
                    '<div class="oc-col-order-date">' + dateStr + ' ' + timeStr + '</div>' +

                    '<div class="oc-col-links">' +
                        '<span class="oc-col-link" onclick="showToast(&quot;📄 Lab results report #' + escapeHtml(String(s.id).replace(/[^0-9]/g, '').slice(0, 7)) + '&quot;, &quot;info&quot;)"><i class="ti ti-file-text"></i> Lab.results</span>' +
                        '<span class="oc-col-link" onclick="showToast(&quot;📋 Order #' + escapeHtml(String(s.id).replace(/[^0-9]/g, '').slice(0, 7)) + '&quot;, &quot;info&quot;)"><i class="ti ti-clipboard-list"></i> Order</span>' +
                    '</div>' + statusChip + '</th>';
            });
            headHtml += '</tr>';
            head.innerHTML = headHtml;
            */

            // 5. Table body — recently requested / resulted tests first
            var body = document.getElementById('matrixBody');
            var bodyHtml = '';
            var rowCount = 0;

            function testActivityScore(t, cat) {
                var score = 0;
                for (var gi = 0; gi < groups.length; gi++) {
                    var cell = cellForGroup(groups[gi], t, cat);
                    var recency = groups.length - gi; // newer columns (left) weigh more
                    if (cell.kind === 'result') score = Math.max(score, 1000 + recency * 10);
                    else if (cell.kind === 'pending') score = Math.max(score, 500 + recency * 10);
                }
                return score;
            }

            var catsOrdered = OC_CATEGORIES.map(function (cat) {
                var tests = cat.tests.slice().sort(function (a, b) {
                    return testActivityScore(b, cat) - testActivityScore(a, cat);
                });
                var catScore = 0;
                tests.forEach(function (t) { catScore = Math.max(catScore, testActivityScore(t, cat)); });
                return { cat: cat, tests: tests, score: catScore };
            }).sort(function (a, b) { return b.score - a.score; });

            catsOrdered.forEach(function (pack) {
                var cat = pack.cat;
                var totalTests = pack.tests.length;
                pack.tests.forEach(function (t, idx) {
                    var rowClass = (rowCount % 2 === 0) ? 'row-even' : 'row-odd';
                    rowCount++;
                    bodyHtml += '<tr class="' + rowClass + '">';

                    if (idx === 0) {
                        bodyHtml += '<td class="oc-cat-cell ' + cat.className + '" rowspan="' + totalTests + '">' + cat.title + '</td>';

                    var unitStr = t.unit ? ' (' + t.unit + ')' : '';
                    var rangeStr = t.range ? ' [' + t.range + ']' : '';
                    bodyHtml += '<td class="oc-test-cell">' +
                        '<span class="oc-test-code">' + t.code + '</span>' +
                        '<span>' + t.name + unitStr + '</span>' +
                        '<span class="oc-test-range">' + rangeStr + '</span></td>';

                    groups.forEach(function (g) {
                        var cell = cellForGroup(g, t, cat);
                        if (cell.kind === 'result') {
                            var r = cell.r;
                            var val = r.value != null && r.value !== '' ? r.value : '—';
                            bodyHtml += '<td class="oc-res-cell"><span style="font-weight:800;">' + escapeHtml(val) + '</span>' +
                                flagBadge(r.flag) + '</td>';
                        } else if (cell.kind === 'pending') {
                            bodyHtml += '<td class="oc-res-cell"><span class="oc-pending-badge">…</span></td>';
                        } else {
                            bodyHtml += '<td class="oc-res-cell" style="color:#9ca3af;opacity:0.35;">--</td>';
                        }
                    });

                    /*
                    // ── PREVIOUS BEHAVIOUR (one column per order) — kept for quick revert ──
                    sets.forEach(function (s) {

                    */

                    bodyHtml += '</tr>';

            body.innerHTML = bodyHtml;

        /* ── MICROBIOLOGY CULTURE & SENSITIVITY — REAL LAB REPORT IN DOCTOR VIEW ── */
        function buildCandSCard(r) {
            var atbRows = (Array.isArray(r.antibiotics) ? r.antibiotics : []).map(function (a, i) {
                var atbName = Array.isArray(a) ? (a[1] || a[0] || 'Antibiotic') : (a.name || a.antibiotic || 'Antibiotic');
                var sens = Array.isArray(a) ? (a[2] || 'Sensitive') : (a.sensitivity || 'Sensitive');
                var sLow = String(sens).toLowerCase();
                var fg = sLow === 'resistant' ? '#8a1f1a' : (sLow === 'intermediate' ? '#7a4500' : '#1a7a32');
                return '<tr>' +
                    '<td style="padding:7px 12px;border:0.5px solid #d8d8dc;font-weight:700;">' + (i + 1) + '</td>' +

                    '</tr>';
            }).join('');

            var repDate = r.date ? new Date(r.date).toLocaleDateString('en-GB') : '—';
            var collDate = r.collectedAt ? new Date(r.collectedAt).toLocaleDateString('en-GB') : repDate;

            return '<div style="background:#fff;border:1px solid var(--bd);border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:var(--shadow);">' +
                '<div style="text-align:center;border-bottom:2px solid #1d1d1f;padding-bottom:12px;margin-bottom:16px;">' +

                '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;font-size:12.5px;color:#3a3a3c;margin-bottom:16px;">' +

                    '<div><strong>Patient:</strong> ' + escapeHtml(patientName(currentPatient)) + ' • MRN ' + escapeHtml(currentPatient.mrn || stripMod(currentPatient.id)) + '</div>' +
                '</div>' +
                '<table style="width:100%;border-collapse:collapse;font-size:12px;">' +
                    '<thead><tr style="background:#f5f5f7;">' +
                        '<th style="padding:8px 12px;border:0.5px solid #d8d8dc;text-align:left;width:10%;">S. No.</th>' +
                        '<th style="padding:8px 12px;border:0.5px solid #d8d8dc;text-align:left;">Antibiotic</th>' +
                        '<th style="padding:8px 12px;border:0.5px solid #d8d8dc;width:24%;">Sensitivity</th>' +
                    '</tr></thead><tbody>' + atbRows + '</tbody></table>' +
                '<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:16px;border-top:1px solid #d8d8dc;padding-top:12px;font-size:11.5px;color:#3a3a3c;">' +
                    '<div><strong>Verifying Senior MLT:</strong> ' + escapeHtml(r.verifiedBy || 'PClinic MOD Laboratory') + '</div>' +
                    '<div style="border:1.5px solid #1d1d1f;padding:6px 14px;border-radius:6px;font-weight:800;font-size:10.5px;letter-spacing:0.5px;">MOD / PCLINIC VERIFIED</div>' +
                '</div>' +
            '</div>';
        }

        function buildMicrobiologyReports() {
            var box = document.getElementById('microReports');
            if (!box) return;
            if (!currentPatient) { box.style.display = 'none'; box.innerHTML = ''; return; }

            var entries = [];
            (Array.isArray(currentPatient.labResults) ? currentPatient.labResults : []).forEach(function (r) {
                if (r && Array.isArray(r.antibiotics) && r.antibiotics.length) entries.push(r);
            });
            try {
                var orders = JSON.parse(localStorage.getItem('pclinic_orders') || '[]');
                orders.forEach(function (o) {
                    if (o && stripMod(o.patientId) === stripMod(currentPatient.id) && o.microbiology &&
                        Array.isArray(o.microbiology.antibiotics) && o.microbiology.antibiotics.length) {
                        entries.push(o.microbiology);
                    }
                });
            } catch (e) {}

            if (!entries.length) { box.style.display = 'none'; box.innerHTML = ''; return; }
            box.style.display = 'block';
            box.innerHTML = '<div style="font-size:14px;font-weight:800;color:#1d1d1f;margin:20px 0 12px;">🧫 Microbiology — Culture &amp; Sensitivity Reports</div>' +
                entries.map(buildCandSCard).join('');
        }

        /* ── INITIALIZE ── */
        function showSharedPatientBar(p) {
            try {
                if (!window.pcFile || typeof window.pcFile.renderDemoBar !== 'function') return;
                var master = document.getElementById('pcMasterHeader');
                if (!master) {
                    master = document.createElement('div');
                    master.id = 'pcMasterHeader';
                    master.className = 'pc-master-header';
                    document.body.insertBefore(master, document.body.firstChild);
                }
                window.pcFile.renderDemoBar(master, p || currentPatient || {});
            } catch (e) { console.warn('showSharedPatientBar', e); }
        }

        function init() {
            loadDarkMode();
            var ok = loadPatientData();
            showSharedPatientBar(currentPatient);
            if (ok) {
                buildPClinicMatrix();
                buildMicrobiologyReports();
            } else {
                renderEmptyState('🔒 No patient selected.<br><span style="font-size:11.5px;">This flow sheet shows ONLY the selected patient — choose a patient in the Doctor Dashboard.</span>');
                var box = document.getElementById('microReports');
                if (box) { box.style.display = 'none'; box.innerHTML = ''; }
            }
        }

        function loadDarkMode() {
            var isDark = localStorage.getItem('pclinic-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            document.body.classList.toggle('dark-mode', isDark);
        }

        function showToast(msg, type) {
            var c = document.getElementById('toastContainer');
            var t = document.createElement('div');
            t.className = 'toast';
            t.style.background = type === 'success' ? '#059669' : type === 'error' ? '#ef4444' : '#1a1a2e';
            t.textContent = msg;
            c.appendChild(t);
            setTimeout(function () { t.remove(); }, 3000);
        }

        /* ── CLOSE AND NAVIGATE ── */
        function closeLabResultsPage() {
            try {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'CLOSE_LAB_RESULTS' }, window.location.origin);
                    return;
                }
            } catch (e) {}
            window.location.href = 'doctor-dashboard.html';
        }

        window.pcToggleTheme = function () {
            var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            var next = isDark ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            document.body.classList.toggle('dark-mode', next);
            localStorage.setItem('pclinic-theme', next);
        };

        /* ── DOCTOR DASHBOARD LIVE SYNC ── */
        window.addEventListener('DOMContentLoaded', function () {
            requireAuth(['doctor','lab','nurse']).then(init).catch(function () {});
        });

        window.addEventListener('message', function (e) {
            if (e.origin !== window.location.origin) return;
            if (window.parent !== window && e.source !== window.parent) return;
            if (e.data && e.data.type === 'LOAD_PATIENT' && e.data.patient && e.data.patient.id) {
                var pts = readPatients();
                var p = pts.find(function (x) { return String(x.id) === String(e.data.patient.id); }) || e.data.patient;
                currentPatient = p;
                updatePatientBanner(p);
                showSharedPatientBar(p);
                buildPClinicMatrix();
                buildMicrobiologyReports();
            }
        });

        function refreshFlowSheet() {
            loadPatientData();
            showSharedPatientBar(currentPatient);
            if (currentPatient && currentPatient.id) {
                buildPClinicMatrix();
                buildMicrobiologyReports();
            }
        }

        function labSheetFingerprint() {
            var pid = currentPatient && currentPatient.id ? stripMod(currentPatient.id) : '';
            var orders = '';
            try { orders = localStorage.getItem('pclinic_orders') || ''; } catch (e) {}
            var labs = '';
            try {
                labs = currentPatient && currentPatient.labResults
                    ? JSON.stringify(currentPatient.labResults)
                    : (localStorage.getItem('pclinic_patients') || '');
            } catch (e2) {}
            return pid + '|' + orders.length + ':' + orders.slice(-80) + '|' + labs.length + ':' + labs.slice(-80);
        }

        var lastPrint = '';
        function autoPromoteRecentLabs() {
            try {
                var fp = labSheetFingerprint();
                if (fp === lastPrint) return;
                lastPrint = fp;
                refreshFlowSheet();
            } catch (e) {}
        }

        window.addEventListener('storage', refreshFlowSheet);
        window.addEventListener('labResultsUpdated', refreshFlowSheet);
        window.addEventListener('ordersUpdated', refreshFlowSheet);
        window.addEventListener('pcPatientChanged', refreshFlowSheet);
        window.addEventListener('patientsUpdated', refreshFlowSheet);
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) autoPromoteRecentLabs();
        });
        window.addEventListener('focus', autoPromoteRecentLabs);
        setInterval(autoPromoteRecentLabs, 4000);

        window.closeLabResultsPage = closeLabResultsPage;
        window.buildPClinicMatrix = buildPClinicMatrix;
        window.buildMicrobiologyReports = buildMicrobiologyReports;
    })();
    </script>
</body>
</html>
