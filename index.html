<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PClinic - Choose Your App</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #1a1a2e;
            font-size: 28px;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .btn {
            display: block;
            padding: 16px 24px;
            margin: 12px 0;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            text-align: center;
        }
        .btn-android {
            background: #007AFF;
            color: white;
        }
        .btn-android:hover {
            background: #0066dd;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0,122,255,0.3);
        }
        .btn-hospital {
            background: #22c55e;
            color: white;
        }
        .btn-hospital:hover {
            background: #16a34a;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(34,197,94,0.3);
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏥 PClinic</h1>
        <p class="subtitle">Choose your app</p>
        
        <a href="/android/" class="btn btn-android">📱 Android App</a>
        <a href="/hospital/" class="btn btn-hospital">🏥 Hospital Web App</a>
        
        <p class="footer">Select the app you want to use</p>
    </div>
</body>
</html>
