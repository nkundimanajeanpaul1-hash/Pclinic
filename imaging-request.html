<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PClinic — Imaging Request</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="pclinic-ui.css?v=20260804_CHUK_3ROW">
<link rel="stylesheet" href="pclinic-file.css">
<link rel="preload" as="style" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css"></noscript>
<script>(function(){try{document.documentElement.setAttribute('data-theme',localStorage.getItem('pclinic-theme')||'light');}catch(e){}})();</script>
<style>
/* ── Modality grid: pick a category first, then the exam ── */
.mod-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(122px,1fr)); gap:9px; }
.mod-card {
    padding:13px 11px; border-radius:13px; cursor:pointer; text-align:center;
    border:.5px solid rgba(0,0,0,.08); background:var(--s1);
    box-shadow:0 1px 3px rgba(0,0,0,.05);
    transition:transform .26s var(--spring), box-shadow .26s, border-color .2s;
}
.mod-card:hover { transform:translateY(-3px); box-shadow:0 7px 20px rgba(0,0,0,.13); }
.mod-card:active { transform:scale(.96); transition-duration:.08s; }
.mod-card.on { border-color:var(--ac); background:var(--acb); box-shadow:0 0 0 3px var(--acl); }
.mod-card i { font-size:23px; color:var(--ac); display:block; margin-bottom:6px; }
.mod-card b { font-size:12px; display:block; }
.mod-card span { font-size:10px; color:var(--tm); display:block; margin-top:2px; }
.mod-card .pr { font-size:10px; font-weight:700; color:var(--greend); margin-top:3px; display:block; }

.ex-list { max-height:236px; overflow-y:auto; border:.5px solid rgba(0,0,0,.09);
    border-radius:11px; background:var(--s1); }
.ex-item { display:flex; align-items:center; gap:9px; padding:8px 11px; cursor:pointer;
    font-size:12.5px; border-bottom:.5px solid rgba(0,0,0,.05); transition:background .16s; }
.ex-item:last-child { border-bottom:0; }
.ex-item:hover { background:var(--acb); }
.ex-item input { width:auto; flex-shrink:0; }
.ex-item .pr { margin-left:auto; font-size:10.5px; font-weight:700; color:var(--tm); white-space:nowrap; }
.ex-item.add { color:var(--green); font-weight:700; }

.sel-row { display:flex; align-items:center; gap:9px; padding:8px 11px; border-radius:10px;
    background:var(--s3); font-size:12.5px; margin-bottom:6px; }
.sel-row .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sel-row .pr { font-weight:700; white-space:nowrap; }
.sel-row button { border:0; background:none; color:var(--red); cursor:pointer; font-size:15px; }

.tot { display:flex; align-items:center; justify-content:space-between; padding:11px 13px;
    border-radius:12px; background:var(--greenb); border:.5px solid rgba(52,199,89,.28); margin-top:9px; }
.tot .l { font-size:11.5px; font-weight:700; color:var(--greend); text-transform:uppercase; letter-spacing:.04em; }
.tot .v { font-size:18px; font-weight:800; color:var(--greend); }
</style>
</head>
<body class="pcf">

<div class="pc-topbar noprint" style="display: none !important;">
    <div class="pc-brand">
        <img class="pc-logo" src="logo-wide.png" alt="PClinic" width="118" height="30">
        <span class="pc-appsub">Imaging Request</span>
    </div>
    <div class="pc-tr">
        <a href="imaging-results.html?v=20260828_RESULTS" class="pc-btn" style="text-decoration:none;" title="Open PACS DXViewer"><i class="ti ti-photo-scan"></i> DXViewer</a>
        <a href="radio-dashboard.html" class="pc-btn" style="text-decoration:none;" title="Radiology Department"><i class="ti ti-layout-dashboard"></i> Radiology</a>
        <a href="doctor-dashboard.html" class="pc-btn" style="text-decoration:none;" title="Doctor Console"><i class="ti ti-user-check"></i> Doctor</a>
        <button class="pc-iconbtn" onclick="pcToggleTheme()" title="Dark mode"><i class="ti ti-moon" id="themeIcon"></i></button>
        <div class="pc-chip"><span class="pc-avatar" id="userAvatar">··</span><span id="userName">…</span></div>
        <button class="pc-iconbtn" onclick="pclinicLogout()" title="Sign out"><i class="ti ti-logout"></i></button>
    </div>
</div>

<div class="pcf-wrap">
  <div id="pcfRoot" style="flex:1;min-height:0;display:flex;flex-direction:column">

    <!-- HISTORY -->
    <div id="viewHistory">
        <div class="pcf-panel">
            <h2><i class="ti ti-history"></i> Previous imaging requests
                <span class="count" id="histCount">0</span></h2>
            <div class="pcf-hist" id="histList"></div>
        </div>
        <div style="margin-top:11px">
            <button class="pcf-btn primary full" id="btnNew">
                <i class="ti ti-plus"></i> New Imaging Request</button>
        </div>
    </div>

    <!-- REQUEST -->
    <div id="viewFile" style="display:none;flex:1;min-height:0;flex-direction:column;gap:9px">
        <div class="pcf-cmd noprint">
            <button class="pcf-btn sm" id="btnBack"><i class="ti ti-arrow-left"></i> History</button>
            <b class="mode" id="fileMode"></b>
            <span class="spacer"></span>
            <button class="pcf-btn sm" id="btnPrint"><i class="ti ti-printer"></i> Print</button>
            <button class="pcf-btn sm primary" id="saveBtn"><i class="ti ti-send"></i> Send &amp; Bill</button>
        </div>

        <div class="pcf-grid wide" id="fileGrid">
            <div class="pcf-pane noprint" id="workPane">
                <div class="pcf-panel">
                    <h2><i class="ti ti-category"></i> 1 · Choose the type of imaging</h2>
                    <div class="mod-grid" id="modGrid"></div>
                </div>

                <div class="pcf-panel" id="examPanel" style="display:none">
                    <h2><i class="ti ti-list-check"></i> 2 · Choose the exam
                        <span class="count" id="examCount">0</span></h2>
                    <input class="pcf-in" id="examSearch" placeholder="Filter exams…" autocomplete="off">
                    <div class="ex-list" id="examList" style="margin-top:7px"></div>
                    <div id="selBox" style="margin-top:10px"></div>
                    <div class="tot" id="totBox" style="display:none">
                        <span class="l">Total to bill</span><span class="v" id="totVal">RWF 0</span>
                    </div>
                </div>

                <div class="pcf-panel" id="reasonPanel" style="display:none">
                    <h2><i class="ti ti-clipboard-text"></i> 3 · Reason for the request</h2>
                    <label class="pcf-lbl" for="reason">Clinical indication *</label>
                    <textarea id="reason" placeholder="Why is this scan needed? What are you looking for?"></textarea>
                    <div class="pcf-two">
                        <div><label class="pcf-lbl" for="priority">Priority</label>
                            <select class="pcf-in" id="priority">
                                <option value="routine">Routine</option>
                                <option value="urgent">Urgent</option>
                                <option value="stat">STAT — immediately</option>
                            </select></div>
                        <div><label class="pcf-lbl" for="clinInfo">Relevant history</label>
                            <input class="pcf-in" id="clinInfo" placeholder="Trauma, known mass, post-op…"></div>
                    </div>
                </div>
            </div>
            <div class="pcf-pane"><div class="pcf-doc" id="doc"></div></div>
        </div>
    </div>

  </div>
</div>

<div class="pc-toasts noprint"></div>

<script type="module" src="firebase-config.js"></script>
<script src="auth-guard.js"></script>
<script src="pclinic-state.js"></script>
<script src="patient-data.js"></script>
<script src="pclinic-orders.js"></script>
<script src="pclinic-catalog.js"></script>
<script src="pclinic-file.js?v=20260827_FILES"></script>
<script src="pclinic-vitals.js"></script>

<script>
(function () {
'use strict';
var P = null, modId = null, chosen = [], viewing = null;
function esc(v){var d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML;}
function $(s){return document.querySelector(s);}
function money(n){return 'RWF ' + (Number(n)||0).toLocaleString('en-US');}
function val(id){var e=document.getElementById(id);return e?e.value.trim():'';}
function longDate(d){return new Date(d).toLocaleDateString('en-GB',
    {weekday:'long',day:'numeric',month:'long',year:'numeric'});}

/* ── HISTORY ── */
function renderHistory(){
    var list = pcFile.list(P.id,'imaging');
    $('#histCount').textContent = list.length + ' request' + (list.length===1?'':'s');
    var box = $('#histList');
    if(!list.length){
        box.innerHTML = '<div class="pcf-empty"><i class="ti ti-radioactive"></i>' +
            'No imaging requested yet.<br><span style="font-size:11px">Start the first one below.</span></div>';
        return;
    }
    box.innerHTML = list.map(function(f,i){
        var d = new Date(f.at);
        var names = (f.exams||[]).map(function(e){return e.name;}).join(', ');
        return '<div class="pcf-hrow" data-i="'+i+'">' +
            '<div class="date"><div class="d">'+d.getDate()+'</div>' +
            '<div class="m">'+d.toLocaleDateString('en-GB',{month:'short'})+'</div></div>' +
            '<div class="meat"><b>'+esc(f.modalityLabel||'Imaging')+'</b><span>'+esc(names||'—')+'</span></div>' +
            '<div class="by">'+esc(f.by||'')+'<br>'+money(f.total||0)+'</div>' +
            '<i class="ti ti-chevron-right" style="color:#c7c7cc"></i></div>';
    }).join('');
    box.querySelectorAll('.pcf-hrow').forEach(function(r){
        r.onclick=function(){openFile(list[+r.dataset.i]);};
    });
}

function show(on){
    $('#viewHistory').style.display = on?'none':'';
    $('#viewFile').style.display = on?'flex':'none';
}
function openFile(f){
    viewing=f; show(true);
    $('#fileMode').textContent='Viewing '+longDate(f.at);
    $('#saveBtn').style.display='none';
    $('#workPane').style.display='none';
    $('#fileGrid').classList.remove('wide');
    $('#fileGrid').classList.add('single');
    paintDoc(f);
}
window.newRequest=function(){
    viewing=null; modId=null; chosen=[]; show(true);
    $('#fileMode').textContent='New imaging request — '+longDate(new Date());
    $('#saveBtn').style.display='';
    $('#workPane').style.display='';
    $('#fileGrid').classList.add('wide');
    $('#fileGrid').classList.remove('single');
    $('#examPanel').style.display='none';
    $('#reasonPanel').style.display='none';
    ['reason','clinInfo'].forEach(function(i){var e=document.getElementById(i);if(e)e.value='';});
    paintMods(); paintDoc();
};

/* ── 1. MODALITY ── */
function paintMods(){
    var mods = pcCatalog.modalities();
    $('#modGrid').innerHTML = mods.map(function(m){
        return '<div class="mod-card'+(m.id===modId?' on':'')+'" data-m="'+esc(m.id)+'">' +
            '<i class="ti '+esc(m.icon)+'"></i><b>'+esc(m.label)+'</b>' +
            '<span>'+m.exams.length+' exams</span>' +
            (m.price?'<span class="pr">'+money(m.price)+'</span>':'') +
            '</div>';
    }).join('');
    $('#modGrid').querySelectorAll('.mod-card').forEach(function(c){
        c.onclick=function(){
            modId=c.dataset.m; chosen=[];
            paintMods(); paintExams(''); paintSel();
            $('#examPanel').style.display='';
            $('#reasonPanel').style.display='';
            var s=$('#examSearch'); if(s){s.value='';s.focus();}
            paintDoc();
        };
    });
}

/* ── 2. EXAMS within that modality ── */
function paintExams(q){
    var m = pcCatalog.modality(modId); if(!m) return;
    q = (q||'').toLowerCase().trim();
    var list = m.exams.filter(function(e){return !q || e.toLowerCase().indexOf(q)!==-1;});
    $('#examCount').textContent = list.length + ' of ' + m.exams.length;
    var html = list.map(function(e){
        var on = chosen.some(function(c){return c.name===e;});
        return '<label class="ex-item"><input type="checkbox" data-e="'+esc(e)+'"'+(on?' checked':'')+'>' +
               '<span>'+esc(e)+'</span><span class="pr">'+money(m.price)+'</span></label>';
    }).join('');
    if(q && !m.exams.some(function(e){return e.toLowerCase()===q;})){
        html += '<div class="ex-item add" data-add="1"><i class="ti ti-plus"></i>' +
                'Add “'+esc(val('examSearch'))+'” to the '+esc(m.label)+' list</div>';
    }
    $('#examList').innerHTML = html || '<div class="pcf-empty" style="padding:18px">No match</div>';
    $('#examList').querySelectorAll('input[data-e]').forEach(function(cb){
        cb.onchange=function(){
            var n=cb.dataset.e;
            if(cb.checked){ if(!chosen.some(function(c){return c.name===n;}))
                chosen.push({name:n, price:m.price, code:pcCatalog.examCode(m.id,n)}); }
            else chosen = chosen.filter(function(c){return c.name!==n;});
            paintSel(); paintDoc();
        };
    });
    var add=$('#examList .ex-item.add');
    if(add) add.onclick=function(){
        var raw=val('examSearch'); if(!raw) return;
        pcCatalog.addExam(modId, raw);
        chosen.push({name:raw, price:m.price, code:pcCatalog.examCode(modId,raw)});
        pcToast('“'+raw+'” added to '+m.label+' for everyone','success');
        $('#examSearch').value=''; paintExams(''); paintSel(); paintDoc();
    };
}

function paintSel(){
    var box=$('#selBox');
    box.innerHTML = chosen.map(function(c,i){
        return '<div class="sel-row"><i class="ti ti-checkbox" style="color:var(--ac)"></i>' +
            '<span class="nm">'+esc(c.name)+'</span>' +
            '<span class="pr">'+money(c.price)+'</span>' +
            '<button data-i="'+i+'" title="Remove">&times;</button></div>';
    }).join('');
    box.querySelectorAll('button').forEach(function(b){
        b.onclick=function(){chosen.splice(+b.dataset.i,1);paintExams(val('examSearch'));paintSel();paintDoc();};
    });
    var total = chosen.reduce(function(s,c){return s+c.price;},0);
    $('#totBox').style.display = chosen.length?'flex':'none';
    $('#totVal').textContent = money(total);
}

/* ── DOCUMENT ── */
function gather(){
    if(viewing) return viewing;
    var m = pcCatalog.modality(modId);
    return {
        type:'imaging', patientId:P.id, patientName:pcFile.nameOf(P),
        title:'Imaging Request',
        modality: modId, modalityLabel: m?m.label:'',
        exams: chosen.slice(),
        total: chosen.reduce(function(s,c){return s+c.price;},0),
        reason: val('reason'), clinInfo: val('clinInfo'),
        priority: val('priority')||'routine',
        at:new Date().toISOString(), by:pcFile.staff().name||'',
        summary: chosen.map(function(c){return c.name;}).join(', ')
    };
}

function paintDoc(f){
    f = f || gather();
    var d = new Date(f.at);
    var rows = (f.exams||[]).map(function(e,i){
        return '<tr><td style="padding:5px 0">'+(i+1)+'. '+esc(e.name)+'</td>' +
               '<td style="text-align:right;padding:5px 0;white-space:nowrap">'+money(e.price)+'</td></tr>';
    }).join('');
    $('#doc').innerHTML =
    '<div class="dh"><div><div class="org">PClinic</div>' +
      '<div class="sub">Hospital Management System<br>Kigali, Rwanda<br>+250 784 446 481</div></div>' +
      '<div class="meta"><div><b>IMG-'+esc(P.id)+'-'+d.getFullYear()+'</b></div>' +
      '<div>'+d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})+'</div>' +
      '<div>'+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+'</div></div></div>' +
    '<div class="dtitle">Imaging Request</div>' +
    '<div class="pinfo">' +
      '<div><span>Patient</span><b>'+esc(pcFile.nameOf(P))+'</b></div>' +
      '<div><span>File no.</span>'+esc(P.mrn||('ID '+P.id))+'</div>' +
      '<div><span>Age / Sex</span>'+esc(pcFile.age(P.dob))+(P.gender?' · '+esc(P.gender):'')+'</div>' +
      '<div><span>Modality</span>'+esc(f.modalityLabel||'—')+'</div>' +
      '<div><span>Priority</span>'+esc((f.priority||'routine').toUpperCase())+'</div>' +
      '<div><span>Requested by</span>'+esc(f.by||pcFile.staff().name||'')+'</div>' +
    '</div>' +
    (rows ? '<div class="sec"><h4>Examinations requested</h4>' +
        '<table style="width:100%;font-size:12px;border-collapse:collapse">'+rows +
        '<tr><td style="padding-top:8px;border-top:1px solid #ddd;font-weight:800">Total</td>' +
        '<td style="padding-top:8px;border-top:1px solid #ddd;text-align:right;font-weight:800">' +
        money(f.total)+'</td></tr></table></div>'
      : '<div class="sec"><p class="none">No examination chosen yet.</p></div>') +
    (f.reason?'<div class="sec"><h4>Clinical indication</h4><p>'+esc(f.reason)+'</p></div>':'') +
    (f.clinInfo?'<div class="sec"><h4>Relevant history</h4><p>'+esc(f.clinInfo)+'</p></div>':'') +
    '<div class="sig"><div>Radiographer</div><div>'+esc(f.by||pcFile.staff().name||'') +
      '<br>Requesting Physician</div></div>' +
    '<div class="stamp">PClinic · generated '+new Date().toLocaleString('en-GB')+'</div>';
}

/* ── SAVE: order → radiology board, bill → cashier ── */
window.sendRequest=function(){
    if(!modId){pcToast('Choose the type of imaging first','error');return;}
    if(!chosen.length){pcToast('Choose at least one exam','error');return;}
    if(!val('reason')){pcToast('A clinical indication is required','error');return;}
    var rec = gather();

    // The order reaches the radiology worklist; bill:true (the default)
    // raises the bill so the cashier sees it with the money immediately.
    var order = pcOrders.create({
        patientId: P.id, patientName: pcFile.nameOf(P),
        type: 'imaging', priority: rec.priority,
        notes: rec.reason + (rec.clinInfo?' · '+rec.clinInfo:''),
        items: chosen.map(function(c){
            return { code:c.code, name:c.name, qty:1, price:c.price }; })
    });
    rec.orderId = order ? order.id : null;
    rec.billId  = order ? order.billId : null;
    pcFile.save(rec);
    pcToast('Sent to radiology · ' + money(rec.total) + ' billed to the cashier','success');
    setTimeout(function(){
        show(false); renderHistory();
    },500);
};

/* ── INIT ── */
document.addEventListener('input',function(e){
    if(e.target.id==='examSearch'){paintExams(e.target.value);return;}
    if(e.target.closest('#viewFile')&&!viewing)paintDoc();
});
$('#btnNew').onclick=window.newRequest;
$('#btnBack').onclick=function(){viewing=null;show(false);renderHistory();};
$('#saveBtn').onclick=window.sendRequest;
$('#btnPrint').onclick=function(){pcFile.print('#doc','Imaging Request — '+pcFile.nameOf(P));};

requireAuth(['doctor']).then(function(s){
    window.currentStaff=s;
    $('#userName').textContent=s.name;
    $('#userAvatar').textContent=(s.name||'??').substring(0,2).toUpperCase();
    // Records from other computers only arrive asynchronously from the common
    // server, so the history must repaint when the download lands — otherwise
    // a second machine opens this page and correctly shows "No imaging
    // requested yet" even though the request exists in Firestore.
    window.addEventListener('pcFilesUpdated', function(){ if(P) renderHistory(); });

    var tries=0;
    (function wait(){
        P=pcFile.patient();
        if(P){pcFile.listenFiles(P.id); renderHistory(); return;}
        if(++tries<20)return setTimeout(wait,200);
        $('#pcfRoot').innerHTML='<div class="pcf-panel"><div class="pcf-empty">' +
            '<i class="ti ti-user-off"></i>No patient selected.<br>' +
            '<a href="doctor-dashboard.html" class="pcf-btn" style="margin-top:14px;text-decoration:none">' +
            '<i class="ti ti-layout-dashboard"></i> Go to the dashboard</a></div></div>';
    })();
}).catch(function(){});
})();
</script>
<script src="pclinic-handoff.js"></script>
</body>
</html>
