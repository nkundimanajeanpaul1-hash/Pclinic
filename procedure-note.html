<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <link rel="preload" as="image" href="hub-bg.jpg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PClinic — Procedure Note</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="pclinic-ui.css?v=20260804_CHUK_3ROW">
<link rel="stylesheet" href="pclinic-file.css">
<link rel="preload" as="style" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css"></noscript>
<script>(function(){try{document.documentElement.setAttribute('data-theme',localStorage.getItem('pclinic-theme')||'light');}catch(e){}})();</script>
</head>
<body class="pcf">

<div class="pc-topbar noprint" style="display: none !important;">
    <div class="pc-brand">
        <img class="pc-logo" src="logo-wide.png" alt="PClinic" width="118" height="30">
        <span class="pc-appsub" id="appSub">Procedure</span>
    </div>
    <div class="pc-tr">
        <button class="pc-iconbtn" onclick="pcToggleTheme()" title="Dark mode"><i class="ti ti-moon" id="themeIcon"></i></button>
        <div class="pc-chip"><span class="pc-avatar" id="userAvatar">··</span><span id="userName">…</span></div>
        <button class="pc-iconbtn" onclick="pclinicLogout()" title="Sign out"><i class="ti ti-logout"></i></button>
    </div>
</div>

<div class="pcf-wrap">
    <div id="pcfRoot" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>
</div>

<div class="pc-toasts noprint"></div>

<script type="module" src="firebase-config.js"></script>
<script src="auth-guard.js"></script>
<script src="pclinic-state.js"></script>
<script src="patient-data.js"></script>
<script src="pclinic-orders.js"></script>
<script src="pclinic-catalog.js"></script>
<script src="pclinic-file.js?v=20260827_FILES"></script>
<script src="pclinic-vitals.js"></script>
<script src="pclinic-filepage.js?v=20260827_FILES"></script>
<script>
pcFilePage.init({
  "type": "procedure",
  "ref": "PR",
  "title": "Procedure Note",
  "sub": "Procedure",
  "docTitle": "Procedure Note",
  "icon": "ti-stethoscope",
  "histTitle": "Previous procedures",
  "histUnit": "procedure",
  "newLabel": "New Procedure Note",
  "dx": false,
  "rdv": true,
  "att": true,
  "vitals": false,
  "rx": false,
  "fields": [
    {
      "id": "proc",
      "label": "Procedure",
      "ph": "e.g. Lumbar puncture",
      "panel": "Procedure",
      "icon": "ti-stethoscope"
    },
    {
      "id": "ind",
      "label": "Indication",
      "ph": "Why it was done",
      "panel": "Procedure"
    },
    {
      "id": "consent",
      "label": "Consent obtained",
      "kind": "sel",
      "panel": "Procedure",
      "options": [
        "Yes — written",
        "Yes — verbal",
        "Emergency, not obtained"
      ]
    },
    {
      "id": "anaes",
      "label": "Anaesthesia / Sedation",
      "ph": "Local lidocaine 1%",
      "panel": "Procedure"
    },
    {
      "id": "desc",
      "label": "Description",
      "kind": "area",
      "ph": "How the procedure was carried out…",
      "panel": "Record",
      "icon": "ti-clipboard-text"
    },
    {
      "id": "comp",
      "label": "Complications",
      "kind": "area",
      "ph": "None, or describe…",
      "panel": "Record"
    },
    {
      "id": "plan",
      "label": "Post-procedure instructions",
      "kind": "area",
      "ph": "Observation, analgesia, when to review…",
      "panel": "Aftercare",
      "icon": "ti-clipboard-check"
    }
  ]
});
</script>
<script src="pclinic-handoff.js"></script>
<style>
/* ═══ GG-UNIFORM-BG · Golden Gate photo background — identical to hub.html ═══
   Re-declared late in the document with equal specificity + !important so it
   wins over pclinic-ui.css `html, body { background: … !important }`. */
html { background-color: var(--bg, #f5f5f7) !important; }
body {
    background-color: transparent !important;
    background-image:
        linear-gradient(180deg, rgba(10, 8, 24, .22), rgba(10, 8, 24, 0) 24%, rgba(10, 8, 24, 0) 74%, rgba(10, 8, 24, .26)),
        url('hub-bg.jpg') !important;
    background-size: cover, cover !important;
    background-position: center, center !important;
    background-attachment: fixed, fixed !important;
    background-repeat: no-repeat, no-repeat !important;
}
[data-theme="dark"] body {
    background-color: transparent !important;
    background-image:
        linear-gradient(180deg, rgba(0, 0, 0, .55), rgba(0, 0, 0, .35) 50%, rgba(0, 0, 0, .60)),
        url('hub-bg.jpg') !important;
    background-size: cover, cover !important;
    background-position: center, center !important;
    background-attachment: fixed, fixed !important;
    background-repeat: no-repeat, no-repeat !important;
}
</style>
<style>
/* ═══ GG-CHUK-CANON · CHUK top-bar hierarchy — identical to doctor-dashboard ═══
   Bar 1 (CHUK menu), Bar 2 (patient ID) and Bar 3 (action bar) stack in a
   transparent, relative column exactly like the doctor dashboard. */
html body #pcMasterHeader, html body #pcMasterHeader.pc-master-header {
    display: flex !important; flex-direction: column !important; gap: 8px !important;
    position: relative !important; z-index: 40 !important;
    width: 100% !important; max-width: 100% !important; margin: 0 !important;
    padding: 8px 16px 4px !important; background: transparent !important;
    overflow: visible !important;
}
html body #pc_chuk_top_menu.chuk-top-menu { position: relative !important; top: auto !important; z-index: 3 !important; }
html body #pc_common_demo_bar.oc-demo-bar, html body .oc-demo-bar { position: relative !important; top: auto !important; z-index: 2 !important; margin: 0 !important; flex-shrink: 0 !important; }
html body #dcBar.dc-bar, html body #dcBar { position: relative !important; top: auto !important; z-index: 1 !important; margin: 0 !important; width: 100% !important; clear: both !important; flex-shrink: 0 !important; }
</style>
</body>
</html>
